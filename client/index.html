<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>Travnr — AI Travel Concierge & Flight Disruption Monitoring</title>
    <meta name="description" content="Travnr is an AI travel concierge that books your trip in a 2-minute call and rebooks you before flights get cancelled. For travelers and agencies." />

    <!-- Canonical -->
    <link rel="canonical" href="https://travnr.com/" />

    <!-- Theme + favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#0b1e3b" />

    <!-- Open Graph (Facebook, iMessage, Slack, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Travnr" />
    <meta property="og:url" content="https://travnr.com/" />
    <meta property="og:title" content="Travnr — AI Travel Concierge & Flight Disruption Monitoring" />
    <meta property="og:description" content="The AI travel concierge that watches every flight in real time and rebooks you before cancellations hit your phone. Book trips in two minutes." />
    <meta property="og:image" content="https://travnr.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://travnr.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Travnr — AI travel concierge that rebooks you before flights get cancelled" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Travnr — AI Travel Concierge & Flight Disruption Monitoring" />
    <meta name="twitter:description" content="The AI travel concierge that watches every flight in real time and rebooks you before cancellations hit your phone." />
    <meta name="twitter:image" content="https://travnr.com/og-image.png" />
    <meta name="twitter:image:alt" content="Travnr — AI travel concierge that rebooks you before flights get cancelled" />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Travnr",
      "url": "https://travnr.com",
      "logo": "https://travnr.com/og-image.png",
      "description": "AI travel concierge that books trips in a two-minute AI call and monitors every flight in real time, rebooking travelers before disruptions hit.",
      "contactPoint": [{
        "@type": "ContactPoint",
        "email": "hello@travnr.com",
        "contactType": "customer support",
        "availableLanguage": ["English"]
      }]
    }
    </script>

    <!-- Structured data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Travnr",
      "url": "https://travnr.com"
    }
    </script>

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Travnr",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Web",
      "url": "https://travnr.com",
      "description": "AI travel concierge that books trips in a 2-minute AI call, then monitors weather, on-time history, and live air traffic on every booking and rebooks travelers before cancellations land."
    }
    </script>

    <!-- Structured data: FAQPage (mirrors the visible FAQ on /travelers) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Travnr?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Travnr is an AI travel concierge. Take a quick AI phone call, share where you want to go, and get back tailored flight and trip options you can book in one click."
          }
        },
        {
          "@type": "Question",
          "name": "How is it different from a regular travel site?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Instead of comparing dozens of tabs, you talk for about two minutes and Travnr's AI does the searching. You get a short, curated set of options instead of a wall of results."
          }
        },
        {
          "@type": "Question",
          "name": "How long does the AI call take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most calls take about two minutes. We ask where you're going, when, and what matters to you (budget, direct flights, hotel style, etc.)."
          }
        },
        {
          "@type": "Question",
          "name": "Is this really AI, or a human travel agent?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The phone call and trip option generation are powered by AI. A human team handles edge cases when needed."
          }
        },
        {
          "@type": "Question",
          "name": "How much does it cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Trying Travnr and getting trip options is free. You only pay for flights or other travel you choose to book."
          }
        },
        {
          "@type": "Question",
          "name": "Can I book through Travnr?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Pick an option and book it through Travnr with secure payment. You'll get a confirmation email with your booking details."
          }
        },
        {
          "@type": "Question",
          "name": "Is my information private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We only use what you share to plan your trip and operate the service. See our Privacy Policy for details."
          }
        },
        {
          "@type": "Question",
          "name": "How do I get help?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Email hello@travnr.com any time. We respond personally, usually within a few hours."
          }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
