<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>Travnr — AI Travel Concierge & AI Travel Planner</title>
    <meta name="description" content="Travnr is an AI travel concierge. Take a 2-minute AI phone call and get tailored flight and trip options — no endless tabs, no comparison spreadsheets." />

    <!-- Canonical -->
    <link rel="canonical" href="https://travnr.com/" />

    <!-- Theme + favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#0b1e3b" />

    <!-- Open Graph (Facebook, iMessage, Slack, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Travnr" />
    <meta property="og:url" content="https://travnr.com/" />
    <meta property="og:title" content="Travnr — AI Travel Concierge & AI Travel Planner" />
    <meta property="og:description" content="Take a 2-minute AI phone call and get tailored flight and trip options. Travnr is your AI travel concierge — no endless tabs, no comparison spreadsheets." />
    <meta property="og:image" content="https://travnr.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://travnr.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Travnr — AI Travel Concierge" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Travnr — AI Travel Concierge & AI Travel Planner" />
    <meta name="twitter:description" content="Take a 2-minute AI phone call and get tailored flight and trip options. Your AI travel concierge." />
    <meta name="twitter:image" content="https://travnr.com/og-image.png" />
    <meta name="twitter:image:alt" content="Travnr — AI Travel Concierge" />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Travnr",
      "url": "https://travnr.com",
      "logo": "https://travnr.com/og-image.png",
      "description": "AI travel concierge that turns a quick AI phone call into tailored flight and trip options.",
      "contactPoint": [{
        "@type": "ContactPoint",
        "email": "hello@travnr.com",
        "contactType": "customer support",
        "availableLanguage": ["English"]
      }]
    }
    </script>

    <!-- Structured data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Travnr",
      "url": "https://travnr.com"
    }
    </script>

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Travnr",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Web",
      "url": "https://travnr.com",
      "description": "AI travel concierge and AI travel planner. A 2-minute AI phone call produces tailored flight and trip options."
    }
    </script>

    <!-- Structured data: FAQPage (mirrors the visible FAQ on the homepage) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Travnr?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Travnr is an AI travel concierge. You take a quick AI phone call, share where you want to go, and we send back tailored flight and trip options you can review and book."
          }
        },
        {
          "@type": "Question",
          "name": "How is Travnr different from a regular travel site?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Instead of clicking through dozens of tabs and filters, you talk for about 2 minutes and Travnr's AI does the searching for you. You get a short, curated set of options instead of a wall of results."
          }
        },
        {
          "@type": "Question",
          "name": "How long does the AI call take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most calls take about 2 minutes. We ask where you're going, when, and what matters to you (budget, direct flights, etc.)."
          }
        },
        {
          "@type": "Question",
          "name": "Is Travnr really AI, or is it a human travel agent?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The phone call and the trip option generation are powered by AI. A human team reviews edge cases and helps with anything tricky during this beta."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Travnr cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Trying Travnr and getting trip options is free during beta. You only pay for flights or other travel you choose to book."
          }
        },
        {
          "@type": "Question",
          "name": "Can I book through Travnr?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. When you pick an option you like, you can book it through Travnr with secure payment. You'll get a confirmation email with your booking details."
          }
        },
        {
          "@type": "Question",
          "name": "Is my information private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We only use the information you share to plan your trip and operate the service. See our Privacy Policy for details."
          }
        },
        {
          "@type": "Question",
          "name": "How do I get help?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Email hello@travnr.com any time. During beta we respond personally — usually within a few hours."
          }
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
