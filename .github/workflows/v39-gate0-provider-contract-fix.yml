name: V3.9 Gate0 Provider Contract Doc Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-active-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch active V3.9-f.8 provider-contract wording only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plan_path = Path("SEPmd/V3.9_DataCollectPlan_f.8.md")
          log_path = Path("SEPmd/V3.9_IMPLEMENTATION_LOG.md")
          plan = plan_path.read_text()
          log = log_path.read_text()

          correction = """> **LIVE PROVIDER-CONTRACT CORRECTION (2026-09-09; V3.9-f.8, no scientific redesign).** AeroDataBox changed marketplace plan versions in September 2026. For a newly subscribed or re-subscribed **RapidAPI Ultra** account, Gate 0 uses **50,000 API units/month as the current planning baseline**. This is not an admission constant: Gate 0 MUST freeze the exact positive entitlement, plan-version basis, subscription channel, TEAM account/subscription identity, billing-cycle dates, used/remaining units, and rate/account limits proven for the active experiment subscription. A grandfathered 60,000-unit personal/legacy subscription is evidence only for that exact subscription identity and MUST NOT be carried into a team app that re-subscribes. `MAX_DESIGN_CEILING=57,900` remains only an absolute Alert-credit upper bound; actual `phase6_alert_spend_ceiling` is derived from the verified Alert balance tree and may be lower. Current provider documentation classifies ordinary FIDS requests as Tier 2 / 2 API units per request; a zero difference inferred from delayed/unrelated quota headers is not accepted as a measured FIDS cost. API units and Alert credits remain separate ledgers. Phase 0 PASS remains valid; this is a live-provider-contract correction owned by Phase 1 / Gate 0.\n\n"""

          binding_marker = "# THE FINAL PLAN (binding)\n\n"
          if "LIVE PROVIDER-CONTRACT CORRECTION (2026-09-09" not in plan:
              if binding_marker not in plan:
                  raise SystemExit("Plan binding marker missing")
              plan = plan.replace(binding_marker, binding_marker + correction, 1)

          # Preserve the historical/reference appendix. The first NON-NORMATIVE
          # mention is in the introduction; the second begins the actual boundary.
          first_non = plan.find("NON-NORMATIVE")
          second_non = plan.find("NON-NORMATIVE", first_non + 1)
          if first_non < 0 or second_non < 0:
              raise SystemExit("Plan NON-NORMATIVE boundary not found twice")
          active, historical = plan[:second_non], plan[second_non:]

          replacements = [
              ("complete before the 60k starts.", "complete before affected authorized provider work starts."),
              ("The 60,000-unit entitlement is user-confirmed;\nthe subscription channel and current account mechanics are Gate-0 evidence:",
               "For a newly subscribed/re-subscribed RapidAPI Ultra account, **50,000 API units/month is the current planning baseline**. Gate 0 does not trust that baseline by itself: the subscription channel, plan-version basis, TEAM subscription identity, exact active entitlement, cycle, usage, and current account mechanics are evidence and are frozen from the active experiment account:"),
              ("`MONTHLY_PLAN_ENTITLEMENT_UNITS=60,000` is user-confirmed; Gate 0 verifies the active plan/channel, cycle dates, remaining/used units, and account limits.",
               "`MONTHLY_PLAN_ENTITLEMENT_UNITS` is a Gate-0-frozen live value; Gate 0 verifies the active TEAM plan/version/channel, exact entitlement, cycle dates, remaining/used units, and account limits. A new/re-subscribed RapidAPI Ultra subscription is planned at 50,000 units unless the active-account evidence proves another entitlement."),
              ("The `cycle_entitlement_units (=60,000)` line in the API tree applies only when\nGate 0 confirms that the actual subscribed channel exposes the user-confirmed\n60,000-unit monthly entitlement. If the verified channel uses a different\nquota, a non-expiring direct allocation, or another contract, record that\nchannel-specific entitlement and its units/expiry rules explicitly; do not\nsilently substitute 60,000 or mix it with the Alert ledger. Until that mapping\nis confirmed and reconciled, the API tree and every billable path remain\nBLOCKED.",
               "`cycle_entitlement_units` is the exact positive entitlement proven for the active experiment subscription and billing cycle. `plan_version_basis` records whether that subscription is current-new, grandfathered, provider-revised, or custom. A new/re-subscribed RapidAPI Ultra account is planned at 50,000 units as of this correction; a grandfathered 60,000-unit value is valid only for the exact legacy subscription identity that proves it. Never substitute either number across account/team identities, and never mix API units with the Alert ledger. Until this mapping is confirmed and reconciled, the API tree and every billable path remain BLOCKED."),
              ("cycle_entitlement_units (=60,000 while the USER-CONFIRMED plan remains active)",
               "cycle_entitlement_units (= exact positive Gate-0-frozen entitlement for the active experiment subscription/cycle)"),
              ("the **MAX_DESIGN_CEILING is 57,900 credits** as a frozen project-authorized upper bound; it is **not** derived by dividing/subtracting the 60,000-unit monthly entitlement",
               "the **MAX_DESIGN_CEILING is 57,900 credits** as a frozen project-authorized upper bound; it is **not** derived by dividing/subtracting any monthly API-unit entitlement"),
              ("**Gate 0:** verify (a) the USER-CONFIRMED 60,000-unit plan is still the active subscribed plan, record `subscription_channel`, and record cycle dates/current remaining units/units already consumed,",
               "**Gate 0:** verify (a) the active TEAM subscription identity, `subscription_channel`, `plan_version_basis`, exact positive `cycle_entitlement_units`, cycle dates/current remaining units/units already consumed, and current rate/account limits; use 50,000 only as the planning baseline for a newly subscribed/re-subscribed RapidAPI Ultra account and preserve 60,000 only when the exact grandfathered subscription proves it,"),
              ("confirm the USER-CONFIRMED 60,000-unit subscribed plan remains active; record subscription channel; verify cycle dates/current remaining units/usage, refill conversion/caps, and separate Alert-credit vs REST/API-unit ledgers.",
               "confirm the active TEAM subscription identity and plan-version basis; freeze its exact positive entitlement, subscription channel, cycle dates/current remaining units/usage and rate/account limits; verify refill conversion/caps and separate Alert-credit vs REST/API-unit ledgers. For a newly subscribed/re-subscribed RapidAPI Ultra account, 50,000 units is the current planning baseline, not a substitute for live evidence."),
              ("60,000 entitlement confirmed unchanged; live cycle/account values recorded; exact budget identities balance; no protected-floor double-counting; no unapproved spend/mutation",
               "active TEAM entitlement and plan-version basis verified from the same subscription identity; live cycle/account values recorded; exact budget identities balance; no protected-floor double-counting; no unapproved spend/mutation"),
              ("Record `MONTHLY_PLAN_ENTITLEMENT_UNITS=60000` as USER-CONFIRMED; verify the same subscribed plan remains active, record `subscription_channel`, and record billing-cycle dates, remaining units, and units already consumed.",
               "Use 50,000 API units/month as the planning baseline if the TEAM app must newly subscribe/re-subscribe to the current RapidAPI Ultra plan; then freeze the exact positive `MONTHLY_PLAN_ENTITLEMENT_UNITS`, `plan_version_basis`, TEAM subscription identity, `subscription_channel`, billing-cycle dates, remaining units, units already consumed, and rate/account limits proven for that active subscription. A grandfathered personal/legacy 60,000-unit entitlement cannot be transferred as evidence to a re-subscribed TEAM app."),
              ("60k → 58,900 credits", "monthly API entitlement → an assumed Alert-credit envelope"),
          ]
          for old, new in replacements:
              active = active.replace(old, new)

          plan = active + historical
          plan_path.write_text(plan)

          log_note = """> **LIVE PROVIDER-CONTRACT CORRECTION — 2026-09-09 (Phase 1 / Gate 0; V3.9-f.8).** Current-new/re-subscribed RapidAPI Ultra is planned at **50,000 API units/month**, but Gate 0 freezes the exact positive entitlement and plan-version basis proven for the active TEAM subscription. A grandfathered 60,000-unit personal/legacy entitlement is valid only for that exact subscription identity. `MAX_DESIGN_CEILING=57,900` remains an Alert-credit upper bound only; API units and Alert credits are separate ledgers. Current provider docs classify ordinary FIDS as Tier 2 / 2 API units per request. Phase 0 remains PASS; this correction does not reopen Phase 0 or create V3.10.\n\n"""
          if "LIVE PROVIDER-CONTRACT CORRECTION — 2026-09-09" not in log:
              anchor = "> **NEXT AUTHORIZED STEP: Phase 1 / Gate 0 = GO.** Gate 0 remains verification only; this Phase-0 closure does **not** authorize probes, canary, Phase 6, or other paid collection. Live security/account/deployment evidence remains owned by its later binding gate/prerequisite.\n"
              if anchor not in log:
                  raise SystemExit("Implementation Log status anchor missing")
              log = log.replace(anchor, anchor + log_note, 1)

          archive_marker = '<a id="sec-36"></a>'
          if archive_marker not in log:
              raise SystemExit("Implementation Log §36 boundary missing")
          active_log, archive_log = log.split(archive_marker, 1)
          log_replacements = [
              ("active subscribed plan; user-confirmed 60,000-unit entitlement still applicable;",
               "active TEAM subscription/plan identity; exact positive entitlement verified for that active subscription; `plan_version_basis`;"),
              ("At minimum include both budgets; 60,000 (only when confirmed for the actual\nchannel);",
               "At minimum include both budgets; exact active-subscription entitlement + `plan_version_basis` (with 50,000 as the planning baseline for a new/re-subscribed RapidAPI Ultra subscription);"),
              ("60,000 monthly entitlement is user-confirmed, channel unknown",
               "current new/re-subscribed RapidAPI Ultra planning baseline is 50,000; exact active TEAM entitlement/plan-version/channel/cycle/rate/account identity requires Gate-0 verification"),
              ("exact 60,000-cycle accounting + Alert/API identities",
               "exact active-subscription-cycle accounting + separate Alert/API identities"),
              ("**60,000** | **USER-CONFIRMED monthly plan entitlement** (`MONTHLY_PLAN_ENTITLEMENT_UNITS`); Gate 0 verifies the same plan is still active plus the current billing-cycle dates, remaining units, and already-consumed units",
               "**`cycle_entitlement_units`** | exact positive monthly API entitlement frozen from the active TEAM subscription. For a new/re-subscribed RapidAPI Ultra subscription, 50,000 units is the current planning baseline; a grandfathered 60,000 value is valid only for the exact legacy subscription identity that proves it"),
              ("cycle_entitlement_units (=60,000 while the USER-CONFIRMED plan remains active)",
               "cycle_entitlement_units (= exact positive entitlement verified for the active TEAM subscription/cycle)"),
              ("that the USER-CONFIRMED 60,000-unit subscribed plan remains active, `subscription_channel`, the current billing-cycle dates/used/remaining units,",
               "the active TEAM subscription identity, `subscription_channel`, `plan_version_basis`, exact positive entitlement, current billing-cycle dates/used/remaining units and rate/account limits; 50,000 is only the new/re-subscribed RapidAPI Ultra planning baseline and 60,000 is retained only for an exact-identity grandfathered subscription,"),
              ("**60,000 API units/month — USER-CONFIRMED** | Gate 0 verifies the same subscribed plan is active and records current cycle dates/remaining/consumed units; do not infer marketplace channel from entitlement alone.",
               "**Active TEAM entitlement — LIVE GATE-0 VERIFY** | Plan at 50,000 units/month for a new/re-subscribed RapidAPI Ultra subscription, then freeze the exact active entitlement, plan-version basis, channel, cycle, remaining/consumed units and account identity. A legacy 60,000 value is not transferable across subscription identities."),
              ("60k entitlement USER-CONFIRMED", "active TEAM entitlement + plan version LIVE VERIFY"),
              ("not `60,000/31` scientific arithmetic", "not monthly-entitlement/31 scientific arithmetic"),
              ("not `60,000−something` shorthand", "not monthly-API-entitlement arithmetic"),
          ]
          for old, new in log_replacements:
              active_log = active_log.replace(old, new)
          log_path.write_text(active_log + archive_marker + archive_log)

          # Fail closed if the active execution sections still contain the known
          # stale mandatory formulations. Intentional legacy/grandfather examples
          # may remain, but not these commands/PASS criteria.
          stale_plan = [
              "complete before the 60k starts",
              "MONTHLY_PLAN_ENTITLEMENT_UNITS=60000",
              "60,000 entitlement confirmed unchanged",
              "cycle_entitlement_units (=60,000 while the USER-CONFIRMED plan remains active)",
          ]
          second_non = plan_path.read_text().find("NON-NORMATIVE", plan_path.read_text().find("NON-NORMATIVE") + 1)
          active_final = plan_path.read_text()[:second_non]
          for s in stale_plan:
              if s in active_final:
                  raise SystemExit(f"stale active Plan wording remains: {s}")

          active_log_final = log_path.read_text().split(archive_marker, 1)[0]
          stale_log = [
              "user-confirmed 60,000-unit entitlement still applicable",
              "cycle_entitlement_units (=60,000 while the USER-CONFIRMED plan remains active)",
              "60k entitlement USER-CONFIRMED",
          ]
          for s in stale_log:
              if s in active_log_final:
                  raise SystemExit(f"stale active Log wording remains: {s}")
          PY

      - name: Commit only the two active-doc corrections and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v39-gate0-provider-contract-fix.yml
          git add SEPmd/V3.9_DataCollectPlan_f.8.md SEPmd/V3.9_IMPLEMENTATION_LOG.md
          git diff --cached --check
          git commit -m "V3.9 Gate0: freeze current provider entitlement contract"
          git push origin HEAD:main
