name: Phase5 Stage8 V0079 Prepared Day Proposal (NO provider, NO DB)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5V0079DailyPreparedQueryProposals_v39.ts'
      - 'tests/phase5_stage8_v0079_prepared_day_proposals_v39.test.ts'
      - '.github/workflows/phase5-stage8-v0079-daily-prepare-proposals-offline.yml'
  push:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5V0079DailyPreparedQueryProposals_v39.ts'
      - 'tests/phase5_stage8_v0079_prepared_day_proposals_v39.test.ts'
      - '.github/workflows/phase5-stage8-v0079-daily-prepare-proposals-offline.yml'
permissions:
  contents: read
jobs:
  stage8-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      AERODATABOX_API_KEY: ''
      V39_P5_SOURCE_DATABASE_URL: ''
      V39_DATABASE_RUNTIME_URL: ''
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx vitest run tests/phase5_stage8_v0079_prepared_day_proposals_v39.test.ts tests/phase5_dynamic_day_source_grid_v39.test.ts tests/phase5_committed_day_grid_readonly_v39.test.ts
      - name: Confirm no live operations
        run: |
          echo 'STAGE8 PROPOSALS ONLY: zero provider calls / zero DB writes / no Phase6 GO'
