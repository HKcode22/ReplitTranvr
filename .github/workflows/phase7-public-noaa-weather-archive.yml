name: Phase7 public NOAA calendar weather archive (NO PAID PROVIDER)
on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'ONE_PUBLIC_CALENDAR_NOAA_ARCHIVE_NO_PROVIDER'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: p7-calendar-public-noaa-archive
  cancel-in-progress: false
env:
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  DATABASE_URL: ''
  V39_DATABASE_RUNTIME_URL: ''
  AERODATABOX_API_KEY: ''
  RAPIDAPI_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
  P6_NOAA_PUBLIC_ARCHIVE_ENABLED: ${{ vars.P6_NOAA_PUBLIC_ARCHIVE_ENABLED }}
  P7_NOAA_MANUAL_CONFIRM: ${{ inputs.confirm }}
  V39_P5_APPROVED_CODE_SHA: ${{ secrets.V39_P5_APPROVED_CODE_SHA }}
  V39_P5_MANIFEST_SHA256: ${{ secrets.V39_P5_MANIFEST_SHA256 }}
  V39_P5_RIGHTS_SHA256: ${{ secrets.V39_P5_RIGHTS_SHA256 }}
  V39_P5_RELEASE_SHA256: ${{ secrets.V39_P5_RELEASE_SHA256 }}
  P6_NONPAID_DAILY_POLICY_BASE64: ${{ secrets.P6_NONPAID_DAILY_POLICY_BASE64 }}
  P6_NONPAID_DAILY_POLICY_SHA256: ${{ secrets.P6_NONPAID_DAILY_POLICY_SHA256 }}
  P6_PHASE7_NOAA_ARCHIVE_ISSUER_APPROVED: ${{ secrets.P6_PHASE7_NOAA_ARCHIVE_ISSUER_APPROVED }}
  P6_PHASE7_NOAA_SOURCE_PURPOSE_SHA256: ${{ secrets.P6_PHASE7_NOAA_SOURCE_PURPOSE_SHA256 }}
  P6_PHASE7_PRE_PRESERVATION_POLICY_SHA256: ${{ secrets.P6_PHASE7_PRE_PRESERVATION_POLICY_SHA256 }}
  P6_PHASE7_PRE_PROOF_REVIEWER_PUBLIC_KEY_BASE64: ${{ secrets.P6_PHASE7_PRE_PROOF_REVIEWER_PUBLIC_KEY_BASE64 }}
  P6_PHASE7_PRE_PROOF_REVIEWER_FINGERPRINT_SHA256: ${{ secrets.P6_PHASE7_PRE_PROOF_REVIEWER_FINGERPRINT_SHA256 }}
  P6_PHASE7_PRE_LANE_EVIDENCE_AUTHORITY_FINGERPRINT_SHA256: ${{ secrets.P6_PHASE7_PRE_LANE_EVIDENCE_AUTHORITY_FINGERPRINT_SHA256 }}
  P6_PHASE7_POST_OUTCOME_REVIEWER_FINGERPRINT_SHA256: ${{ secrets.P6_PHASE7_POST_OUTCOME_REVIEWER_FINGERPRINT_SHA256 }}
jobs:
  capture:
    if: ${{ github.repository == 'HKcode22/ReplitTranvr' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.P6_NOAA_PUBLIC_ARCHIVE_ENABLED == '1' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'ONE_PUBLIC_CALENDAR_NOAA_ARCHIVE_NO_PROVIDER')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      captured: ${{ steps.capture.outputs.captured }}
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      artifact_digest: ${{ steps.archive.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: capture
        name: Bounded public calendar station METAR and TAF capture (never private route selector)
        run: npx --no-install tsx scripts/v39_phase7_noaa_production_archive_v39.ts capture
      - id: archive
        if: ${{ steps.capture.outputs.captured == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: v39-p7-noaa-public-production-raw
          path: ${{ runner.temp }}/p7-noaa-production-raw/
          retention-days: 90
          if-no-files-found: error
  review:
    needs: capture
    if: ${{ success() && needs.capture.outputs.captured == '1' && github.repository == 'HKcode22/ReplitTranvr' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.P6_NOAA_PUBLIC_ARCHIVE_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Independently download complete public archive and sign exact reviewed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          P7_NOAA_ARTIFACT_ID: ${{ needs.capture.outputs.artifact_id }}
          P7_NOAA_ARTIFACT_DIGEST: ${{ needs.capture.outputs.artifact_digest }}
          P6_PHASE7_PRE_PROOF_REVIEWER_PRIVATE_KEY_BASE64: ${{ secrets.P6_PHASE7_PRE_PROOF_REVIEWER_PRIVATE_KEY_BASE64 }}
        run: npx --no-install tsx scripts/v39_phase7_noaa_production_archive_v39.ts review
      - uses: actions/upload-artifact@v4
        with:
          name: v39-p7-noaa-public-production-reviewed
          path: ${{ runner.temp }}/p7-noaa-production-reviewed/reviewed.json
          retention-days: 90
          if-no-files-found: error
