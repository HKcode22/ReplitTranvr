name: Phase5 one signed future POST (V0083, PAID ONLY AFTER PHASE6 GO)
# Distinct path identity for signed GH no-replay POST child history.
run-name: P5 POST ${{ inputs.private_transport != 'checkout' && inputs.post_packet_sha256 || inputs.frozen_future_post_packet }}
on:
  workflow_dispatch:
    inputs:
      frozen_future_post_packet:
        description: "Pre-reviewed future data-collection/phase5/frozen/*.json for ONE V0083 POST"
        required: true
        type: string
      private_transport:
        type: choice
        options: [checkout, stored, stored-current]
        default: checkout
      private_confirm:
        type: string
        required: false
      run_day:
        type: string
        required: false
      index_revision:
        type: string
        required: false
      index_sha256:
        type: string
        required: false
      shard_index:
        type: string
        required: false
      post_packet_sha256:
        type: string
        required: false
      route_sha256:
        type: string
        required: false
      confirm:
        description: "Type ONE_SIGNED_FUTURE_POST_V0083_MAX_2_UNITS_NO_RETRY"
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase6SameNeonEndpoint_v39.ts'
      - '.github/workflows/phase5-one-signed-future-post-v0083-main-manual.yml'
      - 'scripts/v39_phase5_one_signed_future_post_outcome_v0083_owner_v39.ts'
      - 'scripts/v39_phase6_private_post_existing_v0083_child_v39.ts'
      - 'server/lib/disruption/phase6StoredSourceRuntimeTrust_v39.mjs'
      - 'tests/phase6_private_post_actual_child_transport_v39.test.ts'
      - 'server/lib/disruption/phase5V0083FuturePostOriginalDb_v39.ts'
      - 'server/lib/disruption/phase6ActualPostOutcomeObservability_v39.ts'
      - 'tests/phase6_actual_post_outcome_observability_v39.test.ts'
      - 'tests/phase6_actual_post_outcome_real_pg16_v39.test.ts'
      - 'server/lib/disruption/phase5V0083RestDedicatedRolePool_v39.ts'
      - 'server/lib/disruption/fidsCensus_v3.ts'
      - 'tests/phase5_v0083_future_post_real_db_adapter_v39.test.ts'
      - 'tests/phase5_v0083_future_post_manual_owner_v39.test.ts'
      - 'data-collection/phase5/2026-11-10_V0083_FUTURE_POST_SIGNED_OWNER_CHECKPOINT.md'
permissions:
  contents: read
concurrency:
  group: phase5-future-post-one-shot-${{ (inputs.private_transport == 'stored' || inputs.private_transport == 'stored-current') && inputs.post_packet_sha256 || inputs.frozen_future_post_packet || github.ref }}
  cancel-in-progress: false
jobs:
  offline-pr-no-provider:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      AERODATABOX_API_KEY: ''
      DATABASE_URL: ''
      V39_P5_SOURCE_DATABASE_URL: ''
      P5_V39_OTHER_REST_REVIEW_DATABASE_URL: ''
      P5_V39_OTHER_REST_RESERVE_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Review V0083 real SQL path, exactly-once original + NO LIVE REST
        run: |
          set -Eeuo pipefail
          test -z "$AERODATABOX_API_KEY"
          test -z "$DATABASE_URL"
          test "$V39_PHASE6_PROCESS_ARMED" = 0
          npx vitest run tests/phase5_v0083_future_post_real_db_adapter_v39.test.ts tests/phase5_v0083_future_post_manual_owner_v39.test.ts tests/phase6_private_post_actual_child_transport_v39.test.ts tests/phase6_actual_post_outcome_observability_v39.test.ts tests/phase5_amendment_e_gateout_label_v39.test.ts
          echo P5_V0083_POST_SIGNED_OWNER_OFFLINE_CI_NO_SOURCE_USE_RIGHTS_OR_PAID_GO
  exact-signed-one-v0083-future-post:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'ONE_SIGNED_FUTURE_POST_V0083_MAX_2_UNITS_NO_RETRY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADB_AUTO_COLLECT: '0'
      GITHUB_ACTIONS: 'true'
      P5_FUTURE_POST_CONFIRM: ${{ inputs.confirm }}
      P6_PRIVATE_POST_CHILD_MODE: ${{ inputs.private_transport || 'checkout' }}
      P6_PRIVATE_POST_CHILD_CONFIRM: ${{ inputs.private_confirm }}
      P6_PRIVATE_POST_DYNAMIC_CHILD_APPROVED: ${{ inputs.private_transport == 'stored-current' && secrets.P6_PRIVATE_POST_DYNAMIC_CHILD_APPROVED || '' }}
      P6_PRIVATE_POST_CHILD_APPROVED: ${{ (inputs.private_transport == 'stored' || inputs.private_transport == 'stored-current') && secrets.P6_PRIVATE_POST_CHILD_APPROVED || '' }}
      P6_PRIVATE_POST_LEGACY_PATH: ${{ inputs.frozen_future_post_packet }}
      P6_PRIVATE_POST_DAY: ${{ inputs.run_day }}
      P6_PRIVATE_POST_REVISION: ${{ inputs.index_revision }}
      P6_PRIVATE_POST_INDEX_SHA: ${{ inputs.index_sha256 }}
      P6_PRIVATE_POST_SHARD: ${{ inputs.shard_index }}
      P6_PRIVATE_POST_PACKET_SHA: ${{ inputs.post_packet_sha256 }}
      P6_PRIVATE_POST_ROUTE_SHA: ${{ inputs.route_sha256 }}
      P6_PRIVATE_SOURCE_STORED_REVIEW_APPROVED: ${{ (inputs.private_transport == 'stored' || inputs.private_transport == 'stored-current') && secrets.P6_PRIVATE_SOURCE_STORED_REVIEW_APPROVED || '' }}
      P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64: ${{ (inputs.private_transport == 'stored' || inputs.private_transport == 'stored-current') && secrets.P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64 || '' }}
      P6_PRIVATE_POST_STORED_REVIEW_APPROVED: ${{ (inputs.private_transport == 'stored' || inputs.private_transport == 'stored-current') && secrets.P6_PRIVATE_POST_STORED_REVIEW_APPROVED || '' }}
      P6_PRIVATE_POST_REVIEWER_TRUST_BASE64: ${{ (inputs.private_transport == 'stored' || inputs.private_transport == 'stored-current') && secrets.P6_PRIVATE_POST_REVIEWER_TRUST_BASE64 || '' }}
      P6_PRIVATE_READER_DATABASE_URL: ${{ (inputs.private_transport == 'stored' || inputs.private_transport == 'stored-current') && secrets.P6_PRIVATE_READER_DATABASE_URL || '' }}
      V39_P5_RELEASE_SHA256: ${{ secrets.V39_P5_RELEASE_SHA256 }}
      V39_P5_POST_OWNER_APPROVED: ${{ secrets.V39_P5_POST_OWNER_APPROVED }}
      V39_PHASE5_FREEZE_SIGNED: ${{ secrets.V39_PHASE5_FREEZE_SIGNED }}
      V39_PHASE6_PROCESS_ARMED: ${{ secrets.V39_PHASE6_PROCESS_ARMED }}
      V39_PHASE5_SOURCE_RIGHTS_APPROVED: ${{ secrets.V39_PHASE5_SOURCE_RIGHTS_APPROVED }}
      V39_P5_POST_INDEPENDENT_REST_ROLES_APPROVED: ${{ secrets.V39_P5_POST_INDEPENDENT_REST_ROLES_APPROVED }}
      V39_P5_POST_APPROVED_CODE_SHA: ${{ secrets.V39_P5_POST_APPROVED_CODE_SHA }}
      V39_P5_POST_SIGNED_PACKET_SHA256: ${{ inputs.private_transport != 'stored-current' && secrets.V39_P5_POST_SIGNED_PACKET_SHA256 || '' }}
      V39_P5_MANIFEST_SHA256: ${{ secrets.V39_P5_MANIFEST_SHA256 }}
      V39_P5_RIGHTS_SHA256: ${{ secrets.V39_P5_RIGHTS_SHA256 }}
      V39_P5_POST_CATEGORY_BUDGET_SHA256: ${{ secrets.V39_P5_POST_CATEGORY_BUDGET_SHA256 }}
      V39_P5_POST_PROVIDER_CONTRACT_SHA256: ${{ secrets.V39_P5_POST_PROVIDER_CONTRACT_SHA256 }}
      V39_P5_POST_REVIEWED_REQUEST_SHA256: ${{ inputs.private_transport != 'stored-current' && secrets.V39_P5_POST_REVIEWED_REQUEST_SHA256 || '' }}
      V39_P5_POST_CONTEXT_SHA256: ${{ inputs.private_transport != 'stored-current' && secrets.V39_P5_POST_CONTEXT_SHA256 || '' }}
      V39_P5_FRAME_HASH: ${{ secrets.V39_P5_FRAME_HASH }}
      V39_P5_POST_PRICE_SHA256: ${{ secrets.V39_P5_POST_PRICE_SHA256 }}
      P5_V39_OTHER_REST_REVIEW_DATABASE_URL: ${{ secrets.P5_V39_OTHER_REST_REVIEW_DATABASE_URL }}
      P5_V39_OTHER_REST_RESERVE_DATABASE_URL: ${{ secrets.P5_V39_OTHER_REST_RESERVE_DATABASE_URL }}
      V39_P5_SOURCE_DATABASE_URL: ${{ secrets.V39_P5_SOURCE_DATABASE_URL }}
      AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
      DATABASE_URL: ''
      V39_DATABASE_RUNTIME_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: HARD gate before installing dependencies or running any DB/REST
        env:
          PACKET: ${{ inputs.frozen_future_post_packet }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$GITHUB_REPOSITORY" = HKcode22/ReplitTranvr
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ADB_AUTO_COLLECT" = 0
          test -z "$DATABASE_URL"
          test -z "$V39_DATABASE_RUNTIME_URL"
          test "$V39_P5_POST_OWNER_APPROVED" = 1
          test "$V39_PHASE5_FREEZE_SIGNED" = 1
          test "$V39_PHASE6_PROCESS_ARMED" = 1
          test "$V39_PHASE5_SOURCE_RIGHTS_APPROVED" = 1
          test "$V39_P5_POST_INDEPENDENT_REST_ROLES_APPROVED" = 1
          test "$V39_P5_POST_APPROVED_CODE_SHA" = "$GITHUB_SHA"
          case "$P6_PRIVATE_POST_CHILD_MODE" in
            checkout)
              [[ "$PACKET" =~ ^data-collection/phase5/frozen/[A-Za-z0-9_-]{8,100}\.json$ ]]
              test -f "$PACKET"
              test -z "$P6_PRIVATE_READER_DATABASE_URL"
              test -z "$P6_PRIVATE_POST_INDEX_SHA"
              test -z "$P6_PRIVATE_POST_PACKET_SHA"
              test -n "$V39_P5_POST_SIGNED_PACKET_SHA256"
              ;;
            stored)
              test "$PACKET" = PRIVATE_STORED
              test "$P6_PRIVATE_POST_CHILD_APPROVED" = 1
              test "$P6_PRIVATE_POST_CHILD_CONFIRM" = ONE_PRIVATE_POST_ORIGINAL_V0083_MAX_TWO_UNITS
              test -n "$P6_PRIVATE_READER_DATABASE_URL"
              test -n "$V39_P5_POST_SIGNED_PACKET_SHA256"
              test "$P6_PRIVATE_POST_PACKET_SHA" = "$V39_P5_POST_SIGNED_PACKET_SHA256"
              ;;
            stored-current)
              test "$PACKET" = PRIVATE_STORED
              test "$P6_PRIVATE_POST_CHILD_APPROVED" = 1
              test "$P6_PRIVATE_POST_DYNAMIC_CHILD_APPROVED" = 1
              test "$P6_PRIVATE_POST_CHILD_CONFIRM" = ONE_CURRENT_PRIVATE_POST_ORIGINAL_V0083_MAX_TWO_UNITS
              test -n "$P6_PRIVATE_READER_DATABASE_URL"
              [[ "$P6_PRIVATE_POST_PACKET_SHA" =~ ^[a-f0-9]{64}$ ]]
              test -z "$V39_P5_POST_SIGNED_PACKET_SHA256$V39_P5_POST_CONTEXT_SHA256$V39_P5_POST_REVIEWED_REQUEST_SHA256"
              ;;
            *) exit 2 ;;
          esac
          test -n "$P5_V39_OTHER_REST_REVIEW_DATABASE_URL"
          test -n "$P5_V39_OTHER_REST_RESERVE_DATABASE_URL"
          test -n "$V39_P5_SOURCE_DATABASE_URL"
          test -n "$AERODATABOX_API_KEY"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Exactly one future V0083 reviewed OUTCOME GET plus source original
        env:
          RELEASE_FILE: ${{ inputs.frozen_future_post_packet }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if [ "$P6_PRIVATE_POST_CHILD_MODE" = stored ] || [ "$P6_PRIVATE_POST_CHILD_MODE" = stored-current ]; then
            P6_PRIVATE_POST_CHILD_ENTRYPOINT=1 npx tsx scripts/v39_phase6_private_post_existing_v0083_child_v39.ts
          else
            npx tsx scripts/v39_phase5_one_signed_future_post_outcome_v0083_owner_v39.ts "$RELEASE_FILE"
          fi
          echo 'ONE_FUTURE_POST_ORIGINAL_NO_MODEL_LABEL_AND_NO_AUTOMATIC_RETRY'

  actual-post-partition-disposable-pg16:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      P6_POST_OUTCOME_DISPOSABLE_PG16: '1'
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      V39_P5_SOURCE_DATABASE_URL: ''
      P5_V39_OTHER_REST_RESERVE_DATABASE_URL: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Existing boot schema plus V0079 on disposable localhost only
        run: |
          set -Eeuo pipefail
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
          test "$V39_DATABASE_RUNTIME_URL" = "$DATABASE_URL"
          test "$V39_PHASE6_PROCESS_ARMED" = 0
          test "$ADB_AUTO_COLLECT" = 0
          test -z "$AERODATABOX_API_KEY$AERODATABOX_WEBHOOK_SECRET$V39_P5_SOURCE_DATABASE_URL$P5_V39_OTHER_REST_RESERVE_DATABASE_URL"
          npx --no-install tsx scripts/apply_boot_migrations_v39.ts
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql
      - name: Actual restricted SOURCE-role PRE partition and POST original SQL
        run: |
          npx --no-install vitest run tests/phase6_actual_post_outcome_real_pg16_v39.test.ts
