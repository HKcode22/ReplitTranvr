name: Phase5 V0082 Seven REST Category Atomic PG16 (NO Provider)
on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/staged/V0082__phase5_seven_rest_categories_exposed_partition_hold_v39.sql'
      - 'tests/phase5_v0082_seven_rest_category_real_pg16_v39.test.ts'
      - '.github/workflows/phase5-v0082-seven-rest-category-disposable-pg16.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/staged/V0082__phase5_seven_rest_categories_exposed_partition_hold_v39.sql'
      - 'tests/phase5_v0082_seven_rest_category_real_pg16_v39.test.ts'
      - '.github/workflows/phase5-v0082-seven-rest-category-disposable-pg16.yml'
permissions:
  contents: read
env:
  ADB_AUTO_COLLECT: '0'
  AERODATABOX_API_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
  V39_PHASE6_PROCESS_ARMED: '0'
  V39_P5_SOURCE_OWNER_APPROVED: '0'
  V39_P5_V0082_DISPOSABLE_PG16: '1'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable'
  V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable'
jobs:
  actual-seven-rest-categories-no-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v39_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v39_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Install B0062 + V0079 + V0080 + additive V0082 into disposable PG16 ONLY
        run: |
          set -Eeuo pipefail
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable'
          test -z "${AERODATABOX_API_KEY:-}"
          npx tsx scripts/apply_boot_migrations_v39.ts
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0080__phase5_bind_actual_github_run_id_before_fids_get_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0082__phase5_seven_rest_categories_exposed_partition_hold_v39.sql
          test "$(psql "$DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -c \
            "SELECT to_regclass('clean.phase5_fids_utc_rest_category_budget_v39') IS NOT NULL")" = 't'
      - name: Refuse incomplete seven-category budget, source tamper, and replay; prove BASE/SPLIT commit
        run: |
          set -Eeuo pipefail
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable'
          npx vitest run tests/phase5_v0082_seven_rest_category_real_pg16_v39.test.ts
          echo 'V0082_DISPOSABLE_PG16=PASS REST_BASE_SPLIT_ATOMIC=PASS PAID_HTTP=0 PRODUCTION_DDL=0 PHASE6_GO=0'
