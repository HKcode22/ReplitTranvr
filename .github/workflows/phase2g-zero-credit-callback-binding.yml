name: Phase2G Zero-Credit Callback Binding

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: 'Exact Git commit the live Replit runtime must report'
        required: true
        type: string
      callback_base:
        description: 'Exact HTTPS callback origin'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: phase2g-paid
    env:
      AERODATABOX_WEBHOOK_SECRET: ${{ secrets.AERODATABOX_WEBHOOK_SECRET }}
      V39_DATABASE_RUNTIME_URL: ${{ secrets.V39_DATABASE_RUNTIME_URL }}
    steps:
      - name: Refuse missing secret
        shell: bash
        run: |
          set -euo pipefail
          for key in AERODATABOX_WEBHOOK_SECRET V39_DATABASE_RUNTIME_URL; do
            [[ -n "${!key:-}" ]] || {
              echo "::error::Missing required binding secret: $key"
              exit 2
            }
          done

      - name: Verify live runtime exact head
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --silent --show-error --fail-with-body --max-time 15             "${{ inputs.callback_base }}/__v39/workspace-runtime")"
          node --input-type=module - "$HEALTH" "${{ inputs.expected_head }}" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          const expectedHead = String(process.argv[3] ?? "").toLowerCase();
          if (
            health?.schema !== "v39.phase2f-workspace-runtime.v1" ||
            health?.status !== "PASS" ||
            String(health?.git_head ?? "").toLowerCase() !== expectedHead ||
            health?.prepaid_route_registered !== true ||
            Number(health?.retention_hours) !== 168 ||
            health?.provider_mutation !== false ||
            health?.runtime_owner_mode !== "replit-managed-project" ||
            health?.managed_replit_workflow !== true ||
            health?.published_deployment !== false
          ) {
            console.error("LIVE_RUNTIME_BINDING=FAIL");
            process.exit(2);
          }
          console.log("LIVE_RUNTIME_BINDING=PASS");
          NODE

      - name: Verify GitHub/Replit runtime DB binding
        shell: bash
        run: |
          set -euo pipefail
          CHALLENGE="phase2g-${GITHUB_RUN_ID}-${{ inputs.expected_head }}"
          PROOF="$(CHALLENGE="$CHALLENGE" node --input-type=module <<'NODE'
          import { createHmac } from "node:crypto";
          const key = String(process.env.V39_DATABASE_RUNTIME_URL ?? "");
          const challenge = String(process.env.CHALLENGE ?? "");
          if (!key || !challenge) process.exit(2);
          process.stdout.write(createHmac("sha256", key).update(`phase2g-db-binding:${challenge}`).digest("hex"));
          NODE
          )"
          RESPONSE="$(curl --silent --show-error --fail-with-body --max-time 15             -X POST             -H "x-v39-phase2g-db-challenge: ${CHALLENGE}"             -H "x-v39-phase2g-db-proof: ${PROOF}"             "${{ inputs.callback_base }}/__v39/phase2g/runtime-db-binding")"
          node --input-type=module - "$RESPONSE" <<'NODE'
          const response = JSON.parse(process.argv[2]);
          if (
            response?.schema !== "v39.phase2g-runtime-db-binding.v1" ||
            response?.status !== "PASS" ||
            response?.provider_call !== false ||
            response?.provider_mutation !== false ||
            response?.database_mutation !== false ||
            Number(response?.alert_credits_spent) !== 0
          ) {
            console.error("GITHUB_REPLIT_RUNTIME_DB_BINDING=FAIL");
            process.exit(2);
          }
          console.log("GITHUB_REPLIT_RUNTIME_DB_BINDING=PASS");
          NODE

      - name: Verify GitHub/Replit webhook-secret binding
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --fail-with-body --max-time 15             -X POST             -H "x-v39-phase2g-webhook-secret: ${AERODATABOX_WEBHOOK_SECRET}"             "${{ inputs.callback_base }}/__v39/phase2g/webhook-secret-match")"
          node --input-type=module - "$RESPONSE" <<'NODE'
          const response = JSON.parse(process.argv[2]);
          if (
            response?.schema !== "v39.phase2g-webhook-secret-match.v1" ||
            response?.status !== "PASS" ||
            response?.provider_call !== false ||
            response?.provider_mutation !== false ||
            Number(response?.alert_credits_spent) !== 0
          ) {
            console.error("GITHUB_REPLIT_WEBHOOK_SECRET_BINDING=FAIL");
            process.exit(2);
          }
          console.log("GITHUB_REPLIT_WEBHOOK_SECRET_BINDING=PASS");
          console.log("PROVIDER_CALLS=0")
          console.log("PROVIDER_MUTATIONS=0")
          console.log("ALERT_CREDITS_SPENT=0")
          NODE
