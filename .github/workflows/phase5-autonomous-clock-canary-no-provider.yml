name: Phase5 Autonomous Six-Slot Clock Canary (NO provider)
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'ROLLING_REHEARSAL' &&
      format('P5 ROLLING {0} {1} {2}', inputs.chain_id, inputs.hop, inputs.parent_run_id) ||
      github.event_name == 'workflow_dispatch' && inputs.mode == 'BOUNDED_HANDOFF' &&
      format('P5 HANDOFF {0} {1} {2}', inputs.chain_id, inputs.hop, inputs.parent_run_id) ||
      'Phase5 Autonomous Six-Slot Clock Canary (NO provider)' }}
on:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [OBSERVE, BOUNDED_HANDOFF, ROLLING_REHEARSAL]
        default: OBSERVE
      handoff_confirm:
        type: string
        default: ''
      approved_main_sha:
        type: string
        default: ''
      chain_id:
        type: string
        default: ''
      hop:
        type: string
        default: '0'
      parent_run_id:
        type: string
        default: '0'
      deadline_utc:
        type: string
        default: ''
      sent_at_utc:
        type: string
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase5-autonomous-clock-canary-no-provider.yml'
      - 'scripts/v39_phase5_github_autonomous_clock_canary.mjs'
      - 'scripts/v39_phase5_github_bounded_handoff_canary.mjs'
      - 'tests/phase5_github_bounded_handoff_canary_v39.test.mjs'
      - 'scripts/v39_phase5_rolling_continuation_rehearsal.mjs'
      - 'tests/phase5_rolling_continuation_rehearsal_v39.test.mjs'
      - 'scripts/v39_phase6_rolling_github_preview_v39.mjs'
      - 'server/lib/disruption/phase6RollingGithubController_v39.mjs'
      - 'tests/phase5_github_autonomous_clock_canary_v39.test.mjs'
      - 'scripts/phase5_synthetic_webhook_readonly_preflight_owner.sh'
      - 'tests/phase5_synthetic_webhook_readonly_preflight.test.mjs'
      - 'scripts/v39_phase5_github_six_slot_coverage_report.mjs'
      - 'tests/phase5_github_six_slot_coverage_v39.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase5-autonomous-clock-canary-no-provider.yml'
      - 'scripts/v39_phase5_github_autonomous_clock_canary.mjs'
      - 'scripts/v39_phase5_github_bounded_handoff_canary.mjs'
      - 'tests/phase5_github_bounded_handoff_canary_v39.test.mjs'
      - 'scripts/v39_phase5_rolling_continuation_rehearsal.mjs'
      - 'tests/phase5_rolling_continuation_rehearsal_v39.test.mjs'
      - 'scripts/v39_phase6_rolling_github_preview_v39.mjs'
      - 'server/lib/disruption/phase6RollingGithubController_v39.mjs'
      - 'tests/phase5_github_autonomous_clock_canary_v39.test.mjs'
      - 'scripts/phase5_synthetic_webhook_readonly_preflight_owner.sh'
      - 'tests/phase5_synthetic_webhook_readonly_preflight.test.mjs'
      - 'scripts/v39_phase5_github_six_slot_coverage_report.mjs'
      - 'tests/phase5_github_six_slot_coverage_v39.test.mjs'
permissions:
  contents: read
  actions: read
env:
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  V39_PHASE6_OWNER_APPROVED: '0'
  AERODATABOX_API_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
  DATABASE_URL: ''
  V39_DATABASE_RUNTIME_URL: ''
jobs:
  six-slot-cron-observation-only:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'OBSERVE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refuse invalid six-slot UTC schedule; no-provider unit cases
        run: |
          set -Eeuo pipefail
          node --check scripts/v39_phase5_github_autonomous_clock_canary.mjs
          node --test tests/phase5_github_autonomous_clock_canary_v39.test.mjs
          node --test tests/phase5_github_bounded_handoff_canary_v39.test.mjs
          node --test tests/phase5_rolling_continuation_rehearsal_v39.test.mjs
          bash -n scripts/phase5_synthetic_webhook_readonly_preflight_owner.sh
          node --test tests/phase5_synthetic_webhook_readonly_preflight.test.mjs
          node --test tests/phase5_github_six_slot_coverage_v39.test.mjs
      - name: Record scheduled dispatch drift; not authority to collect
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/v39_phase5_github_autonomous_clock_canary.mjs --out "$RUNNER_TEMP/phase5-schedule-canary.json"
          echo 'PHASE5_SIX_SLOT_GITHUB_CLOCK_NO_PROVIDER_NO_DB_NO_PAID'
      - name: Read GitHub's ACTUAL scheduled jobs, detect missing or late slots (no provider)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          set +x
          TODAY="$(date -u -d '72 hours ago' '+%Y-%m-%d')"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase5-autonomous-clock-canary-no-provider.yml/runs?event=schedule&per_page=100&created=%3E%3D$TODAY" \
            > "$RUNNER_TEMP/phase5-cron-history-private.json"
          node scripts/v39_phase5_github_six_slot_coverage_report.mjs \
            --runs-file "$RUNNER_TEMP/phase5-cron-history-private.json" \
            --output "$RUNNER_TEMP/phase5-clock-coverage-sanitized.json"
          echo 'PHASE5_GH_CLOCK_HISTORICAL_READONLY_NO_PAID_PRODUCTION_AUTH'
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-github-clock-canary-readonly
          path: |
            ${{ runner.temp }}/phase5-schedule-canary.json
            ${{ runner.temp }}/phase5-clock-coverage-sanitized.json
          retention-days: 7
          if-no-files-found: error
  bounded-manual-github-handoff:
    # Separate explicit 3-run measurement. Does not execute SOURCE/PRE/POST,
    # does not change the existing scheduled six-slot observation.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'BOUNDED_HANDOFF' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    concurrency:
      group: p5-github-handoff-${{ inputs.chain_id }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      P5_GH_HANDOFF_CONFIRM: ${{ inputs.handoff_confirm }}
      P5_GH_HANDOFF_APPROVED_MAIN_SHA: ${{ inputs.approved_main_sha }}
      P5_GH_HANDOFF_CHAIN_ID: ${{ inputs.chain_id }}
      P5_GH_HANDOFF_HOP: ${{ inputs.hop }}
      P5_GH_HANDOFF_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      P5_GH_HANDOFF_DEADLINE_UTC: ${{ inputs.deadline_utc }}
      P5_GH_HANDOFF_SENT_AT_UTC: ${{ inputs.sent_at_utc }}
      RAPIDAPI_KEY: ''
      V39_P5_SOURCE_DATABASE_URL: ''
      P5_V39_PRE_DATABASE_URL: ''
      P6_PRIVATE_PUBLISHER_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Measure one exact-main handoff; dispatch at most one successor
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/v39_phase5_github_bounded_handoff_canary.mjs

  rolling-no-provider-rehearsal:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'ROLLING_REHEARSAL' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: write
    concurrency:
      group: p5-rolling-rehearsal-${{ inputs.chain_id }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      P5_ROLLING_REHEARSAL_CONFIRM: ${{ inputs.handoff_confirm }}
      P5_ROLLING_REHEARSAL_SHA: ${{ inputs.approved_main_sha }}
      P5_ROLLING_REHEARSAL_CHAIN: ${{ inputs.chain_id }}
      P5_ROLLING_REHEARSAL_HOP: ${{ inputs.hop }}
      P5_ROLLING_REHEARSAL_PARENT: ${{ inputs.parent_run_id }}
      P5_ROLLING_REHEARSAL_DEADLINE: ${{ inputs.deadline_utc }}
      P5_ROLLING_REHEARSAL_SENT: ${{ inputs.sent_at_utc }}
      RAPIDAPI_KEY: ''
      V39_P5_SOURCE_DATABASE_URL: ''
      P5_V39_PRE_DATABASE_URL: ''
      P5_V39_PREPARE_DATABASE_URL: ''
      P5_V39_T24_WITNESS_DATABASE_URL: ''
      P6_PRIVATE_READER_DATABASE_URL: ''
      P6_PRIVATE_PUBLISHER_DATABASE_URL: ''
      P5_RETENTION_READER_DATABASE_URL: ''
      P6_ROLLING_CONTROLLER_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Observe two real read-only rolling waves and admit at most one rehearsal successor
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/v39_phase5_rolling_continuation_rehearsal.mjs
      - name: Publish exact non-sensitive rehearsal successor receipt
        uses: actions/upload-artifact@v4
        with:
          name: phase5-rolling-rehearsal-${{ github.run_id }}
          path: ${{ runner.temp }}/p5-rolling-rehearsal-receipt.json
          retention-days: 7
          if-no-files-found: error
