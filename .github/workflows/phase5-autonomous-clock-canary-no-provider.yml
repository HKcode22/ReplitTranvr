name: Phase5 Autonomous Six-Slot Clock Canary (NO provider)
on:
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase5-autonomous-clock-canary-no-provider.yml'
      - 'scripts/v39_phase5_github_autonomous_clock_canary.mjs'
      - 'tests/phase5_github_autonomous_clock_canary_v39.test.mjs'
      - 'scripts/phase5_synthetic_webhook_readonly_preflight_owner.sh'
      - 'tests/phase5_synthetic_webhook_readonly_preflight.test.mjs'
      - 'scripts/v39_phase5_github_six_slot_coverage_report.mjs'
      - 'tests/phase5_github_six_slot_coverage_v39.test.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase5-autonomous-clock-canary-no-provider.yml'
      - 'scripts/v39_phase5_github_autonomous_clock_canary.mjs'
      - 'tests/phase5_github_autonomous_clock_canary_v39.test.mjs'
      - 'scripts/phase5_synthetic_webhook_readonly_preflight_owner.sh'
      - 'tests/phase5_synthetic_webhook_readonly_preflight.test.mjs'
      - 'scripts/v39_phase5_github_six_slot_coverage_report.mjs'
      - 'tests/phase5_github_six_slot_coverage_v39.test.mjs'
permissions:
  contents: read
  actions: read
env:
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  V39_PHASE6_OWNER_APPROVED: '0'
  AERODATABOX_API_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
  DATABASE_URL: ''
  V39_DATABASE_RUNTIME_URL: ''
jobs:
  six-slot-cron-observation-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refuse invalid six-slot UTC schedule; no-provider unit cases
        run: |
          set -Eeuo pipefail
          node --check scripts/v39_phase5_github_autonomous_clock_canary.mjs
          node --test tests/phase5_github_autonomous_clock_canary_v39.test.mjs
          bash -n scripts/phase5_synthetic_webhook_readonly_preflight_owner.sh
          node --test tests/phase5_synthetic_webhook_readonly_preflight.test.mjs
          node --test tests/phase5_github_six_slot_coverage_v39.test.mjs
      - name: Record scheduled dispatch drift; not authority to collect
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/v39_phase5_github_autonomous_clock_canary.mjs --out "$RUNNER_TEMP/phase5-schedule-canary.json"
          echo 'PHASE5_SIX_SLOT_GITHUB_CLOCK_NO_PROVIDER_NO_DB_NO_PAID'
      - name: Read GitHub's ACTUAL scheduled jobs, detect missing or late slots (no provider)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          set +x
          TODAY="$(date -u -d '72 hours ago' '+%Y-%m-%d')"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/phase5-autonomous-clock-canary-no-provider.yml/runs?event=schedule&per_page=100&created=%3E%3D$TODAY" \
            > "$RUNNER_TEMP/phase5-cron-history-private.json"
          node scripts/v39_phase5_github_six_slot_coverage_report.mjs \
            --runs-file "$RUNNER_TEMP/phase5-cron-history-private.json" \
            --output "$RUNNER_TEMP/phase5-clock-coverage-sanitized.json"
          echo 'PHASE5_GH_CLOCK_HISTORICAL_READONLY_NO_PAID_PRODUCTION_AUTH'
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-github-clock-canary-readonly
          path: |
            ${{ runner.temp }}/phase5-schedule-canary.json
            ${{ runner.temp }}/phase5-clock-coverage-sanitized.json
          retention-days: 7
          if-no-files-found: error
