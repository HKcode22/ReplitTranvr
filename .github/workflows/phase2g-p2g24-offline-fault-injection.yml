            tests/phase2g_historical_failure_regressions_v39.test.ts \
            tests/phase2g_delivery_gap_schema_v39.test.ts \
            tests/phase2g_signed_cleanup_attestation_v39.test.ts \
            tests/phase2g_yssy_oct12_stage1_calendar_v39.test.ts \
            tests/phase2g_yssy_20261012_zero_credit_prep_v39.test.ts \
            tests/phase2g_stage1_subscription_exact_owner_v39.test.ts \
            tests/phase2g_durable_ingress_offline_prototype_v39.test.ts \
            tests/phase2g_cf_sandbox_ingress_worker_v39.test.ts \
            tests/phase2g_bounded_source_wire_v39.test.ts \
            tests/phase2g_p10_synthetic_wrangle_config_guard_v39.test.ts \
            tests/phase2g_p10_readonly_hosted_evidence_gate_v39.test.ts \
            tests/phase2g_cf_sandbox_provenance_hmac_v39.test.ts \
            tests/phase2g_yssy_120m_free_queue_interruption_model_v39.test.ts \
            tests/phase2g_cf_free_queue_only_worker_v39.test.ts \
            tests/phase2g_p2g24_prepublish_real_db_prelaunch_v39.test.ts \
            tests/phase2g_p2g24_db_pool_acquisition_bound_v39.test.ts \
            tests/phase2g_p2g24_prepaid_transport_diagnostics_v39.test.ts \
            tests/phase2g_yssy_zero_billable_delivery_retries_v39.test.ts \
            tests/phase2g_yssy_bounded_loss_scientific_adjudication_v39.test.ts \
            tests/phase2g_observed_subset_descriptive_scope_v39.test.ts \
            tests/phase2g_independent_pg_delivery_readonly_observer_v39.test.ts \
            tests/phase2g_synthetic_three_replit_failover_feasibility_v39.test.ts \
            tests/phase2g_replit_only_postgres_failover_gate_v39.test.ts \
            tests/phase2g_synthetic_fixed_frontdoor_spool_v39.test.ts \
            tests/phase2g_synthetic_replit_local_wallclock_v39.test.ts \
