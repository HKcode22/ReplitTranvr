      - tests/phase2g_real_supervisor_six_plus_four_mapping_v39.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-fault-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No provider key, paid probe authorization, deployment token,
      # database URL or webhook secret is connected to this job.
      CI: "true"
    steps:
      - name: Checkout only the isolated incident investigation branch
        uses: actions/checkout@v4
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install pinned dependencies (no audit)
        run: npm ci --no-audit --no-fund
      - name: Execute real callbackHealthy under 18 network-isolated scenarios
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/phase2g_p2g24_callback_health_behavior_v39.test.cjs
          echo "PAID_PROVIDER_CALLS=0"
          echo "SCIENTIFIC_DATABASE_QUERIES=0"
          echo "DEPLOYMENT_CHANGES=0"
      - name: Run existing receiver regressions
        run: |
          npx vitest run \
            tests/phase2g_p2g24_prepaid_persistence_fault_injection_v39.test.ts \
            tests/phase2g_yssy_oct12_stage1_calendar_v39.test.ts \
            tests/phase2g_durable_ingress_offline_prototype_v39.test.ts \
            tests/phase2g_cf_sandbox_ingress_worker_v39.test.ts \
            tests/phase2g_cf_sandbox_provenance_hmac_v39.test.ts \
            tests/phase2g_yssy_120m_free_queue_interruption_model_v39.test.ts \
            tests/phase2g_cf_free_queue_only_worker_v39.test.ts \
            tests/phase2g_p2g24_prepublish_real_db_prelaunch_v39.test.ts \
            tests/phase2g_p2g24_db_pool_acquisition_bound_v39.test.ts \
            tests/phase2g_p2g24_prepaid_transport_diagnostics_v39.test.ts \
            tests/phase2g_yssy_zero_billable_delivery_retries_v39.test.ts \
            tests/phase2g_yssy_synthetic_120min_acceptance_v39.test.ts \
            tests/phase2g_dual_wire_canonical_source_receipt_v39.test.ts \
            tests/phase2g_dual_receipt_queue_admission_v39.test.ts \
            tests/phase2g_dual_store_receipt_fault_matrix_v39.test.ts \
            tests/phase2g_postgres_continuity_guard_v39.test.ts \
            tests/phase2g_signed_attempt_reconciliation_v39.test.ts \
            tests/phase2g_synthetic_owner_freeze_signature_v39.test.ts \
            tests/phase2g_synthetic_two_stage_owner_protocol_v39.test.ts \
            tests/phase2g_synthetic_unknown_create_outcome_v39.test.ts \
            tests/phase2g_synthetic_physical_item_continuity_v39.test.ts \
            tests/phase2g_synthetic_watchdog_tolerance_gate_v39.test.ts \
            tests/phase2g_signed_attempt_watchdog_corroboration_v39.test.ts \
            tests/phase2g_synthetic_watchdog_six_plus_four_v39.test.ts \
            tests/phase2g_real_supervisor_six_plus_four_mapping_v39.test.ts \
            tests/phase2g_p2g24_callback_receiver_health_v39.test.ts \
            tests/phase2g_published_callback_only_v39.test.ts \
            tests/phase2g_watchdog_recovery_contract_v39.test.ts \
            tests/phase2g_zero_credit_callback_binding_v39.test.ts
      - name: Compile read-only blob auditor without touching database or storage
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild scripts/v39_p2g24_readonly_blob_integrity_audit.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=/tmp/p2g24-blob-readonly-auditor.mjs
          node --check /tmp/p2g24-blob-readonly-auditor.mjs
          echo 'BLOB_AUDITOR_EXECUTED=false'
          npx esbuild scripts/v39_p2g24_queue_only_size_feasibility_readonly.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=/tmp/p2g24-queue-sizing-readonly-auditor.mjs
          node --check /tmp/p2g24-queue-sizing-readonly-auditor.mjs
          echo 'QUEUE_SIZE_AUDITOR_EXECUTED=false'
      - name: Typecheck server
        run: npm run v39:typecheck

  disposable-postgres-persistence:
    name: Ephemeral PostgreSQL V3.9 persistence fault integration (no paid credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: p2g_fixture
          POSTGRES_PASSWORD: fixture_only_password
          POSTGRES_DB: p2g_stage1_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p2g_fixture -d p2g_stage1_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      P2G_DISPOSABLE_POSTGRES: "YES"
      P2G_FIXTURE_POSTGRES_URL: postgresql://p2g_fixture:fixture_only_password@127.0.0.1:5432/p2g_stage1_fixture
      # Deliberately NO V39_DATABASE_RUNTIME_URL, AERODATABOX_API_KEY,
      # Cloudflare tokens, Replit secrets or scientific DB credentials.
      CI: "true"
    steps:
      - name: Checkout isolated branch only
        uses: actions/checkout@v4
      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund
      - name: Run actual V3.9 persistence against disposable PostgreSQL 16
        run: |
          set -euo pipefail
          test -z "${V39_DATABASE_RUNTIME_URL:-}"
          test -z "${AERODATABOX_API_KEY:-}"
          npx vitest run tests/phase2g_p2g24_actual_postgres_persistence_integration_v39.test.ts
          echo 'AERODATABOX_PROVIDER_CALLS=0'
          echo 'SCIENTIFIC_DATABASE_QUERIES=0'
          echo 'CLOUDFLARE_RESOURCES=0'
          echo 'REPLIT_DEPLOYMENTS=0'
      - name: Prove actual disposable PostgreSQL SIGKILL clears UNLOGGED only
        shell: bash
        env:
          PG_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_TEST_CONTAINER_ID"
          IMAGE="$(docker inspect --format '{{.Config.Image}}' "$PG_TEST_CONTAINER_ID")"
          test "$IMAGE" = "postgres:16"
          docker exec "$PG_TEST_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U p2g_fixture -d p2g_stage1_fixture -c "CREATE SCHEMA p2g_unlogged_crash_fixture" >/dev/null
          docker exec "$PG_TEST_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U p2g_fixture -d p2g_stage1_fixture -c "CREATE TABLE p2g_unlogged_crash_fixture.logged_receipt (id int PRIMARY KEY); CREATE UNLOGGED TABLE p2g_unlogged_crash_fixture.unlogged_session (id int PRIMARY KEY); INSERT INTO p2g_unlogged_crash_fixture.logged_receipt VALUES (1); INSERT INTO p2g_unlogged_crash_fixture.unlogged_session VALUES (1);" >/dev/null
          BEFORE="$(docker exec "$PG_TEST_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U p2g_fixture -d p2g_stage1_fixture -tA -c "SELECT (SELECT count(*) FROM p2g_unlogged_crash_fixture.logged_receipt)::text || '|' || (SELECT count(*) FROM p2g_unlogged_crash_fixture.unlogged_session)::text")"
          test "$BEFORE" = "1|1"
          echo "BEFORE_UNCLEAN_STOP_LOGGED_AND_UNLOGGED=$BEFORE"
          # Crash ONLY this isolated CI PostgreSQL service, never Replit.
          docker kill --signal=KILL "$PG_TEST_CONTAINER_ID" >/dev/null
          docker start "$PG_TEST_CONTAINER_ID" >/dev/null
          READY=0
          for i in $(seq 1 45); do
            if docker exec "$PG_TEST_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U p2g_fixture -d p2g_stage1_fixture -tA -c "SELECT 1" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = 1
          AFTER="$(docker exec "$PG_TEST_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U p2g_fixture -d p2g_stage1_fixture -tA -c "SELECT (SELECT count(*) FROM p2g_unlogged_crash_fixture.logged_receipt)::text || '|' || (SELECT count(*) FROM p2g_unlogged_crash_fixture.unlogged_session)::text")"
          echo "AFTER_UNCLEAN_RESTART_LOGGED_AND_UNLOGGED=$AFTER"
          test "$AFTER" = "1|0"
          echo "ACTUAL_UNLOGGED_CRASH_RESET=CONFIRMED"
          # Original synthetic first-receipt timestamp + blinded digests were
          # written in the preceding actual V3.9 disposable PG integration.
          # They MUST survive a genuine unclean restart unlike UNLOGGED rows.
          RECEIPT_ROW="$(docker exec "$PG_TEST_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U p2g_fixture -d p2g_stage1_fixture -tA -c "SELECT count(*)::text || '|' || to_char(min(first_edge_received_utc) AT TIME ZONE 'UTC','YYYY-MM-DD HH24:MI:SS.MS') || '|' || min(length(attempt_hmac))::text || '|' || min(length(wire_sha256))::text || '|' || min(length(canonical_sha256))::text FROM p2g_dual_receipt_crash_fixture.receipt_metadata")"
          echo "DUAL_HASH_METADATA_AFTER_UNCLEAN_RESTART=$RECEIPT_ROW"
          test "$RECEIPT_ROW" = "1|2026-10-12 03:01:02.000|64|64|64"
          echo "DUAL_HASH_FIRST_RECEIPT_RESTART_SURVIVAL=CONFIRMED"
          # The signed two-stage test inserted EXACTLY ONE LOGGED binding in
          # an entirely disposable fixture schema. It must survive crash;
          # this proves only local SQL feasibility, never provider uniqueness.
          OWNER_ROWS="$(docker exec "$PG_TEST_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U p2g_fixture -d p2g_stage1_fixture -tA -c "SELECT count(*)::int FROM p2g_two_stage_fixture.owner_bindings")"
          test "$OWNER_ROWS" = "1"
          echo "TWO_STAGE_LOGGED_OWNER_BINDING_AFTER_UNCLEAN_RESTART=$OWNER_ROWS"
          echo "REAL_PROVIDER_SUBSCRIPTION_CREATION_PROVEN=false"


          echo "PROVIDER_CALLS=0"
          echo "SCIENTIFIC_DB_QUERIES=0"
          echo "CLOUDFLARE_CALLS=0"
