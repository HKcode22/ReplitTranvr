      - tests/phase2g_signed_attempt_reconciliation_v39.test.ts
      - experiments/phase2g_rehearsal/synthetic_owner_freeze_signature_v39.ts
      - tests/phase2g_synthetic_owner_freeze_signature_v39.test.ts
      - experiments/phase2g_rehearsal/synthetic_two_stage_owner_protocol_v39.ts
      - tests/phase2g_synthetic_two_stage_owner_protocol_v39.test.ts
      - experiments/phase2g_rehearsal/disposable_two_stage_owner_journal_v39.ts
      - experiments/phase2g_rehearsal/synthetic_unknown_create_outcome_v39.ts
      - tests/phase2g_synthetic_unknown_create_outcome_v39.test.ts
      - experiments/phase2g_rehearsal/synthetic_physical_item_continuity_v39.ts
      - tests/phase2g_synthetic_physical_item_continuity_v39.test.ts
      - experiments/phase2g_rehearsal/synthetic_watchdog_tolerance_gate_v39.ts
      - tests/phase2g_synthetic_watchdog_tolerance_gate_v39.test.ts
      - tests/phase2g_signed_attempt_watchdog_corroboration_v39.test.ts
      - experiments/phase2g_rehearsal/synthetic_watchdog_six_plus_four_v39.ts
      - tests/phase2g_synthetic_watchdog_six_plus_four_v39.test.ts
