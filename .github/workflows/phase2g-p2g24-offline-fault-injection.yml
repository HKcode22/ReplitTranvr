            tests/phase2g_actual_stage1_watchdog_six_plus_six_v39.test.ts \
            tests/phase2g_paid_owner_termination_bound_v39.test.ts \
            tests/phase2g_p2g24_callback_receiver_health_v39.test.ts \
            tests/phase2g_published_callback_only_v39.test.ts \
            tests/phase2g_watchdog_recovery_contract_v39.test.ts \
            tests/phase2g_zero_credit_callback_binding_v39.test.ts
      - name: Compile read-only blob auditor without touching database or storage
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild scripts/v39_p2g24_readonly_blob_integrity_audit.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=/tmp/p2g24-blob-readonly-auditor.mjs
          node --check /tmp/p2g24-blob-readonly-auditor.mjs
          echo 'BLOB_AUDITOR_EXECUTED=false'
          npx esbuild scripts/v39_p2g24_queue_only_size_feasibility_readonly.ts \
            --bundle --platform=node --format=esm --packages=external \
            --outfile=/tmp/p2g24-queue-sizing-readonly-auditor.mjs
          node --check /tmp/p2g24-queue-sizing-readonly-auditor.mjs
          echo 'QUEUE_SIZE_AUDITOR_EXECUTED=false'
      - name: Typecheck server
        run: npm run v39:typecheck
      - name: Generate YSSY zero-credit prep receipt (NO PAID AUTH)
        shell: bash
        run: |
          set -euo pipefail
          test -z "${V39_DATABASE_RUNTIME_URL:-}"
          test -z "${AERODATABOX_API_KEY:-}"
          node --import tsx scripts/v39_phase2g_yssy_20261012_zero_credit_prep_v39.ts \
            --out "${RUNNER_TEMP}/yssy-20261012-zero-credit-prep.json"
          sha256sum "${RUNNER_TEMP}/yssy-20261012-zero-credit-prep.json"
          echo "AUTH_CREATED=false"
          echo "PROVIDER_CALLS=0"
          echo "PAID_LAUNCH=NOT_AUTHORIZED"
      - name: Read published Replit runtime version (GET only; no secrets)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://replit-tranvr--hk84164.replit.app/__v39/workspace-runtime"
          OUT="${RUNNER_TEMP}/yssy-published-runtime-readonly.json"
          if curl -fsS --connect-timeout 5 --max-time 15 \
            -H "accept: application/json" "${URL}" -o "${OUT}"; then
            node --input-type=module - "${OUT}" "${GITHUB_SHA}" <<'NODE'
          import fs from "node:fs";
          let raw={};try{raw=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));}catch{raw={};}
          const actual=String(raw?.git_head??"").toLowerCase();
          const expected=String(process.argv[3]??"").toLowerCase();
          const ok=raw?.schema==="v39.phase2f-workspace-runtime.v1"&&
            raw?.status==="PASS"&&actual===expected&&
            raw?.prepaid_route_registered===true&&
            raw?.published_deployment===true;
          console.log(JSON.stringify({
            schema:"v39.yssy.p18.readonly-published-version.v1",
            observed_at_utc:new Date().toISOString(),
            status:ok?"CLAIMED_MATCH_NOT_POST_PROVEN":"PUBLISHED_VERSION_MISMATCH_OR_INVALID",
            published_git_head:actual||null,
            expected_branch_head:expected,
            provider_calls:0,provider_mutations:0,alert_credits_spent:0,
            published_signed_webhook_persistence_verified:false
          },null,2));
          if(process.env.GITHUB_STEP_SUMMARY){
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "### YSSY live release: HOLD — CI success is NOT paid GO\\n"+
              "- Read-only published claimed HEAD: \`"+(actual||"unavailable")+"\`\\n"+
              "- Reviewed branch HEAD: \`"+expected+"\`\\n"+
              "- Deployment parity claim: **"+(ok?"claimed match, signed POST still unverified":"MISMATCH / INVALID")+"**\\n"+
              "- Fresh retry approval, provider balance, signed test POST and paid AUTH: **NOT VERIFIED**\\n"
            );
          }
          NODE
          else
            printf '%s\n' '{"schema":"v39.yssy.p18.readonly-published-version.v1","status":"READONLY_PUBLIC_GET_UNREACHABLE","provider_calls":0,"alert_credits_spent":0,"published_signed_webhook_persistence_verified":false}' > "${OUT}"
            echo "PUBLISHED_RUNTIME=UNREACHABLE_NO_READINESS_CLAIM"
            echo '### YSSY live release: HOLD — published GET unreachable; tests not paid GO' >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Preserve YSSY draft receipt and optional published snapshot
        uses: actions/upload-artifact@v4
        with:
          name: yssy-oct12-zero-credit-prep
          path: |
            ${{ runner.temp }}/yssy-20261012-zero-credit-prep.json
            ${{ runner.temp }}/yssy-published-runtime-readonly.json
          if-no-files-found: error
          retention-days: 7

  disposable-postgres-persistence:
    name: Ephemeral PostgreSQL V3.9 persistence fault integration (no paid credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: p2g_fixture
          POSTGRES_PASSWORD: fixture_only_password
          POSTGRES_DB: p2g_stage1_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p2g_fixture -d p2g_stage1_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      P2G_DISPOSABLE_POSTGRES: "YES"
      P2G_FIXTURE_POSTGRES_URL: postgresql://p2g_fixture:fixture_only_password@127.0.0.1:5432/p2g_stage1_fixture
      # Deliberately NO V39_DATABASE_RUNTIME_URL, AERODATABOX_API_KEY,
      # Cloudflare tokens, Replit secrets or scientific DB credentials.
      CI: "true"
    steps:
      - name: Checkout isolated branch only
        uses: actions/checkout@v4
      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --no-audit --no-fund
      - name: Run actual V3.9 persistence against disposable PostgreSQL 16
        run: |
          set -euo pipefail
          test -z "${V39_DATABASE_RUNTIME_URL:-}"
          test -z "${AERODATABOX_API_KEY:-}"
          npx vitest run tests/phase2g_p2g24_actual_postgres_persistence_integration_v39.test.ts
          echo 'AERODATABOX_PROVIDER_CALLS=0'
          echo 'SCIENTIFIC_DATABASE_QUERIES=0'
          echo 'CLOUDFLARE_RESOURCES=0'
          echo 'REPLIT_DEPLOYMENTS=0'
      - name: Prove actual disposable PostgreSQL SIGKILL clears UNLOGGED only
        shell: bash
        env:
          PG_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$PG_TEST_CONTAINER_ID"
          IMAGE="$(docker inspect --format '{{.Config.Image}}' "$PG_TEST_CONTAINER_ID")"
          test "$IMAGE" = "postgres:16"
          docker exec "$PG_TEST_CONTAINER_ID" psql -X -v ON_ERROR_STOP=1 -U p2g_fixture -d p2g_stage1_fixture -c "CREATE SCHEMA p2g_unlogged_crash_fixture" >/dev/null
