      - experiments/phase2g_rehearsal/dual_store_receipt_fault_matrix_v39.ts
      - tests/phase2g_dual_store_receipt_fault_matrix_v39.test.ts
      - experiments/phase2g_rehearsal/postgres_continuity_guard_v39.ts
      - tests/phase2g_postgres_continuity_guard_v39.test.ts
