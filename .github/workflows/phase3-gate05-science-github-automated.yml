name: Phase3 Gate05 WSSS Science GitHub Automated One-Pilot
run-name: Gate05 Auto Science ${{ inputs.scope_id }}
# One up-front bootstrap. All timing executes on independent GitHub runners.
# An unarmed STOP, missed clock, stale source, or duplicate CREATE fails closed.
on:
  workflow_dispatch:
    inputs:
      scope_id:
        description: New signed WSSS scientific scope UUID
        required: true
        type: string
      confirmation:
        description: Exact PREAPPROVED_GATE05_ONE_PILOT_GITHUB_AUTOMATION
        required: true
        type: string
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: gate05-science-one-paid-global
  cancel-in-progress: false
jobs:
  exact-owned-stop:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'PREAPPROVED_GATE05_ONE_PILOT_GITHUB_AUTOMATION' }}
    name: exact-owned-stop
    environment: gate05-safety
    runs-on: ubuntu-latest
    timeout-minutes: 145
    env:
      GATE05_SAFETY_ENV_NAME: gate05-safety
      GATE05_SAFETY_APPROVED_RUNNER_SHA: ${{ vars.GATE05_SAFETY_APPROVED_RUNNER_SHA }}
      GATE05_SAFETY_APPROVED_RECEIVER_SOURCE: ${{ vars.GATE05_SAFETY_APPROVED_RECEIVER_SOURCE }}
      GATE05_SAFETY_APPROVED_SCOPE: ${{ vars.GATE05_SAFETY_APPROVED_SCOPE }}
      GATE05_SAFETY_APPROVED_AUTH_SHA256: ${{ vars.GATE05_SAFETY_APPROVED_AUTH_SHA256 }}
      GATE05_SAFETY_APPROVED_STOP_TICKET_SHA256: ${{ vars.GATE05_SAFETY_APPROVED_STOP_TICKET_SHA256 }}
      GATE05_SAFETY_APPROVED_START_UTC: ${{ vars.GATE05_SAFETY_APPROVED_START_UTC }}
      GATE05_SAFETY_APPROVED_STOP_UTC: ${{ vars.GATE05_SAFETY_APPROVED_STOP_UTC }}
      GATE05_SAFETY_APPROVED_STARTING_CREDITS: ${{ vars.GATE05_SAFETY_APPROVED_STARTING_CREDITS }}
      GATE05_SAFETY_APPROVED_LIMIT: ${{ vars.GATE05_SAFETY_APPROVED_LIMIT }}
      GATE05_SAFETY_APPROVED_EARLY_STOP: ${{ vars.GATE05_SAFETY_APPROVED_EARLY_STOP }}
      GATE05_SAFETY_APPROVED_REST_LIMIT: ${{ vars.GATE05_SAFETY_APPROVED_REST_LIMIT }}
      DATABASE_URL: ""
      V39_DATABASE_RUNTIME_URL: ""
    steps:
      - name: Verify GitHub source and independently approved safety scope
        env:
          INPUT_SCOPE: ${{ inputs.scope_id }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_SHA" = "$GATE05_SAFETY_APPROVED_RUNNER_SHA"
          test "$INPUT_SCOPE" = "$GATE05_SAFETY_APPROVED_SCOPE"
          test "$GATE05_SAFETY_APPROVED_LIMIT" = 500
          test "$GATE05_SAFETY_APPROVED_EARLY_STOP" = 350
          test "$GATE05_SAFETY_APPROVED_REST_LIMIT" = 12
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Wait until T-minus-10m on GitHub-hosted runner clock
        env:
          PILOT_START: ${{ vars.GATE05_SAFETY_APPROVED_START_UTC }}
        run: |
          node --input-type=module <<'NODE'
          const start=Date.parse(process.env.PILOT_START??"");
          const t=Date.now();
          if(!Number.isFinite(start)||start-t<12*60000||start-t>90*60000)
            throw Error("STOP_NOT_APPROVED_IN_ADVANCE_NO_PAID_START");
          while(Date.now()<start-10*60000)
            await new Promise(r=>setTimeout(r,Math.min(5000,start-10*60000-Date.now())));
          if(Date.now()>start-8*60000)throw Error("STOP_RUNNER_TOO_LATE");
          console.log("STOP_WINDOW_ADMITTED_AT",new Date().toISOString());
          NODE
      - name: Run independently authorized exact-owned STOP, never CREATE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
          GATE05_SCIENCE_SAFETY_DATABASE_URL: ${{ secrets.GATE05_SCIENCE_SAFETY_DATABASE_URL }}
          GATE05_SCIENCE_SAFETY_EXPECTED_DB_HOST: ${{ secrets.GATE05_SCIENCE_SAFETY_EXPECTED_DB_HOST }}
        run: |
          set -Eeuo pipefail
          node --import tsx scripts/v39_gate05_science_exact_owned_actions_stop_v39.ts \
            --runner "$GATE05_SAFETY_APPROVED_RUNNER_SHA" \
            --receiver "$GATE05_SAFETY_APPROVED_RECEIVER_SOURCE" \
            --scope "$GATE05_SAFETY_APPROVED_SCOPE" \
            --auth "$GATE05_SAFETY_APPROVED_AUTH_SHA256" \
            --ticket "$GATE05_SAFETY_APPROVED_STOP_TICKET_SHA256" \
            --start "$GATE05_SAFETY_APPROVED_START_UTC" \
            --stop "$GATE05_SAFETY_APPROVED_STOP_UTC" \
            --credits "$GATE05_SAFETY_APPROVED_STARTING_CREDITS" \
            | tee "$RUNNER_TEMP/gate05-stop-terminal.jsonl"
      - name: Record independent terminal receipt without secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SCOPE: ${{ inputs.scope_id }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const raw=readFileSync(process.env.RUNNER_TEMP+'/gate05-stop-terminal.jsonl','utf8');
          const lines=raw.split('\n').flatMap(x=>{try{return [JSON.parse(x)];}catch{return [];}});
          const x=lines.find(a=>a.schema==='v39.gate05.science-actions-stop-terminal.v1');
          if(!x||x.status!=='STOP_PROVIDER_EXACT_INACTIVE'||
             x.scope!==process.env.INPUT_SCOPE||
             !Number.isSafeInteger(x.providerChargedCredits)||x.providerChargedCredits<0)
            throw Error('INDEPENDENT_TERMINAL_READBACK_INVALID');
          const report={
            schema:'v39.gate05.science-automated-terminal.v1',
            status:'EXACT_PROVIDER_STOP_CONFIRMED',scope:x.scope,
            chargedCredits:x.providerChargedCredits,reason:x.reason,
            restUnitsRemaining:x.restUnitsRemaining,
            hardCreditCap:false,scientificPass:false};
          execFileSync('gh',['api','-X','POST',
            'repos/HKcode22/ReplitTranvr/issues/173/comments',
            '-f','body='+JSON.stringify(report)],
            {encoding:'utf8',timeout:15000,stdio:['ignore','pipe','inherit']});
          console.log(JSON.stringify(report));
          NODE

  one-paid-create:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'PREAPPROVED_GATE05_ONE_PILOT_GITHUB_AUTOMATION' }}
    name: one-paid-create
    environment: phase2g-paid
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Verify protected owner manifest and scope before any provider call
        env:
          PRIVATE_MANIFEST_B64: ${{ secrets.GATE05_RETRY1_MANIFEST_B64 }}
          OWNER_DATABASE: ${{ secrets.GATE05_SCIENCE_OWNER_DATABASE_URL }}
          INPUT_SCOPE: ${{ inputs.scope_id }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -n "$PRIVATE_MANIFEST_B64"
          test -n "$OWNER_DATABASE"
          mkdir -p "$HOME/.config/replittranvr/gate05-science-retry1"
          chmod 700 "$HOME/.config/replittranvr/gate05-science-retry1"
          printf '%s' "$PRIVATE_MANIFEST_B64" | base64 -d \
            > "$HOME/.config/replittranvr/gate05-science-retry1/recovery-before-commit.json"
          chmod 600 "$HOME/.config/replittranvr/gate05-science-retry1/recovery-before-commit.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {homedir} from 'node:os';
          const p=join(homedir(),'.config','replittranvr','gate05-science-retry1','recovery-before-commit.json');
          const m=JSON.parse(readFileSync(p,'utf8'));
          if(m.schema!=='v39.gate05.science-private-one-use-commission.v1'||
             m.source!==process.env.GITHUB_SHA||
             m.scope!==process.env.INPUT_SCOPE||
             m.priorClosedScope!=='98bbf760-6211-4eaa-908c-240be91e7b0d'||
             m.receiver!=='1885703c04ba8f24bf8d1183f873eb86d1f83d7c'||
             m.startingCredits!==1981)
             throw Error('PAID_SCOPE_OR_MAIN_NOT_AUTHENTICATED');
          const start=Date.parse(m.startUtc);
          if(!Number.isFinite(start)||start-Date.now()<12*60000||
             start-Date.now()>90*60000)
             throw Error('GITHUB_PAID_JOB_NOT_STARTED_WELL_AHEAD');
          console.log(JSON.stringify({status:'GH_PAID_WORKER_PREPARED_NO_PROVIDER_CREATE',
            scope:m.scope,startUtc:m.startUtc,stopUtc:m.stopUtc}));
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Wait until T-minus-5m on GitHub-hosted runner clock
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {homedir} from 'node:os';
          const p=join(homedir(),'.config','replittranvr','gate05-science-retry1','recovery-before-commit.json');
          const m=JSON.parse(readFileSync(p,'utf8'));
          const start=Date.parse(m.startUtc);
          if(!Number.isFinite(start)||Date.now()>start-4*60000)
            throw Error('GITHUB_PAID_WORKER_TOO_LATE');
          while(Date.now()<start-5*60000)
            await new Promise(r=>setTimeout(r,Math.min(5000,start-5*60000-Date.now())));
          if(Date.now()>start-4*60000)
            throw Error('GITHUB_PAID_WORKER_WAKEUP_TOO_LATE');
          console.log('GITHUB_PAID_PREFLIGHT_ADMITTED',new Date().toISOString());
          NODE
      - name: ONE previously authorized WSSS paid CREATE only after independent live STOP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.GATE05_SCIENCE_OWNER_DATABASE_URL }}
          V39_DATABASE_RUNTIME_URL: ${{ secrets.V39_DATABASE_RUNTIME_URL }}
          AERODATABOX_WEBHOOK_SECRET: ${{ secrets.AERODATABOX_WEBHOOK_SECRET }}
          AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --import tsx scripts/v39_gate05_science_one_paid_create_once_v39.ts \
            --head "$GITHUB_SHA" --safety-run "$GITHUB_RUN_ID" \
            --confirm EXACT_OWNER_APPROVED_GATE05_ONE_WSSS_500_ALERT_CREATE
      - name: Explicitly preserve no-retry and scientific uncertainty
        if: always()
        run: |
          echo 'Paid CREATE is non-idempotent. Never rerun this GitHub workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Provider 350 early STOP is NOT a hard 500-credit cap.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Scientific Gate05 remains OPEN pending real evidence adjudication.' >> "$GITHUB_STEP_SUMMARY"
  report:
    if: always()
    needs: [exact-owned-stop, one-paid-create]
    runs-on: ubuntu-latest
    steps:
      - name: Honest automated outcome
        env:
          STOP_STATUS: ${{ needs.exact-owned-stop.result }}
          PAID_STATUS: ${{ needs.one-paid-create.result }}
        run: |
          echo "Independent STOP outcome: $STOP_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "One-use paid CREATE outcome: $PAID_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo 'Review provider terminal receipt, runway semantics, count and duration.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No automatic science PASS can follow from workflow success alone.' >> "$GITHUB_STEP_SUMMARY"
