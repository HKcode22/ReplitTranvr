name: Phase5 Replit V5 Reviewed Callback-Only Build (NO Provider)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v39_phase5b_source_only_successor_owner.sh'
      - '.replit'
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.js'
      - 'tailwind.config.ts'
      - 'tailwind.config.js'
      - 'components.json'
      - 'drizzle.config.ts'
      - 'scripts/v39_phase5_reviewed_source_build_v39.sh'
      - 'scripts/v39_phase5_callback_release_v2_reviewed_build_v39.sh'
      - 'scripts/v39_phase5_callback_release_v3_reviewed_build_v39.sh'
      - 'scripts/v39_phase5_callback_release_v5_reviewed_build_v39.sh'
      - 'tests/phase5_callback_release_v2_reviewed_build_v39.test.ts'
      - 'tests/phase5_callback_release_v3_reviewed_build_v39.test.ts'
      - 'tests/phase5_callback_release_v5_reviewed_build_v39.test.ts'
      - 'tests/phase5_reviewed_callback_only_build_v39.test.ts'
      - 'tests/phase3_gate4_reviewed_source_build_v39.test.ts'
      - 'tests/phase2g_p25_replit_callback_published_deploy_contract_v39.test.ts'
      - 'tests/phase2g_owned_callback_isolation_v39.test.ts'
      - 'scripts/v39_phase5b_callback_worker_only_guard.sh'
      - '.github/workflows/phase5-reviewed-replit-callback-only-build-no-provider.yml'
  push:
    branches: [main]
    paths:
      - '.replit'
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.js'
      - 'tailwind.config.ts'
      - 'tailwind.config.js'
      - 'components.json'
      - 'drizzle.config.ts'
      - 'scripts/v39_phase5_reviewed_source_build_v39.sh'
      - 'scripts/v39_phase5_callback_release_v2_reviewed_build_v39.sh'
      - 'scripts/v39_phase5_callback_release_v3_reviewed_build_v39.sh'
      - 'scripts/v39_phase5_callback_release_v5_reviewed_build_v39.sh'
      - 'tests/phase5_callback_release_v2_reviewed_build_v39.test.ts'
      - 'tests/phase5_callback_release_v3_reviewed_build_v39.test.ts'
      - 'tests/phase5_callback_release_v5_reviewed_build_v39.test.ts'
      - 'tests/phase5_reviewed_callback_only_build_v39.test.ts'
      - '.github/workflows/phase5-reviewed-replit-callback-only-build-no-provider.yml'
permissions:
  contents: read
env:
  ADB_AUTO_COLLECT: 'false'
  V39_PHASE6_PROCESS_ARMED: '0'
  AERODATABOX_API_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
  V39_DATABASE_RUNTIME_URL: ''
  DATABASE_URL: ''
  V39_P5_SOURCE_DATABASE_URL: ''
jobs:
  verify-offline-reviewed-receiver-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Prove source-equivalent callback-only build and historical constraints
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          npx vitest run \
            tests/phase5_reviewed_callback_only_build_v39.test.ts \
            tests/phase5_callback_release_v2_reviewed_build_v39.test.ts \
            tests/phase5_callback_release_v3_reviewed_build_v39.test.ts \
            tests/phase5_callback_release_v5_reviewed_build_v39.test.ts \
            tests/phase3_gate4_reviewed_source_build_v39.test.ts \
            tests/phase2g_p25_replit_callback_published_deploy_contract_v39.test.ts \
            tests/phase2g_owned_callback_isolation_v39.test.ts \
            tests/phase3_gate05_v0075_published_release_v39.test.ts
      - name: Explicit worker-only callback admission or exact reviewed source
        id: callback-admission
        shell: bash
        env:
          WORKER_ONLY_PR: ${{ (github.event_name == 'pull_request' && (github.event.pull_request.number == 981 || github.event.pull_request.number == 982 || github.event.pull_request.base.sha == '9426eda5f749e43b1e798b1c308f5c428f696882' || github.event.pull_request.base.sha == 'a02e3d6eddc378871f030848235746de160b71e5') && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'push' && (github.event.before == '697501b9443837018414082434cbe798ab835f92' || github.event.before == '9426eda5f749e43b1e798b1c308f5c428f696882' || github.event.before == 'a02e3d6eddc378871f030848235746de160b71e5')) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          set +x
          if [[ "$WORKER_ONLY_PR" == true ]];then
            bash scripts/v39_phase5b_callback_worker_only_guard.sh "$BASE_SHA" "$EXACT_SHA"
            echo 'publishable=false' >> "$GITHUB_OUTPUT"
            echo 'Worker-only regression passed; callback publication remains HOLD; no binary built or deployed.' >> "$GITHUB_STEP_SUMMARY"
          else
            bash scripts/v39_phase5_callback_release_v5_reviewed_build_v39.sh --verify-only
            echo 'publishable=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build reviewed callback-only binary without provider or production credentials
        if: steps.callback-admission.outputs.publishable == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/v39_phase5_callback_release_v5_reviewed_build_v39.sh
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import cp from 'node:child_process';
          const expected='c3c3050e12c4e327f9c82c35c95f856f3c1cbd20';
          const actual=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const meta=JSON.parse(fs.readFileSync('dist/v39-build-meta.json','utf8'));
          const p=JSON.parse(fs.readFileSync('dist/v39-snapshot-provenance.json','utf8'));
          if(meta.git_head!==expected||p.schema!=='v39.phase5.callback-reviewed-source-equivalence.v5'||p.reviewed_runtime_source_commit!==expected||
              p.actual_replit_snapshot_git_head!==actual||
              p.runtime_inputs_identical_to_reviewed!==true||
              p.phase6_paid_launch_authorized!==false||
              !fs.statSync('dist/index.mjs').isFile()||
              !fs.readFileSync('dist/index.mjs','utf8').includes('/__v39/phase5/recurring-expiry'))
            throw Error('UNREVIEWED_CALLBACK_BINARY_REFUSED');
          console.log('PHASE5_V5_REVIEWED_CALLBACK_BINARY_CI_PASS_NO_DEPLOY_NO_PROVIDER');
          NODE
