name: V3.9 Gate0 Record Formal Pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/v39_gate0_record_formal.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/v39_gate0_record_formal.py .github/workflows/v39-gate0-record-formal.yml
          git add SEPmd/V3.9_RUN_REPORTS_AND_EVIDENCE.md
          git diff --cached --check
          git commit -m "V3.9 Gate0: record formal guarded PASS evidence"
          git push origin HEAD:main
