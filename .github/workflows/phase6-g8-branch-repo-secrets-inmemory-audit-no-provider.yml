name: P6 G8 repo existing policy digest-only audit (NO PROVIDER)
on:
  push:
    branches:
      - phase6/20261122-g8-502-readback-evidence
    paths:
      - '.github/workflows/phase6-g8-branch-repo-secrets-inmemory-audit-no-provider.yml'
permissions: {}
concurrency:
  group: p6-g8-repo-policy-digest-only-evidence-branch
  cancel-in-progress: false
jobs:
  existing-repo-secret-bindings-in-memory-only:
    if: >-
      github.repository == 'HKcode22/ReplitTranvr' &&
      github.ref == 'refs/heads/phase6/20261122-g8-502-readback-evidence' &&
      github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      V39_PHASE6_OWNER_APPROVED: '0'
      AERODATABOX_API_KEY: ''
      RAPIDAPI_KEY: ''
      DATABASE_URL: ''
      GITHUB_TOKEN: ''
      TARGET_PRODUCTION_MAIN: 'b432eb9a5bac7bc3c4537249e75ec7df41e8727c'
      HISTORICAL_POLICY_MAIN: 'fe3fef5dbddc3577d585f778385677979031cd64'
      PREVIOUS_31_VALUES_SHA256: '7e07047d7173cbcf84e966ab869d66477efef36df38c83c58325396f31b83728'
      G8_STATIC_KEYS: 'V39_P5_APPROVED_CODE_SHA,P6_NONPAID_SOURCE_APPROVED_MAIN_SHA,V39_P5_ACTUAL_NATIVE_REVIEW_APPROVED_CODE_SHA,P5_CD_GH_PRE_APPROVED_CODE_SHA,V39_P5_POST_APPROVED_CODE_SHA,P6_PRIVATE_SOURCE_PARENT_RO_MAIN_SHA,V39_P5_QUEUE_APPROVED_CODE_SHA,V39_P5_MANIFEST_SHA256,V39_P5_CALENDAR_HASH,V39_P5_CONFIG_HASH,V39_P5_FRAME_HASH,V39_P5_RELEASE_SHA256,V39_P5_RIGHTS_SHA256,V39_P5_PROVIDER_CONTRACT_SHA256,P6_INERT_STAGE_INPUT_JSON,P6_INERT_STAGE_INPUT_SHA256,P6_INERT_COST_ENVELOPE_SHA256,P6_PRIVATE_POST_OUTCOME_TAIL_HOURS,V39_P5_POST_PROVIDER_CONTRACT_SHA256,V39_P5_POST_CATEGORY_BUDGET_SHA256,V39_P5_POST_PRICE_SHA256,P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64,P6_NONPAID_DAILY_POLICY_BASE64,P6_NONPAID_SIGNING_POLICY_BASE64,P6_NONPAID_TRANSPORT_TRUST_BASE64,P6_PRIVATE_POST_REVIEWER_TRUST_BASE64,P6_NATIVE_POST_POLICY_BASE64,P6_NONPAID_DAILY_POLICY_SHA256,P6_NONPAID_SIGNING_POLICY_SHA256,P6_NONPAID_TRANSPORT_TRUST_SHA256,P6_NATIVE_POST_POLICY_SHA256'
      V39_P5_APPROVED_CODE_SHA: ${{ secrets.V39_P5_APPROVED_CODE_SHA }}
      P6_NONPAID_SOURCE_APPROVED_MAIN_SHA: ${{ secrets.P6_NONPAID_SOURCE_APPROVED_MAIN_SHA }}
      V39_P5_ACTUAL_NATIVE_REVIEW_APPROVED_CODE_SHA: ${{ secrets.V39_P5_ACTUAL_NATIVE_REVIEW_APPROVED_CODE_SHA }}
      P5_CD_GH_PRE_APPROVED_CODE_SHA: ${{ secrets.P5_CD_GH_PRE_APPROVED_CODE_SHA }}
      V39_P5_POST_APPROVED_CODE_SHA: ${{ secrets.V39_P5_POST_APPROVED_CODE_SHA }}
      P6_PRIVATE_SOURCE_PARENT_RO_MAIN_SHA: ${{ secrets.P6_PRIVATE_SOURCE_PARENT_RO_MAIN_SHA }}
      V39_P5_QUEUE_APPROVED_CODE_SHA: ${{ secrets.V39_P5_QUEUE_APPROVED_CODE_SHA }}
      V39_P5_MANIFEST_SHA256: ${{ secrets.V39_P5_MANIFEST_SHA256 }}
      V39_P5_CALENDAR_HASH: ${{ secrets.V39_P5_CALENDAR_HASH }}
      V39_P5_CONFIG_HASH: ${{ secrets.V39_P5_CONFIG_HASH }}
      V39_P5_FRAME_HASH: ${{ secrets.V39_P5_FRAME_HASH }}
      V39_P5_RELEASE_SHA256: ${{ secrets.V39_P5_RELEASE_SHA256 }}
      V39_P5_RIGHTS_SHA256: ${{ secrets.V39_P5_RIGHTS_SHA256 }}
      V39_P5_PROVIDER_CONTRACT_SHA256: ${{ secrets.V39_P5_PROVIDER_CONTRACT_SHA256 }}
      P6_INERT_STAGE_INPUT_JSON: ${{ secrets.P6_INERT_STAGE_INPUT_JSON }}
      P6_INERT_STAGE_INPUT_SHA256: ${{ secrets.P6_INERT_STAGE_INPUT_SHA256 }}
      P6_INERT_COST_ENVELOPE_SHA256: ${{ secrets.P6_INERT_COST_ENVELOPE_SHA256 }}
      P6_PRIVATE_POST_OUTCOME_TAIL_HOURS: ${{ secrets.P6_PRIVATE_POST_OUTCOME_TAIL_HOURS }}
      V39_P5_POST_PROVIDER_CONTRACT_SHA256: ${{ secrets.V39_P5_POST_PROVIDER_CONTRACT_SHA256 }}
      V39_P5_POST_CATEGORY_BUDGET_SHA256: ${{ secrets.V39_P5_POST_CATEGORY_BUDGET_SHA256 }}
      V39_P5_POST_PRICE_SHA256: ${{ secrets.V39_P5_POST_PRICE_SHA256 }}
      P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64: ${{ secrets.P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64 }}
      P6_NONPAID_DAILY_POLICY_BASE64: ${{ secrets.P6_NONPAID_DAILY_POLICY_BASE64 }}
      P6_NONPAID_SIGNING_POLICY_BASE64: ${{ secrets.P6_NONPAID_SIGNING_POLICY_BASE64 }}
      P6_NONPAID_TRANSPORT_TRUST_BASE64: ${{ secrets.P6_NONPAID_TRANSPORT_TRUST_BASE64 }}
      P6_PRIVATE_POST_REVIEWER_TRUST_BASE64: ${{ secrets.P6_PRIVATE_POST_REVIEWER_TRUST_BASE64 }}
      P6_NATIVE_POST_POLICY_BASE64: ${{ secrets.P6_NATIVE_POST_POLICY_BASE64 }}
      P6_NONPAID_DAILY_POLICY_SHA256: ${{ secrets.P6_NONPAID_DAILY_POLICY_SHA256 }}
      P6_NONPAID_SIGNING_POLICY_SHA256: ${{ secrets.P6_NONPAID_SIGNING_POLICY_SHA256 }}
      P6_NONPAID_TRANSPORT_TRUST_SHA256: ${{ secrets.P6_NONPAID_TRANSPORT_TRUST_SHA256 }}
      P6_NATIVE_POST_POLICY_SHA256: ${{ secrets.P6_NATIVE_POST_POLICY_SHA256 }}
      P6_PHASE7_POST_PRESERVATION_POLICY_BASE64: ${{ secrets.P6_PHASE7_POST_PRESERVATION_POLICY_BASE64 }}
      P6_PHASE7_POST_PRESERVATION_POLICY_SHA256: ${{ secrets.P6_PHASE7_POST_PRESERVATION_POLICY_SHA256 }}
    steps:
      - name: Verify repository secrets in memory; emit only classifications and booleans
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          node <<'JS'
          const {createHash}=require('node:crypto');
          const e=process.env, names=(e.G8_STATIC_KEYS||'').split(',');
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const old=e.HISTORICAL_POLICY_MAIN,main=e.TARGET_PRODUCTION_MAIN;
          const cls=x=>!x?'missing':x===old?'historical':x===main?'current':'other';
          if(names.length!==31||new Set(names).size!==31||
             names.some(k=>!/^(P6_|V39_|P5_)/.test(k))||
             !/^[a-f0-9]{40}$/.test(main)||!/^[a-f0-9]{40}$/.test(old)||
             e.GITHUB_REPOSITORY!=='HKcode22/ReplitTranvr'||
             e.GITHUB_REF!=='refs/heads/phase6/20261122-g8-502-readback-evidence'||
             e.GITHUB_EVENT_NAME!=='push')throw Error('NO_GO_SCOPE');
          const v=Object.fromEntries(names.map(k=>[k,e[k]??'']));
          const missing=names.filter(k=>!v[k]);
          const normal={...v};
          for(const k of names.slice(0,7))normal[k]=old;
          const extract=name=>{
            const b=v[name];
            if(!b||!/^[A-Za-z0-9+/]*={0,2}$/.test(b))return null;
            try{
              const raw=Buffer.from(b,'base64');
              if(raw.toString('base64')!==b)return null;
              const x=JSON.parse(raw.toString('utf8'));
              return JSON.stringify(x)===raw.toString('utf8')?{x,raw}:null;
            }catch{return null;}
          };
          const policyKeys=names.slice(21,27);
          const six=Object.fromEntries(policyKeys.map(k=>[k,extract(k)]));
          const p=Object.fromEntries(policyKeys.map(k=>[k,six[k]?.x]));
          const source=p.P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64;
          const daily=p.P6_NONPAID_DAILY_POLICY_BASE64;
          const signing=p.P6_NONPAID_SIGNING_POLICY_BASE64;
          const transport=p.P6_NONPAID_TRANSPORT_TRUST_BASE64;
          const native=p.P6_NATIVE_POST_POLICY_BASE64;
          const postRaw=e.P6_PHASE7_POST_PRESERVATION_POLICY_BASE64??'';
          let post=null,postCanonical=false;
          try{
            const b=Buffer.from(postRaw,'base64');
            postCanonical=b.toString('base64')===postRaw&&sha(b)===(e.P6_PHASE7_POST_PRESERVATION_POLICY_SHA256??'');
            if(postCanonical){post=JSON.parse(b.toString('utf8'));postCanonical=JSON.stringify(post)===b.toString('utf8');}
          }catch{}
          const computedDigestOk={
            daily:!!six.P6_NONPAID_DAILY_POLICY_BASE64&&sha(six.P6_NONPAID_DAILY_POLICY_BASE64.raw)===v.P6_NONPAID_DAILY_POLICY_SHA256,
            signing:!!six.P6_NONPAID_SIGNING_POLICY_BASE64&&sha(six.P6_NONPAID_SIGNING_POLICY_BASE64.raw)===v.P6_NONPAID_SIGNING_POLICY_SHA256,
            transport:!!six.P6_NONPAID_TRANSPORT_TRUST_BASE64&&sha(six.P6_NONPAID_TRANSPORT_TRUST_BASE64.raw)===v.P6_NONPAID_TRANSPORT_TRUST_SHA256,
            nativePost:!!six.P6_NATIVE_POST_POLICY_BASE64&&sha(six.P6_NATIVE_POST_POLICY_BASE64.raw)===v.P6_NATIVE_POST_POLICY_SHA256
          };
          console.log(JSON.stringify({
            status:'P6_G8_REPOSITORY_SECRETS_IN_MEMORY_DIAGNOSTIC_ONLY_NO_GO',
            scope:'repository-level-secret-context-only; protected environment not verified',
            staticNamesExpected:31,
            presentStaticNames:31-missing.length,
            missingStaticNames:missing,
            originalStaticDigestExact:missing.length===0&&sha(JSON.stringify(v))===e.PREVIOUS_31_VALUES_SHA256,
            historicalTopLevelNormalizedDigestExact:missing.length===0&&sha(JSON.stringify(normal))===e.PREVIOUS_31_VALUES_SHA256,
            currentTopLevelCodePinClasses:Object.fromEntries(names.slice(0,7).map(k=>[k,cls(v[k])])),
            policyCanonical:Object.fromEntries(policyKeys.map(k=>[k,!!six[k]])),
            policyDigestMatchesStored:computedDigestOk,
            sourceEmbeddedCode:cls(source?.reviewedCodeSha),
            dailyEmbeddedCode:cls(daily?.approvedCodeSha),
            dailyAppendEmbeddedCode:cls(daily?.nativeLaterReview?.dayAppendPolicy?.approvedCodeSha),
            signingEmbeddedCode:cls(signing?.approvedCodeSha),
            transportEmbeddedCode:cls(transport?.reviewedMainSha),
            nativePostEmbeddedCode:cls(native?.reviewedCodeSha),
            preservationPolicyCanonicalAndDigestValid:postCanonical,
            preservationNativeDigestMatches:!!post&&post.nativePostPolicySha256===v.P6_NATIVE_POST_POLICY_SHA256,
            providerCalls:0,databaseReads:0,databaseWrites:0,
            outputContainsNoSecretValues:true,phase6PaidGo:false
          }));
          JS
