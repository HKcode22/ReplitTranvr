name: Phase5 Amendment E2 traveler PRE AIRBORNE research contract (OFFLINE)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase5-amendment-e2-traveler-forecast-contract-offline.yml'
      - 'server/lib/disruption/phase5AmendmentE2ForecastConsistencyOffline_v39.ts'
      - 'tests/phase5_amendment_e2_research_forecast_consistency_v39.test.ts'
      - 'scripts/v39_phase5_free_quota_exact_pinned_isolated_replit_once.sh'
permissions:
  contents: read
jobs:
  no-provider-model-consistency-and-isolated-quota-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADB_AUTO_COLLECT: '0'
      AERODATABOX_API_KEY: ''
      DATABASE_URL: ''
      P5_V39_PRE_DATABASE_URL: ''
      V39_PHASE6_PROCESS_ARMED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: E2 temporal leakage, probability and quantile mathematical consistency
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$AERODATABOX_API_KEY"
          test -z "$DATABASE_URL"
          test "$ADB_AUTO_COLLECT" = 0
          test "$V39_PHASE6_PROCESS_ARMED" = 0
          npx --no-install vitest run tests/phase5_amendment_e2_research_forecast_consistency_v39.test.ts
          echo 'E2_OFFLINE_CONSISTENCY_NOT_TRAINED_NO_PAID_GO'
      - name: Check owner isolated free quota diagnostic shell syntax (DO NOT EXECUTE)
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/v39_phase5_free_quota_exact_pinned_isolated_replit_once.sh
          grep -Fq 'PINNED_FIVE_FILES_VERIFIED_NO_WORKSPACE_OVERWRITE' scripts/v39_phase5_free_quota_exact_pinned_isolated_replit_once.sh
          echo 'E2_QUOTA_SCRIPT_SYNTAX_OK_NO_PROVIDER_CALL'
