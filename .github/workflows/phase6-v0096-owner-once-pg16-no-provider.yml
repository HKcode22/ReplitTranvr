name: Phase6 deprecated global V0096 owner STOP guard (DISPOSABLE PG16 NO GO)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v39_phase6_v0096_owner_schema_readonly_and_once.mjs'
      - 'tests/phase6_v0096_owner_schema_readonly_and_once_v39.test.mjs'
      - '.github/workflows/phase6-v0096-owner-once-pg16-no-provider.yml'
permissions:
  contents: read
env:
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  V39_PHASE6_OWNER_APPROVED: '0'
  AERODATABOX_API_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
  RAPIDAPI_KEY: ''
  V39_P5_SOURCE_DATABASE_URL: ''
  P5_V39_PRE_DATABASE_URL: ''
  V39_DATABASE_RUNTIME_URL: ''
jobs:
  static-exact-git-blob:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Reject any non-pinned V0096 SQL and paid context
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -z "$DATABASE_URL$AERODATABOX_API_KEY$RAPIDAPI_KEY"
          node --test tests/phase6_v0096_owner_schema_readonly_and_once_v39.test.mjs
          echo 'V0096_OWNER_STATIC_GIT_BLOB_NO_PROVIDER_NO_GO_PASS'
  real-disposable-pg16-owner-once:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: 'neondb'
      PGSYNTH: 'ci-only-v0096-owner-no-real-neon'
      DATABASE_URL: 'postgresql://neondb_owner:ci-only-v0096-owner-no-real-neon@127.0.0.1:5432/neondb?sslmode=disable'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Prepare disposable non-superuser PG16 owner with exactly one V0094→V0095
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$ADB_AUTO_COLLECT" = '0'
          test "$V39_PHASE6_PROCESS_ARMED" = '0'
          test -z "$AERODATABOX_API_KEY$RAPIDAPI_KEY$V39_P5_SOURCE_DATABASE_URL"
          PGPASSWORD=postgres psql -U postgres -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE neondb_owner LOGIN CREATEROLE PASSWORD 'ci-only-v0096-owner-no-real-neon'"
          PGPASSWORD=postgres psql -U postgres -X -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE neondb OWNER TO neondb_owner"
          export PGPASSWORD="$PGSYNTH"
          psql -U neondb_owner -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0094__phase6_private_frozen_packet_transport_inert_v39.sql
          psql -U neondb_owner -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0095__phase6_private_source_query_post_packet_kind_scope_inert_v39.sql
      - name: Prove obsolete global V0096 install refuses even in disposable PG16; V0095 remains clean
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          import {spawnSync} from "node:child_process";
          import pg from "pg";
          import {
            readV0096OwnerInventory,installV0096OnceOwner,
            V0096_MIGRATION_PATH,V0096_REVIEWED_SQL_BLOB_SHA
          } from "./scripts/v39_phase6_v0096_owner_schema_readonly_and_once.mjs";
          const owner=new pg.Client({connectionString:process.env.DATABASE_URL});
          await owner.connect();
          try{
            const before=await readV0096OwnerInventory(owner);
            assert.equal(before.state,"V0095_READY_EMPTY_V0096_NOT_INSTALLED_NO_GO");
            await assert.rejects(installV0096OnceOwner({
              client:owner,
              rawMigration:readFileSync(V0096_MIGRATION_PATH),
              blobSha:V0096_REVIEWED_SQL_BLOB_SHA
            }),/LEGACY_GLOBAL_CHAIN_31DAY_TTL_INCOMPATIBLE_NEVER_INSTALL/);
            const after=await readV0096OwnerInventory(owner);
            assert.equal(after.state,before.state);
          }finally{await owner.end();}
          // Direct old CLI install mode must also refuse, regardless of owner
          // tokens; no SQL transaction or paid provider is touched.
          const direct=spawnSync(process.execPath,[
           "scripts/v39_phase6_v0096_owner_schema_readonly_and_once.mjs","install"
          ],{env:process.env,encoding:"utf8"});
          assert.equal(direct.status,2);
          assert.match(direct.stderr,/HOLD_V0096_OWNER_SCHEMA_NO_RETRY_NO_PROVIDER_NO_GO/);
          const independent=new pg.Client({connectionString:process.env.DATABASE_URL});
          await independent.connect();
          try{
            const r=await readV0096OwnerInventory(independent);
            assert.equal(r.state,"V0095_READY_EMPTY_V0096_NOT_INSTALLED_NO_GO");
            const empty=await independent.query(
              "SELECT count(*)::integer AS n FROM phase6_private.frozen_native_packet_v39");
            assert.equal(empty.rows[0].n,0);
            console.log(JSON.stringify({
              status:"V0096_OLD_GLOBAL_OWNER_INSTALL_DISABLED_DISPOSABLE_PASS",
              obsoleteGlobalIndexInstalled:false,
              verifiedV0095Rows:0,providerCalls:0,
              productionDatabaseWrites:0,phase6PaidGo:false
            }));
          }finally{await independent.end();}
          JS
