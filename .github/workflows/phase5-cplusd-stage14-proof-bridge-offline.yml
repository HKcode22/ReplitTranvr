name: Phase5 C+D Stage14 proof bridge (offline no provider)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase5-cplusd-stage14-proof-bridge-offline.yml'
      - 'server/lib/disruption/phase5CPlusDStage14ResultBridgeOffline_v39.ts'
      - 'server/lib/disruption/phase5CPlusDParallelPreProofOfConcept_v39.ts'
      - 'tests/phase5_cplusd_stage14_result_bridge_offline_v39.test.ts'
permissions:
  contents: read
jobs:
  proof-bridge-no-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      DATABASE_URL: ''
      P5_V39_PRE_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Prove no provider and no database connection
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$ADB_AUTO_COLLECT" = 0
          test "$V39_PHASE6_PROCESS_ARMED" = 0
          test -z "$AERODATABOX_API_KEY"
          test -z "$AERODATABOX_WEBHOOK_SECRET"
          test -z "$DATABASE_URL"
          test -z "$P5_V39_PRE_DATABASE_URL"
          echo 'CD_STAGE14_BRIDGE_PURE_OFFLINE_ONLY'
      - name: Validate original Stage14 result to C worker proof contract
        run: npx --no-install vitest run tests/phase5_cplusd_stage14_result_bridge_offline_v39.test.ts
