name: Phase5 C+D one queued T24 PRE + independent V0081 witness (STOP default)
on:
  schedule:
    # Preserve the existing cadence, stagger core starts; not a timing SLA.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Exact singleton confirmation or RUN_CURRENT_SIGNED_T24_WITH_WITNESS_NO_PROVIDER'
        required: true
        type: string
      frozen_roster:
        description: 'Singleton only: reviewed roster path; leave empty for current private mode'
        required: false
        type: string
        default: ''
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v39_phase5b_source_only_successor_owner.sh'
      - '.github/workflows/phase5-cd-github-one-queued-t24-witness-main-manual.yml'
      - 'scripts/v39_phase5_cd_github_one_queued_t24_witness_v39.ts'
      - 'scripts/v39_phase6_private_current_t24_worker_v39.mjs'
      - 'server/lib/disruption/phase6PrivateT24QueueRouting_v39.mjs'
      - 'server/lib/disruption/phase6LaterCalendarDueDays_v39.mjs'
      - 'tests/phase6_private_current_t24_worker_v39.test.mjs'
      - 'scripts/v39_phase6_committed_t24_witness_custody_v39.mjs'
      - 'tests/phase6_committed_t24_witness_custody_v39.test.mjs'
      - 'server/lib/disruption/phase5CdGithubDbClockLookahead_v39.ts'
      - 'tests/phase5_cd_github_dbclock_lookahead_offline_v39.test.ts'
      - 'scripts/v39_phase5_cd_github_one_source_bound_enqueue_v39.ts'
      - 'server/lib/disruption/phase5CdGithubQueuedT24Witness_v39.ts'
      - 'server/lib/disruption/phase5CdGithubBoundedPreTick_v39.ts'
      - 'server/lib/disruption/phase5CdGithubPreReleaseGate_v39.ts'
      - 'server/lib/disruption/phase5T24PreIndependentWitnessChain_v39.ts'
      - 'server/lib/disruption/phase5V0079SingleBoundFlightPreWriter_v39.ts'
      - 'tests/phase5_cd_github_queued_t24_offline_v39.test.ts'
      - 'server/lib/disruption/phase5AmendmentESignedSupplementalFeatures_v39.ts'
      - 'tests/phase5_amendment_e_signed_supplemental_features_v39.test.ts'
      - 'tests/phase5_t24_pre_independent_witness_chain_v39.test.ts'
permissions:
  contents: read
concurrency:
  # Offline PR checks must never occupy the live T24 deadline lane.
  group: phase5-cd-queued-t24-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false
env:
  P6_PHASE5B_RUNTIME_EXECUTABLE_SHA: ${{ github.ref == 'refs/heads/main' && vars.P6_PHASE5B_RUNTIME_EXECUTABLE_SHA || '' }}
jobs:
  offline-queued-t24-packet-witness-and-stop:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      DATABASE_URL: ''
      P5_V39_PRE_DATABASE_URL: ''
      P5_V39_T24_WITNESS_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Offline T24 signed packet role checks and queued two-commit witness
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --no-install vitest run             tests/phase5_cd_github_queued_t24_offline_v39.test.ts             tests/phase5_t24_pre_independent_witness_chain_v39.test.ts             tests/phase5_cd_github_prepare_source_registration_offline_v39.test.ts             tests/phase5_cd_github_bounded_pre_tick_offline_v39.test.ts tests/phase5_cd_github_dbclock_lookahead_offline_v39.test.ts
          npx --no-install tsx --test tests/phase6_committed_t24_witness_custody_v39.test.mjs
          npx --no-install tsx --test tests/phase6_private_current_t24_worker_v39.test.mjs
          echo P5_CD_T24_SEPARATE_WITNESS_OFFLINE_STOP_NO_PROVIDER_PASS
  one-approved-queued-native-t24:
    if: >-
      ${{ github.ref == 'refs/heads/main'
          && vars.P6_PRIVATE_T24_EXECUTION_ENABLED != '1'
          && ((github.event_name == 'workflow_dispatch'
               && vars.P5_CD_GH_QUEUED_T24_ENABLED == '1'
               && inputs.confirm == 'ONE_REVIEWED_SOURCE_QUEUED_T24_PRE_AND_INDEPENDENT_WITNESS_NO_PROVIDER')
              || (github.event_name == 'schedule'
               && vars.P5_CD_GH_T24_SCHEDULE_ENABLED == '1'
               && vars.P5_T24_AUTO_DISPATCH_ENABLED != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      ADB_AUTO_COLLECT: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      DATABASE_URL: ''
      V39_DATABASE_RUNTIME_URL: ''
      V39_P5_SOURCE_DATABASE_URL: ''
      P5_V39_PREPARE_DATABASE_URL: ''
      P5_V39_OTHER_REST_REVIEW_DATABASE_URL: ''
      P5_V39_OTHER_REST_RESERVE_DATABASE_URL: ''
      P5_CD_GH_QUEUED_T24_EXECUTE: '1'
      P5_CD_GH_T24_ONE_FLIGHT_CONFIRM: ${{ github.event_name == 'schedule' && 'ONE_REVIEWED_SOURCE_QUEUED_T24_PRE_AND_INDEPENDENT_WITNESS_NO_PROVIDER' || inputs.confirm }}
      P5_CD_GH_T24_SCHEDULE_ENABLED: ${{ vars.P5_CD_GH_T24_SCHEDULE_ENABLED }}
      # Legacy Stage24 source-dispatch automation and queued V0092 T24 must not compete.
      P5_T24_AUTO_DISPATCH_ENABLED: ${{ vars.P5_T24_AUTO_DISPATCH_ENABLED }}
      P5_CD_GH_ROSTER_PATH: ${{ github.event_name == 'schedule' && vars.P5_CD_GH_T24_SCHEDULE_ROSTER_PATH || inputs.frozen_roster }}
      P5_CD_GH_PRE_CONFIRM: 'ONE_SIGNED_SOURCE_BOUND_CD_PRE_NO_PROVIDER'
      P5_CD_GH_PRE_ARMED: ${{ secrets.P5_CD_GH_PRE_ARMED }}
      P5_CD_GH_PRE_STOP: ${{ secrets.P5_CD_GH_PRE_STOP }}
      P5_CD_GH_PRE_MODE: ${{ vars.P5_CD_GH_PRE_MODE }}
      P5_CD_GH_PHASE5_CANARY_APPROVED: ${{ secrets.P5_CD_GH_PHASE5_CANARY_APPROVED }}
      P5_CD_GH_T24_WITNESS_APPROVED: ${{ secrets.P5_CD_GH_T24_WITNESS_APPROVED }}
      P5_CD_GH_PRE_APPROVED_CODE_SHA: ${{ secrets.P5_CD_GH_PRE_APPROVED_CODE_SHA }}
      # Independent signed T24 singleton: do not overwrite the concurrent T6/T90 roster secret.
      P5_CD_GH_PRE_ROSTER_SHA256: ${{ secrets.P5_CD_GH_T24_ROSTER_SHA256 }}
      P5_CD_GH_E_ROUTE_FEATURES_APPROVED: ${{ secrets.P5_CD_GH_E_ROUTE_FEATURES_APPROVED }}
      P5_CD_GH_E_SUPPLEMENTAL_FEATURES_APPROVED: ${{ secrets.P5_CD_GH_E_SUPPLEMENTAL_FEATURES_APPROVED }}
      V39_PHASE5_FREEZE_SIGNED: ${{ secrets.V39_PHASE5_FREEZE_SIGNED }}
      V39_PHASE5_SOURCE_RIGHTS_APPROVED: ${{ secrets.V39_PHASE5_SOURCE_RIGHTS_APPROVED }}
      V39_PHASE6_PROCESS_ARMED: ${{ secrets.V39_PHASE6_PROCESS_ARMED }}
      V39_P5_MANIFEST_SHA256: ${{ secrets.V39_P5_MANIFEST_SHA256 }}
      V39_P5_RIGHTS_SHA256: ${{ secrets.V39_P5_RIGHTS_SHA256 }}
      P5_V39_PRE_DATABASE_URL: ${{ secrets.P5_V39_PRE_DATABASE_URL }}
      P5_V39_T24_WITNESS_DATABASE_URL: ${{ secrets.P5_V39_T24_WITNESS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed before Node modules, database or provider
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$GITHUB_REPOSITORY" = HKcode22/ReplitTranvr
          test "$GITHUB_REF" = refs/heads/main
          case "$GITHUB_EVENT_NAME" in
            schedule)
              test "$P5_CD_GH_T24_SCHEDULE_ENABLED" = 1 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_T24_SCHEDULE_ENABLED >&2; exit 2; }
              test "$P5_T24_AUTO_DISPATCH_ENABLED" != true
              ;;
            workflow_dispatch)
              test "$P5_CD_GH_T24_ONE_FLIGHT_CONFIRM" = ONE_REVIEWED_SOURCE_QUEUED_T24_PRE_AND_INDEPENDENT_WITNESS_NO_PROVIDER || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_T24_ONE_FLIGHT_CONFIRM >&2; exit 2; }
              ;;
            *)
              echo HOLD_CD_T24_UNREVIEWED_EVENT
              exit 2
              ;;
          esac
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo HOLD_P6_LITERAL_GATE_GITHUB_RUN_ATTEMPT >&2; exit 2; }
          test "$P5_CD_GH_PRE_STOP" = 0 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PRE_STOP >&2; exit 2; }
          test "$P5_CD_GH_PRE_ARMED" = 1 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PRE_ARMED >&2; exit 2; }
          test "$P5_CD_GH_T24_WITNESS_APPROVED" = 1 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_T24_WITNESS_APPROVED >&2; exit 2; }
          test "$V39_PHASE5_SOURCE_RIGHTS_APPROVED" = 1 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE5_SOURCE_RIGHTS_APPROVED >&2; exit 2; }
          test "$ADB_AUTO_COLLECT" = 0 || { echo HOLD_P6_LITERAL_GATE_ADB_AUTO_COLLECT >&2; exit 2; }
          test -z "$AERODATABOX_API_KEY" || { echo HOLD_P6_PRESENCE_GATE_AERODATABOX_API_KEY >&2; exit 2; }
          test -z "$AERODATABOX_WEBHOOK_SECRET" || { echo HOLD_P6_PRESENCE_GATE_AERODATABOX_WEBHOOK_SECRET >&2; exit 2; }
          test -z "$DATABASE_URL" || { echo HOLD_P6_PRESENCE_GATE_DATABASE_URL >&2; exit 2; }
          test -z "$V39_P5_SOURCE_DATABASE_URL" || { echo HOLD_P6_PRESENCE_GATE_V39_P5_SOURCE_DATABASE_URL >&2; exit 2; }
          test -n "$P5_V39_PRE_DATABASE_URL" || { echo HOLD_P6_PRESENCE_GATE_P5_V39_PRE_DATABASE_URL >&2; exit 2; }
          test -n "$P5_V39_T24_WITNESS_DATABASE_URL" || { echo HOLD_P6_PRESENCE_GATE_P5_V39_T24_WITNESS_DATABASE_URL >&2; exit 2; }
          test -n "$P5_CD_GH_PRE_ROSTER_SHA256" || { echo HOLD_P6_PRESENCE_GATE_P5_CD_GH_PRE_ROSTER_SHA256 >&2; exit 2; }
          case "$P5_CD_GH_PRE_MODE" in
            PHASE5_CANARY)
              test "$P5_CD_GH_PHASE5_CANARY_APPROVED" = 1 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PHASE5_CANARY_APPROVED >&2; exit 2; }
              test "$V39_PHASE6_PROCESS_ARMED" = 0 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE6_PROCESS_ARMED >&2; exit 2; }
              test "$V39_PHASE5_FREEZE_SIGNED" != 1 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE5_FREEZE_SIGNED >&2; exit 2; }
              ;;
            PHASE6_APPROVED)
              test "$P5_CD_GH_PHASE5_CANARY_APPROVED" != 1 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PHASE5_CANARY_APPROVED >&2; exit 2; }
              test "$V39_PHASE6_PROCESS_ARMED" = 1 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE6_PROCESS_ARMED >&2; exit 2; }
              test "$V39_PHASE5_FREEZE_SIGNED" = 1 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE5_FREEZE_SIGNED >&2; exit 2; }
              ;;
            *)
              echo HOLD_NO_INDEPENDENT_T24_CANARY_OR_PHASE6_GO
              exit 2
              ;;
          esac
          [[ "$P5_CD_GH_ROSTER_PATH" =~ ^data-collection/phase5/frozen/[A-Za-z0-9_.-]{8,125}\.json$ ]]
          test -f "$P5_CD_GH_ROSTER_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: One already-registered T24 through original Stage14 and V0081
        # Optional post-ACK custody; these keys/credentials are not
        # supplied to any paid provider job. STOP when not commissioned.
        env:
          P6_T24_CUSTODY_ENABLED: ${{ vars.P6_T24_CUSTODY_ENABLED }}
          P6_T24_CUSTODY_APPROVED: ${{ secrets.P6_T24_CUSTODY_APPROVED }}
          P6_PRIVATE_T24_CUSTODY_REVIEWER_KEY_BASE64: ${{ secrets.P6_PRIVATE_T24_CUSTODY_REVIEWER_KEY_BASE64 }}
          P6_PRIVATE_READER_DATABASE_URL: ${{ secrets.P6_PRIVATE_READER_DATABASE_URL }}
          P6_PRIVATE_PUBLISHER_DATABASE_URL: ${{ secrets.P6_PRIVATE_PUBLISHER_DATABASE_URL }}
          P6_PRIVATE_SOURCE_STORED_REVIEW_APPROVED: ${{ secrets.P6_PRIVATE_SOURCE_STORED_REVIEW_APPROVED }}
          P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64: ${{ secrets.P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64 }}
          P6_NONPAID_DAILY_POLICY_BASE64: ${{ secrets.P6_NONPAID_DAILY_POLICY_BASE64 }}
          P6_NONPAID_DAILY_POLICY_SHA256: ${{ secrets.P6_NONPAID_DAILY_POLICY_SHA256 }}
          V39_P5_RELEASE_SHA256: ${{ secrets.V39_P5_RELEASE_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          npx --no-install tsx scripts/v39_phase5_cd_github_one_queued_t24_witness_v39.ts
          echo P5_CD_QUEUED_T24_PRE_V0081_SEPARATE_WITNESS_ATTEMPT_NO_PAID

  current-private-native-t24:
    environment: phase6-protected-runtime
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_CURRENT_SIGNED_T24_WITH_WITNESS_NO_PROVIDER' && inputs.frozen_roster == '')) && vars.P6_PRIVATE_T24_EXECUTION_ENABLED == '1' && vars.P5_CD_GH_T24_SCHEDULE_ENABLED == '1' && vars.P5_T24_AUTO_DISPATCH_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      ADB_AUTO_COLLECT: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      DATABASE_URL: ''
      V39_DATABASE_RUNTIME_URL: ''
      V39_P5_SOURCE_DATABASE_URL: ''
      P5_V39_PREPARE_DATABASE_URL: ''
      P5_V39_OTHER_REST_REVIEW_DATABASE_URL: ''
      P5_V39_OTHER_REST_RESERVE_DATABASE_URL: ''
      P6_PRIVATE_CURRENT_T24_DISPATCH_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm || '' }}
      P6_PRIVATE_T24_EXECUTION_ENABLED: ${{ vars.P6_PRIVATE_T24_EXECUTION_ENABLED }}
      P5_CD_GH_T24_ONE_FLIGHT_CONFIRM: ONE_REVIEWED_SOURCE_QUEUED_T24_PRE_AND_INDEPENDENT_WITNESS_NO_PROVIDER
      P6_PRIVATE_T24_ENROLL_SCHEDULE_ENABLED: ${{ vars.P6_PRIVATE_T24_ENROLL_SCHEDULE_ENABLED }}
      P5_CD_GH_T24_SCHEDULE_ENABLED: ${{ vars.P5_CD_GH_T24_SCHEDULE_ENABLED }}
      # Legacy Stage24 source-dispatch automation and queued V0092 T24 must not compete.
      P5_T24_AUTO_DISPATCH_ENABLED: ${{ vars.P5_T24_AUTO_DISPATCH_ENABLED }}
      P5_CD_GH_PRE_CONFIRM: 'ONE_SIGNED_SOURCE_BOUND_CD_PRE_NO_PROVIDER'
      P5_CD_GH_PRE_ARMED: ${{ secrets.P5_CD_GH_PRE_ARMED }}
      P5_CD_GH_PRE_STOP: ${{ secrets.P5_CD_GH_PRE_STOP }}
      P5_CD_GH_PRE_MODE: ${{ vars.P5_CD_GH_PRE_MODE }}
      P5_CD_GH_PHASE5_CANARY_APPROVED: ${{ secrets.P5_CD_GH_PHASE5_CANARY_APPROVED }}
      P5_CD_GH_T24_WITNESS_APPROVED: ${{ secrets.P5_CD_GH_T24_WITNESS_APPROVED }}
      P5_CD_GH_PRE_APPROVED_CODE_SHA: ${{ secrets.P5_CD_GH_PRE_APPROVED_CODE_SHA }}
      P5_CD_GH_E_ROUTE_FEATURES_APPROVED: ${{ secrets.P5_CD_GH_E_ROUTE_FEATURES_APPROVED }}
      P5_CD_GH_E_SUPPLEMENTAL_FEATURES_APPROVED: ${{ secrets.P5_CD_GH_E_SUPPLEMENTAL_FEATURES_APPROVED }}
      V39_PHASE5_FREEZE_SIGNED: ${{ secrets.V39_PHASE5_FREEZE_SIGNED }}
      V39_PHASE5_SOURCE_RIGHTS_APPROVED: ${{ secrets.V39_PHASE5_SOURCE_RIGHTS_APPROVED }}
      V39_PHASE6_PROCESS_ARMED: ${{ secrets.V39_PHASE6_PROCESS_ARMED }}
      V39_P5_MANIFEST_SHA256: ${{ secrets.V39_P5_MANIFEST_SHA256 }}
      V39_P5_RIGHTS_SHA256: ${{ secrets.V39_P5_RIGHTS_SHA256 }}
      P5_V39_PRE_DATABASE_URL: ${{ secrets.P5_V39_PRE_DATABASE_URL }}
      P5_V39_T24_WITNESS_DATABASE_URL: ${{ secrets.P5_V39_T24_WITNESS_DATABASE_URL }}
      P6_PHASE7_PRE_POLICY_BASE64: ${{ vars.P5_CD_GH_PRE_MODE == 'PHASE6_APPROVED' && secrets.P6_PHASE7_PRE_POLICY_BASE64 || '' }}
      P6_PHASE7_PRE_PRESERVATION_POLICY_SHA256: ${{ vars.P5_CD_GH_PRE_MODE == 'PHASE6_APPROVED' && secrets.P6_PHASE7_PRE_PRESERVATION_POLICY_SHA256 || '' }}
      P6_PHASE7_PRE_PROOF_REVIEWER_FINGERPRINT_SHA256: ${{ vars.P5_CD_GH_PRE_MODE == 'PHASE6_APPROVED' && secrets.P6_PHASE7_PRE_PROOF_REVIEWER_FINGERPRINT_SHA256 || '' }}
      P6_PHASE7_PRE_PROOF_REVIEWER_PUBLIC_KEY_BASE64: ${{ vars.P5_CD_GH_PRE_MODE == 'PHASE6_APPROVED' && secrets.P6_PHASE7_PRE_PROOF_REVIEWER_PUBLIC_KEY_BASE64 || '' }}
      P6_PHASE7_PRE_READBACK_ROLE: ${{ vars.P5_CD_GH_PRE_MODE == 'PHASE6_APPROVED' && secrets.P6_PHASE7_PRE_READBACK_ROLE || '' }}
      P6_PHASE7_PRE_READBACK_DATABASE_URL: ${{ vars.P5_CD_GH_PRE_MODE == 'PHASE6_APPROVED' && secrets.P6_PHASE7_PRE_READBACK_DATABASE_URL || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Separate STOP-default T24 current registry scheduler
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          case "$GITHUB_EVENT_NAME" in
            schedule) test -z "$P6_PRIVATE_CURRENT_T24_DISPATCH_CONFIRM" ;;
            workflow_dispatch) test "$P6_PRIVATE_CURRENT_T24_DISPATCH_CONFIRM" = RUN_CURRENT_SIGNED_T24_WITH_WITNESS_NO_PROVIDER ;;
            *) exit 2 ;;
          esac
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo HOLD_P6_LITERAL_GATE_GITHUB_RUN_ATTEMPT >&2; exit 2; }
          test "$P6_PRIVATE_T24_EXECUTION_ENABLED" = 1 || { echo HOLD_P6_LITERAL_GATE_P6_PRIVATE_T24_EXECUTION_ENABLED >&2; exit 2; }
          test "$P6_PRIVATE_T24_ENROLL_SCHEDULE_ENABLED" = 1 || { echo HOLD_P6_LITERAL_GATE_P6_PRIVATE_T24_ENROLL_SCHEDULE_ENABLED >&2; exit 2; }
          test "$P5_CD_GH_PRE_STOP" = 0 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PRE_STOP >&2; exit 2; }
          test "$P5_CD_GH_PRE_ARMED" = 1 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PRE_ARMED >&2; exit 2; }
          test "$P5_CD_GH_T24_WITNESS_APPROVED" = 1 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_T24_WITNESS_APPROVED >&2; exit 2; }
          test "$P5_CD_GH_PRE_MODE" = PHASE6_APPROVED || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PRE_MODE >&2; exit 2; }
          test "$V39_PHASE5_FREEZE_SIGNED" = 1 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE5_FREEZE_SIGNED >&2; exit 2; }
          test "$V39_PHASE6_PROCESS_ARMED" = 1 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE6_PROCESS_ARMED >&2; exit 2; }
          test "$V39_PHASE5_SOURCE_RIGHTS_APPROVED" = 1 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE5_SOURCE_RIGHTS_APPROVED >&2; exit 2; }
          test "$ADB_AUTO_COLLECT" = 0 || { echo HOLD_P6_LITERAL_GATE_ADB_AUTO_COLLECT >&2; exit 2; }
          test -z "$AERODATABOX_API_KEY$DATABASE_URL$V39_P5_SOURCE_DATABASE_URL"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Current signed T24 packets through original Stage14 and independent V0081
        # Optional post-ACK custody; these keys/credentials are not
        # supplied to any paid provider job. STOP when not commissioned.
        env:
          P6_T24_CUSTODY_ENABLED: ${{ vars.P6_T24_CUSTODY_ENABLED }}
          P6_T24_CUSTODY_APPROVED: ${{ secrets.P6_T24_CUSTODY_APPROVED }}
          P6_PRIVATE_T24_CUSTODY_REVIEWER_KEY_BASE64: ${{ secrets.P6_PRIVATE_T24_CUSTODY_REVIEWER_KEY_BASE64 }}
          P6_PRIVATE_READER_DATABASE_URL: ${{ secrets.P6_PRIVATE_READER_DATABASE_URL }}
          P6_PRIVATE_PUBLISHER_DATABASE_URL: ${{ secrets.P6_PRIVATE_PUBLISHER_DATABASE_URL }}
          P6_PRIVATE_SOURCE_STORED_REVIEW_APPROVED: ${{ secrets.P6_PRIVATE_SOURCE_STORED_REVIEW_APPROVED }}
          P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64: ${{ secrets.P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64 }}
          P6_NONPAID_DAILY_POLICY_BASE64: ${{ secrets.P6_NONPAID_DAILY_POLICY_BASE64 }}
          P6_NONPAID_DAILY_POLICY_SHA256: ${{ secrets.P6_NONPAID_DAILY_POLICY_SHA256 }}
          V39_P5_RELEASE_SHA256: ${{ secrets.V39_P5_RELEASE_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          npx --no-install tsx scripts/v39_phase6_private_current_t24_worker_v39.mjs
