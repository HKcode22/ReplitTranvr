name: Phase4 Gate5 V0076 Disposable PREPARED to ACTIVE
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-v0076-active-transition-disposable-pg16.yml"
      - "server/lib/disruption/phase4Gate5OwnerActiveTransition_v39.ts"
      - "server/lib/disruption/phase4Gate5V0076DisposableRunningOwner_v39.ts"
      - "scripts/v39_phase4_gate5_v0076_gh_running_disposable_attestation.ts"
      - "tests/phase4_gate5_v0076_disposable_running_owner_v39.test.ts"
      - "data-collection/phase4/2026-11-01_GATE5_GITHUB_API_TO_V0076_DB_DISPOSABLE_BINDING.md"
      - "scripts/v39_phase4_gate5_v0076_active_transition_disposable_pg16_actions.ts"
      - "tests/phase4_gate5_owner_active_transition_v39.test.ts"
      - "data-collection/phase4/2026-11-01_GATE5_V0076_ACTIVE_DISPOSABLE_ONLY.md"
permissions:
  contents: read
  actions: read
jobs:
  disposable-v0076-activation:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate5_activation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gate5_activation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Create only isolated disposable V0076 schema
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          set +x
          test -z "${AERODATABOX_API_KEY:-}"
          test -z "${RAPIDAPI_KEY:-}"
          psql -h localhost -U postgres -d gate5_activation -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA clean;
          CREATE TABLE clean.fids_query_response(id integer);
          CREATE TABLE clean.flight_population(id integer);
          CREATE TABLE clean.provider_content_blob_ref(id integer);
          CREATE TABLE clean.phase3_gate05_science_owner_v39(id integer);
          SQL
          psql -h localhost -U postgres -d gate5_activation -v ON_ERROR_STOP=1 -f migrations/staged/V0076__phase4_gate5_logged_physical_fids_attempt_owner_v39.sql
      - name: Test actual PostgreSQL-clock bounded activation and early provider reservation refusal
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gate5_activation
          P4_G5_ACTIVE_DISPOSABLE_INTENT: SYNTHETIC_ZERO_PROVIDER_NULL_RELEASE
          P4_G5_GH_READ_ONLY_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$GITHUB_REPOSITORY" = HKcode22/ReplitTranvr
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "${AERODATABOX_API_KEY:-}"
          test -z "${RAPIDAPI_KEY:-}"
          test -z "${V39_DATABASE_RUNTIME_URL:-}"
          test -z "${GATE05_AUTOMATION_DATABASE_URL:-}"
          node --import tsx scripts/v39_phase4_gate5_v0076_active_transition_disposable_pg16_actions.ts
      - name: Explicit no-live-source result
        if: always()
        run: |
          {
            echo 'Disposable PostgreSQL16 only; synthetic real clock, NOT source/custody or authorized live prearm.'
            echo 'No production secrets, grant, AeroDataBox GET, physical reservation, raw/PRE write or Phase6.'
            echo 'Live release pin NULL; #200 source semantics and #300 lawful retention must be verified externally.'
          } >> "$GITHUB_STEP_SUMMARY"
