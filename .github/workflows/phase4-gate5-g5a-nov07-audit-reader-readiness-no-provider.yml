name: Phase4 Gate5 G5A Nov7 Audit Reader Readiness (No Provider)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-g5a-nov07-audit-reader-readiness-no-provider.yml"
      - "scripts/v39_phase4_gate5_g5a_nov07_audit_reader_readiness_no_provider.ts"
      - "scripts/v39_phase4_gate5_g5a_nov07_independent_reader_once.ts"
      - "tests/phase4_gate5_g5a_nov07_independent_reader_least_privilege_v39.test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-g5a-nov07-audit-reader-readiness-no-provider.yml"
      - "scripts/v39_phase4_gate5_g5a_nov07_audit_reader_readiness_no_provider.ts"
      - "tests/phase4_gate5_g5a_nov07_independent_reader_least_privilege_v39.test.ts"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gate5-g5a-nov07-independent-reader-protected-readonly
  cancel-in-progress: false
jobs:
  offline-reader-test:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AERODATABOX_API_KEY: ""
      P4_G5_G5A_NOV07_AUDIT_DATABASE_URL: ""
      DATABASE_URL: ""
      V39_DATABASE_RUNTIME_URL: ""
      GATE05_AUTOMATION_DATABASE_URL: ""
      P4_G5_SOURCE_OWNER_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: No-provider independent reader setup and role-admission tests
        run: |
          set -Eeuo pipefail
          npx vitest run tests/phase4_gate5_g5a_nov07_independent_reader_least_privilege_v39.test.ts
          echo 'PROVIDER_CALLS=0 DB_WRITES=0'
  auditor-readiness:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: phase2g-paid
    env:
      P4_G5_G5A_NOV07_AUDIT_DATABASE_URL: ${{ secrets.P4_G5_G5A_NOV07_AUDIT_DATABASE_URL }}
      ADB_AUTO_COLLECT: "0"
      V39_PHASE6_PROCESS_ARMED: "0"
      AERODATABOX_API_KEY: ""
      RAPIDAPI_KEY: ""
      DATABASE_URL: ""
      V39_DATABASE_RUNTIME_URL: ""
      GATE05_AUTOMATION_DATABASE_URL: ""
      P4_G5_SOURCE_OWNER_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Real Nov7 independent audit reader privilege check (no provider)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          set +x
          test "${GITHUB_ACTIONS}" = "true"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "${DATABASE_URL:-}${V39_DATABASE_RUNTIME_URL:-}${GATE05_AUTOMATION_DATABASE_URL:-}${P4_G5_SOURCE_OWNER_DATABASE_URL:-}${AERODATABOX_API_KEY:-}${RAPIDAPI_KEY:-}"
          node --import tsx scripts/v39_phase4_gate5_g5a_nov07_audit_reader_readiness_no_provider.ts > "${RUNNER_TEMP}/g5a-auditor.json"
          jq -ce 'if .status == "G5A_NOV07_INDEPENDENT_AUDIT_READER_READY_NO_PROVIDER"
               and .providerCalls == null
               and .flags.providerCalls == 0 and .flags.databaseWrites == 0
               and .scientificGate5Passed == false
               then {status,flags,tableReadCount,scientificGate5Passed}
               else error("G5A_INDEPENDENT_READER_UNVERIFIED_RECEIPT_HOLD") end'             "${RUNNER_TEMP}/g5a-auditor.json" > "${RUNNER_TEMP}/g5a-safe-auditor.json"
          {
            printf '### Gate5 Nov7 independent reader least privilege check (NO provider)\n'
            printf 'GH run: https://github.com/HKcode22/ReplitTranvr/actions/runs/%s\n' "${GITHUB_RUN_ID}"
            printf 'Reviewed GitHub SHA: %s\n\n' "${GITHUB_SHA}"
            printf '~~~json\n'
            cat "${RUNNER_TEMP}/g5a-safe-auditor.json"
            printf '\n~~~\n'
            printf 'Technical metadata readiness only; no paid request, scientific PASS or production mutation.\n'
          } > "${RUNNER_TEMP}/g5a-safe-auditor.md"
          cat "${RUNNER_TEMP}/g5a-safe-auditor.md" >> "${GITHUB_STEP_SUMMARY}"
          gh issue comment 293 --repo HKcode22/ReplitTranvr --body-file "${RUNNER_TEMP}/g5a-safe-auditor.md"
