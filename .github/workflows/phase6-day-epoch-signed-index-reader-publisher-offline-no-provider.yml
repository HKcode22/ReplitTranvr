name: Phase6 day-epoch signed-index real cryptographic reader and publisher (OFFLINE NO GO)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase6DayEpochSignedIndexOnce_v39.mjs'
      - 'server/lib/disruption/phase6StoredPrivateReviewReadOnce_v39.mjs'
      - 'server/lib/disruption/phase6PrivateSourcePostPublisherOnce_v39.mjs'
      - 'migrations/staged/V0098__phase6_atomic_private_review_wire_transport_inert_v39.sql'
      - 'server/lib/disruption/phase6DayEpochFullRegistryReadOnce_v39.mjs'
      - 'server/lib/disruption/phase6DayEpochOriginalSemanticHandoff_v39.mjs'
      - 'tests/phase6_day_epoch_original_semantic_handoff_v39.test.ts'
      - 'tests/phase6_day_epoch_signed_index_once_v39.test.ts'
      - 'server/lib/disruption/phase6DynamicSourceReviewSelection_v39.mjs'
      - 'tests/phase6_dynamic_source_review_selection_v39.test.mjs'
      - 'tests/phase6_day_epoch_signed_index_real_pg16_v39.mjs'
      - 'scripts/v39_phase6_v0097_day_epoch_owner_schema_readonly_and_once.mjs'
      - 'tests/phase6_v0097_day_epoch_owner_schema_v39.test.mjs'
      - 'migrations/staged/V0097__phase6_private_run_day_epoch_index_inert_v39.sql'
      - '.github/workflows/phase6-day-epoch-signed-index-reader-publisher-offline-no-provider.yml'
permissions:
  contents: read
env:
  CI: 'true'
  DATABASE_URL: ''
  V39_P5_SOURCE_DATABASE_URL: ''
  P5_V39_PRE_DATABASE_URL: ''
  V39_DATABASE_RUNTIME_URL: ''
  P6_PRIVATE_READER_DATABASE_URL: ''
  P6_PRIVATE_SOURCE_TRANSPORT_APPROVED: '0'
  AERODATABOX_API_KEY: ''
  RAPIDAPI_KEY: ''
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
jobs:
  signed-day-epoch-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Real Ed25519 signature and no-provider simulated PG index transaction
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -z "$DATABASE_URL$V39_P5_SOURCE_DATABASE_URL$AERODATABOX_API_KEY$RAPIDAPI_KEY"
          test "$ADB_AUTO_COLLECT" = 0
          test "$V39_PHASE6_PROCESS_ARMED" = 0
          node --test tests/phase6_v0097_day_epoch_owner_schema_v39.test.mjs tests/phase6_dynamic_source_review_selection_v39.test.mjs
          node --check server/lib/disruption/phase6DayEpochSignedIndexOnce_v39.mjs
          node --check server/lib/disruption/phase6DayEpochFullRegistryReadOnce_v39.mjs
          node --check server/lib/disruption/phase6DayEpochOriginalSemanticHandoff_v39.mjs
          npx --no-install vitest run tests/phase6_day_epoch_signed_index_once_v39.test.ts tests/phase6_day_epoch_original_semantic_handoff_v39.test.ts
          echo 'P6_DAY_EPOCH_ED25519_SHA_PG_ACL_OFFLINE_NO_PAID_GO_PASS' >> "$GITHUB_STEP_SUMMARY"

  real-restricted-postgres16-signed-day-index:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: 'neondb'
      P6_DAY_EPOCH_REAL_DISPOSABLE_ONLY: '1'
      P6_REAL_DISPOSABLE_OWNER_URL: 'postgresql://neondb_owner:ci-only-day-real@127.0.0.1:5432/neondb?sslmode=disable'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Install original V0094+V0095 and exact V0097 staged owner wrapper ONLY IN DISPOSABLE PG16
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$CI" = true
          test -z "$DATABASE_URL$AERODATABOX_API_KEY$RAPIDAPI_KEY$V39_P5_SOURCE_DATABASE_URL"
          test "$ADB_AUTO_COLLECT" = 0
          test "$V39_PHASE6_PROCESS_ARMED" = 0
          PGPASSWORD=postgres psql -U postgres -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE neondb_owner LOGIN CREATEROLE PASSWORD 'ci-only-day-real'"
          PGPASSWORD=postgres psql -U postgres -X -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE neondb OWNER TO neondb_owner"
          export PGPASSWORD=ci-only-day-real
          psql -U neondb_owner -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0094__phase6_private_frozen_packet_transport_inert_v39.sql
          psql -U neondb_owner -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0095__phase6_private_source_query_post_packet_kind_scope_inert_v39.sql
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          import pg from "pg";
          import {
            V0097_PATH,readV0097OwnerInventory,installV0097OnceOwner
          } from "./scripts/v39_phase6_v0097_day_epoch_owner_schema_readonly_and_once.mjs";
          assert.equal(process.env.P6_DAY_EPOCH_REAL_DISPOSABLE_ONLY,"1");
          assert.equal(process.env.P6_REAL_DISPOSABLE_OWNER_URL,
            "postgresql://neondb_owner:ci-only-day-real@127.0.0.1:5432/neondb?sslmode=disable");
          const c=new pg.Client({
            connectionString:process.env.P6_REAL_DISPOSABLE_OWNER_URL
          });
          await c.connect();
          try {
            const before=await readV0097OwnerInventory(c);
            assert.equal(before.state,"V0095_READY_EMPTY_V0097_NOT_INSTALLED_NO_GO");
            const bytes=readFileSync(V0097_PATH);
            const installed=await installV0097OnceOwner({client:c,bytes});
            assert.deepEqual(installed.indexRows,{claims:0,revisions:0});
            assert.equal(installed.additionalLoginRolesCreated,0);
            assert.equal(installed.paidPhase6Go,false);
            const after=await readV0097OwnerInventory(c);
            assert.equal(after.state,"V0097_INSTALLED_EMPTY_PER_DAY_INDEX_INERT_NO_GO");
            await assert.rejects(installV0097OnceOwner({client:c,bytes}),
              /PREREQUISITE_OR_ALREADY_PRESENT_NEVER_REPLAY/);
            console.log("V0097_DISPOSABLE_OWNER_SCHEMA_EMPTY_NO_REPLAY_NO_PAID_PASS");
          }finally{await c.end()}
          JS
          psql -U neondb_owner -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0098__phase6_atomic_private_review_wire_transport_inert_v39.sql
          # Already-installed V0098 must refuse replay; only disposable PG16.
          if psql -U neondb_owner -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0098__phase6_atomic_private_review_wire_transport_inert_v39.sql; then
            echo 'HOLD_V0098_REPLAY_UNEXPECTEDLY_SUCCEEDED'; exit 2
          fi
          PGPASSWORD=postgres psql -U postgres -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE phase6_private_publisher_login_ci_epoch LOGIN NOINHERIT PASSWORD 'ci-only-day-pub'"
          PGPASSWORD=postgres psql -U postgres -X -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE phase6_private_reader_login_ci_epoch LOGIN NOINHERIT PASSWORD 'ci-only-day-read'"
          PGPASSWORD=postgres psql -U postgres -X -v ON_ERROR_STOP=1 \
            -c "GRANT phase6_private_frozen_publisher_v39 TO phase6_private_publisher_login_ci_epoch WITH ADMIN FALSE, INHERIT FALSE, SET TRUE"
          PGPASSWORD=postgres psql -U postgres -X -v ON_ERROR_STOP=1 \
            -c "GRANT phase6_private_frozen_reader_v39 TO phase6_private_reader_login_ci_epoch WITH ADMIN FALSE, INHERIT FALSE, SET TRUE"
      - name: Actual signed Ed25519 day1/day31 postgres publish read and old-day byte deletion STOP
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -z "$DATABASE_URL$AERODATABOX_API_KEY$RAPIDAPI_KEY"
          node tests/phase6_day_epoch_signed_index_real_pg16_v39.mjs
          echo 'P6_DAY_EPOCH_SIGNED_RESTRICTED_REAL_PG16_NO_PROVIDER_GO_PASS' >> "$GITHUB_STEP_SUMMARY"
