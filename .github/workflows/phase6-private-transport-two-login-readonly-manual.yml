          const values=Object.fromEntries(names.map(k=>[k,process.env[k]]));
          const digest=createHash('sha256').update(JSON.stringify(values)).digest('hex');
          if(names.some(k=>!values[k])||digest!=='a1637fa624ec3a85c3eb21b9f68f9978f078b4f9911197a5fcd640fdcfb1c66f')throw Error('HOLD_P6_STATIC_SECRET_BYTES_DRIFT');
          console.log(JSON.stringify({status:'P6_ACTUAL_PROTECTED_31_VALUE_READBACK_PASS',staticCount:31,staticValuesSha256:digest,main:'e058b9d0817151d4b10282c9242c6c8ebeef7814',providerCalls:0,databaseWrites:0,phase6PaidGo:false}));
