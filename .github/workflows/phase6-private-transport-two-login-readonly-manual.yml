  verify-post-policy-binding:
    if: ${{ github.repository == 'HKcode22/ReplitTranvr' && github.ref == 'refs/heads/phase6/20261122-protected-final-readback-no-go' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.confirm == 'VERIFY_EXACT_FINAL_STATIC_AND_REVIEWER_ACTORS_NO_PROVIDER_NO_WRITE' && inputs.approved_main_sha == 'e058b9d0817151d4b10282c9242c6c8ebeef7814' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify exact same PRE contract profile and bounded censoring policy
        env:
          P6_PHASE7_PRE_POLICY_BASE64: ${{ secrets.P6_PHASE7_PRE_POLICY_BASE64 }}
          P6_PHASE7_PRE_PRESERVATION_POLICY_SHA256: ${{ secrets.P6_PHASE7_PRE_PRESERVATION_POLICY_SHA256 }}
          P6_PHASE7_POST_CONTRACT_SHA256: ${{ secrets.P6_PHASE7_POST_CONTRACT_SHA256 }}
          P6_PHASE7_POST_PROFILE_SHA256: ${{ secrets.P6_PHASE7_POST_PROFILE_SHA256 }}
          P6_PHASE7_POST_PRESERVATION_POLICY_BASE64: ${{ secrets.P6_PHASE7_POST_PRESERVATION_POLICY_BASE64 }}
          P6_PHASE7_POST_PRESERVATION_POLICY_SHA256: ${{ secrets.P6_PHASE7_POST_PRESERVATION_POLICY_SHA256 }}
          P6_NATIVE_POST_POLICY_SHA256: ${{ secrets.P6_NATIVE_POST_POLICY_SHA256 }}
          V39_P5_MANIFEST_SHA256: ${{ secrets.V39_P5_MANIFEST_SHA256 }}
          V39_P5_RIGHTS_SHA256: ${{ secrets.V39_P5_RIGHTS_SHA256 }}
        run: |
          set -Eeuo pipefail
          set +x
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          const e=process.env,sha=b=>createHash('sha256').update(b).digest('hex');
          const canonical=x=>x===null||typeof x!=='object'?JSON.stringify(x):Array.isArray(x)?'['+x.map(canonical).join(',')+']':'{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+canonical(x[k])).join(',')+'}';
          const hash=x=>sha(canonical(x));
          const pre=JSON.parse(Buffer.from(e.P6_PHASE7_PRE_POLICY_BASE64,'base64')),bytes=Buffer.from(e.P6_PHASE7_POST_PRESERVATION_POLICY_BASE64,'base64'),p=JSON.parse(bytes);
          if(sha(bytes)!==e.P6_PHASE7_POST_PRESERVATION_POLICY_SHA256||pre.reviewSha256!==e.P6_PHASE7_PRE_PRESERVATION_POLICY_SHA256||hash(pre.contract)!==e.P6_PHASE7_POST_CONTRACT_SHA256||hash(pre.profile)!==e.P6_PHASE7_POST_PROFILE_SHA256||p.prePolicySha256!==pre.reviewSha256||p.contractSha256!==hash(pre.contract)||p.profileSha256!==hash(pre.profile)||p.manifestSha256!==e.V39_P5_MANIFEST_SHA256||p.rightsSha256!==e.V39_P5_RIGHTS_SHA256||p.nativePostPolicySha256!==e.P6_NATIVE_POST_POLICY_SHA256||p.unverifiedLabelDisposition!=='CENSOR_AFTER_REVIEWED_POST_OBSERVATION'||p.schema!=='v39.phase7.independent-post-settlement-policy.v1')throw Error('HOLD_P7_EXACT_POST_POLICY_BINDING');
          console.log(JSON.stringify({status:'P7_PROTECTED_POST_POLICY_BINDING_PASS',policySha256:sha(bytes),numericalLabelsCertified:false,providerCalls:0,databaseWrites:0,phase6PaidGo:false}));
          JS
