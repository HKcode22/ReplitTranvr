  verify-four-existing-preservation-logins:
    if: ${{ github.repository == 'HKcode22/ReplitTranvr' && github.ref == 'refs/heads/phase6/20261122-protected-final-readback-no-go' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.confirm == 'VERIFY_EXACT_FINAL_STATIC_AND_REVIEWER_ACTORS_NO_PROVIDER_NO_WRITE' && inputs.approved_main_sha == 'e058b9d0817151d4b10282c9242c6c8ebeef7814' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e058b9d0817151d4b10282c9242c6c8ebeef7814
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Verify existing preservation actor 1 without mutation
        env:
          P6_PHASE7_PRE_READBACK_DATABASE_URL: ${{ secrets.P6_PHASE7_PRE_READBACK_DATABASE_URL }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = 'e058b9d0817151d4b10282c9242c6c8ebeef7814'
          node --input-type=module <<'JS'
          import pg from 'pg';
          import {P7_PRESERVATION_ACTORS,verifyP7PreservationLogin} from './scripts/v39_phase7_preservation_logins_owner_v39.mjs';
          const a=P7_PRESERVATION_ACTORS[0],u=new URL(process.env.P6_PHASE7_PRE_READBACK_DATABASE_URL??'');
