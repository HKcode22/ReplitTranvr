name: Phase5 B0062 active sampling frame owner READ ONLY verification (no provider)
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/v39_phase5_active_frame_for_calendar_readonly_once.mjs"
      - "scripts/phase5_active_frame_for_calendar_owner_readonly_launcher.sh"
      - "tests/phase5_active_frame_for_calendar_readonly_v39.test.mjs"
      - ".github/workflows/phase5-active-frame-for-calendar-readonly-offline.yml"
  push:
    branches: [main]
    paths:
      - "scripts/v39_phase5_active_frame_for_calendar_readonly_once.mjs"
      - "scripts/phase5_active_frame_for_calendar_owner_readonly_launcher.sh"
      - "tests/phase5_active_frame_for_calendar_readonly_v39.test.mjs"
      - ".github/workflows/phase5-active-frame-for-calendar-readonly-offline.yml"
permissions:
  contents: read
env:
  DATABASE_URL: ''
  AERODATABOX_API_KEY: ''
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  V39_PHASE6_OWNER_APPROVED: '0'
jobs:
  exact-readonly-frame-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned npm dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Syntax and immutable owner source blob pin
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/phase5_active_frame_for_calendar_owner_readonly_launcher.sh
          node --check scripts/v39_phase5_active_frame_for_calendar_readonly_once.mjs
          test "$(git hash-object scripts/v39_phase5_active_frame_for_calendar_readonly_once.mjs)" = 4bf7f52c07c48fbfaa09811674f549d79d4aa336
          grep -Fq "BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY" scripts/v39_phase5_active_frame_for_calendar_readonly_once.mjs
          grep -Fq "V39_PHASE6_PROCESS_ARMED=0" scripts/phase5_active_frame_for_calendar_owner_readonly_launcher.sh
      - name: Mock PG16 READ ONLY and refusal tests (no provider, no database)
        run: node --test tests/phase5_active_frame_for_calendar_readonly_v39.test.mjs
