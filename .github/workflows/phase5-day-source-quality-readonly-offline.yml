name: Phase5 Source Day Quality Metadata Audit (Offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5DaySourceQualityReadonly_v39.ts'
      - 'scripts/v39_phase5_day_source_quality_readonly_v39.ts'
      - 'tests/phase5_day_source_quality_readonly_v39.test.ts'
      - 'tests/phase5_day_source_quality_real_pg_v39.test.ts'
      - '.github/workflows/phase5-day-source-quality-readonly-offline.yml'
  push:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5DaySourceQualityReadonly_v39.ts'
      - 'scripts/v39_phase5_day_source_quality_readonly_v39.ts'
      - 'tests/phase5_day_source_quality_readonly_v39.test.ts'
permissions:
  contents: read
jobs:
  source-quality-query-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ''
      V39_DATABASE_RUNTIME_URL: ''
      V39_P5_AUDITOR_DATABASE_URL: ''
      V39_P5_SOURCE_AUDITOR_ROLE_APPROVED: '0'
      AERODATABOX_API_KEY: ''
      V39_PHASE6_PROCESS_ARMED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Check planned/attempted/bound/late denominators, zero provider and DB
        run: |
          set -Eeuo pipefail
          npx vitest run tests/phase5_day_source_quality_readonly_v39.test.ts
          echo 'SOURCE_METADATA_ONLY=1 READONLY_TX=1 PAID_CALLS=0 PHASE6_GO=0'

  authentic-pre-denominator-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_ACTIONS: 'true'
      V39_P5_DAILY_QA_REAL_PG16: '1'
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Apply authentic B0062 and staged V0079 to disposable PostgreSQL16
        run: |
          set -Eeuo pipefail
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
          npx tsx scripts/apply_boot_migrations_v39.ts
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql
      - name: Test true PRE_DEPARTURE/UUID-text lineage and source/flight denominators
        run: |
          set -Eeuo pipefail
          npx vitest run tests/phase5_day_source_quality_real_pg_v39.test.ts
          echo 'P5_DAILY_PRE_LINEAGE_REAL_PG16_PASS=1 PROVIDER_CALLS=0 PRODUCTION_DB_WRITES=0 PHASE6_GO=0'
