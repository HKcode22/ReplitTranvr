name: Phase4 Gate5 V0078 One-Time Installer Disposable PG16
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-v0078-one-time-installer-disposable-pg16.yml"
      - "scripts/v39_phase4_gate5_v0078_one_time_exact_sql_installer.ts"
      - "scripts/v39_phase4_gate5_v0078_installer_disposable_pg16_actions.ts"
      - "scripts/v39_phase4_gate5_v0078_production_readonly_preflight.ts"
      - "migrations/staged/V0078__phase4_gate5_fids_reobservation_uniqueness_v39.sql"
      - "tests/phase4_gate5_v0078_one_time_installer_v39.test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-v0078-one-time-installer-disposable-pg16.yml"
      - "scripts/v39_phase4_gate5_v0078_one_time_exact_sql_installer.ts"
      - "scripts/v39_phase4_gate5_v0078_installer_disposable_pg16_actions.ts"
      - "scripts/v39_phase4_gate5_v0078_production_readonly_preflight.ts"
      - "migrations/staged/V0078__phase4_gate5_fids_reobservation_uniqueness_v39.sql"
      - "tests/phase4_gate5_v0078_one_time_installer_v39.test.ts"
permissions:
  contents: read
env:
  AERODATABOX_API_KEY: ""
  RAPIDAPI_KEY: ""
  GATE05_AUTOMATION_DATABASE_URL: ""
  ADB_AUTO_COLLECT: "0"
  V39_PHASE6_PROCESS_ARMED: "0"
  NODE_ENV: test
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
  V39_DATABASE_RUNTIME_URL: "postgresql://v0078_runtime_fixture:v0078_disposable_only@localhost:5432/v39_ci?sslmode=disable"
jobs:
  v0078-installer-disposable-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v39_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v39_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Verify isolated owner/runtime CI scope and baseline
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test "${GITHUB_REPOSITORY}" = "HKcode22/ReplitTranvr"
          test "${DATABASE_URL}" = "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
          test "${V39_DATABASE_RUNTIME_URL}" = "postgresql://v0078_runtime_fixture:v0078_disposable_only@localhost:5432/v39_ci?sslmode=disable"
          test -z "${AERODATABOX_API_KEY:-}${RAPIDAPI_KEY:-}${GATE05_AUTOMATION_DATABASE_URL:-}"
          test ! -e migrations/current/V0078__phase4_gate5_fids_reobservation_uniqueness_v39.sql
          node --import tsx scripts/apply_boot_migrations_v39.ts
      - name: Disposable PG16: staged V0076/V0077 and separate restricted runtime role
        run: |
          set -Eeuo pipefail
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0076__phase4_gate5_logged_physical_fids_attempt_owner_v39.sql
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0077__phase4_gate5_original_fids_reservation_binding_v39.sql
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -c "CREATE ROLE v0078_runtime_fixture LOGIN PASSWORD 'v0078_disposable_only'"
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA clean TO v0078_runtime_fixture"
      - name: Exact SQL pin and non-privilege regression unit tests
        run: |
          set -Eeuo pipefail
          npx vitest run tests/phase4_gate5_v0078_one_time_installer_v39.test.ts
      - name: Execute real PG16 installer with held-advisory rollback then one commit and replay refusal
        run: |
          set -Eeuo pipefail
          node --import tsx scripts/v39_phase4_gate5_v0078_installer_disposable_pg16_actions.ts
          echo 'PAID_PROVIDER_CALLS=0'
          echo 'PRODUCTION_DDL=0'
          echo 'SCIENTIFIC_GATE5_PASS=false'
