name: Phase4 Gate5 V0077 Metadata Installer Disposable PG16

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-v0077-metadata-installer-disposable-pg16.yml"
      - "scripts/v39_phase4_gate5_v0077_metadata_only_installer.ts"
      - "tests/phase4_gate5_v0077_private_installer_v39.test.ts"
      - "scripts/v39_phase4_gate5_v0077_readonly_failure_diagnosis.ts"
      - "tests/phase4_gate5_v0077_readonly_failure_diagnosis_v39.test.ts"
      - "migrations/staged/V0077__phase4_gate5_original_fids_reservation_binding_v39.sql"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-v0077-metadata-installer-disposable-pg16.yml"
      - "scripts/v39_phase4_gate5_v0077_metadata_only_installer.ts"
      - "tests/phase4_gate5_v0077_private_installer_v39.test.ts"
      - "scripts/v39_phase4_gate5_v0077_readonly_failure_diagnosis.ts"
      - "tests/phase4_gate5_v0077_readonly_failure_diagnosis_v39.test.ts"

permissions:
  contents: read

jobs:
  v0077-private-schema-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NODE_ENV: test
      ADB_AUTO_COLLECT: "0"
      V39_PHASE6_PROCESS_ARMED: "0"
      AERODATABOX_API_KEY: ""
      RAPIDAPI_KEY: ""
      GATE05_AUTOMATION_DATABASE_URL: ""
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
      V39_DATABASE_RUNTIME_URL: "postgresql://gate5_reader:local_test_only@localhost:5432/v39_ci?sslmode=disable"
      V39_GATE5_V0077_INSTALL_INTENT: V0077_ONE_TIME_EMPTY_METADATA_SCHEMA_NO_GRANTS_OR_PROVIDER
      V39_GATE5_V0077_EXPECTED_BLOB: 6783468fccf32de571e7ea77671db7370d9d87a4
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v39_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v39_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Offline exact-binary and role controls
        run: npx vitest run tests/phase4_gate5_v0077_private_installer_v39.test.ts tests/phase4_gate5_v0077_readonly_failure_diagnosis_v39.test.ts
      - name: Build disposable original B0062 and staged physical V0076, no production
        run: |
          set -Eeuo pipefail
          set +x
          test "${GITHUB_ACTIONS}" = "true"
          test "${GITHUB_REPOSITORY}" = "HKcode22/ReplitTranvr"
          test -z "${AERODATABOX_API_KEY}${RAPIDAPI_KEY}${GATE05_AUTOMATION_DATABASE_URL}"
          test "${DATABASE_URL}" = "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
          node --import tsx scripts/apply_boot_migrations_v39.ts
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0076__phase4_gate5_logged_physical_fids_attempt_owner_v39.sql
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -c "CREATE ROLE gate5_reader LOGIN PASSWORD 'local_test_only'"
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA clean TO gate5_reader"
          # Reproduce a real production scenario absent from the first
          # disposable PG test: admin's default object ACLs grant the
          # restricted role access to FUTURE clean tables/functions.
          # Our V0077 installer must revoke ONLY newly created V0077 ACLs
          # and leave older tables/default privileges untouched.
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA clean GRANT SELECT,INSERT,UPDATE,DELETE ON TABLES TO gate5_reader"
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA clean GRANT EXECUTE ON FUNCTIONS TO gate5_reader"
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM pg_default_acl WHERE defaclrole='postgres'::regrole AND defaclnamespace='clean'::regnamespace AND defaclobjtype IN ('r','f')" | grep -qx '2'
      - name: Read-only production-like diagnostic BEFORE V0077 installation
        run: |
          set -Eeuo pipefail
          set +x
          OUTPUT="$(node --import tsx scripts/v39_phase4_gate5_v0077_readonly_failure_diagnosis.ts)"
          echo "$OUTPUT" | grep -q '"status":"READY_FOR_ONE_TIME_V0077_PRIVATE_SCHEMA_INSTALL"'
          echo "V0077_DISPOSABLE_BEFORE_DIAGNOSTIC_PASS"
      - name: Actual transactional V0077 private metadata installer against separate restricted role
        run: |
          set -Eeuo pipefail
          set +x
          node --import tsx scripts/v39_phase4_gate5_v0077_metadata_only_installer.ts
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM clean.phase4_g5_fids_original_binding_v39" | grep -qx '0'
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -Atc "SELECT has_table_privilege('gate5_reader','clean.phase4_g5_fids_original_binding_v39','INSERT')" | grep -qx 'f'
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -Atc "SELECT has_table_privilege('gate5_reader','clean.phase4_g5_fids_original_binding_v39','SELECT')" | grep -qx 'f'
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -Atc "SELECT has_table_privilege('gate5_reader','clean.phase4_g5_fids_original_binding_v39','UPDATE')" | grep -qx 'f'
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -Atc "SELECT has_table_privilege('gate5_reader','clean.phase4_g5_fids_original_binding_v39','DELETE')" | grep -qx 'f'
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -Atc "SELECT has_function_privilege('gate5_reader','clean.phase4_g5_check_original_binding_v39()','EXECUTE')" | grep -qx 'f'
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -Atc "SELECT has_function_privilege('gate5_reader','clean.phase4_g5_original_binding_immutable_update_v39()','EXECUTE')" | grep -qx 'f'
          # Default ACL settings must NOT be modified by the V0077 installer.
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM pg_default_acl WHERE defaclrole='postgres'::regrole AND defaclnamespace='clean'::regnamespace AND defaclobjtype IN ('r','f')" | grep -qx '2'
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM clean.phase4_g5_fids_physical_attempt_v39" | grep -qx '0'
      - name: Read-only diagnostic AFTER V0077 install verifies private ACL
        run: |
          set -Eeuo pipefail
          set +x
          OUTPUT="$(node --import tsx scripts/v39_phase4_gate5_v0077_readonly_failure_diagnosis.ts)"
          echo "$OUTPUT" | grep -q '"status":"ALREADY_INSTALLED_PRIVATE_READONLY_VERIFIED"'
          echo "$OUTPUT" | grep -q '"runtimeCanInsertV0077":false'
          echo "$OUTPUT" | grep -q '"runtimeCanSelectV0077":false'
          echo "V0077_DISPOSABLE_PRIVATE_READONLY_DIAGNOSTIC_PASS"
      - name: Attempted second/duplicate V0077 installation MUST reject
        run: |
          set -Eeuo pipefail
          set +x
          if node --import tsx scripts/v39_phase4_gate5_v0077_metadata_only_installer.ts; then
            echo "HOLD_UNEXPECTED_V0077_INSTALLER_REPLAY_SUCCEEDED"
            exit 2
          fi
          echo "V0077_DISPOSABLE_METADATA_INSTALL_ONCE_AND_REPLAY_HOLD_PASS"
      - name: No real project authorization
        if: always()
        run: |
          echo 'Disposable PG16 V0077 DDL with synthetic role only; no production schema changes, paid provider, source retention expansion or live owner.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Scientific Gate5, Phase5 and Phase6 remain explicitly held.' >> "$GITHUB_STEP_SUMMARY"
