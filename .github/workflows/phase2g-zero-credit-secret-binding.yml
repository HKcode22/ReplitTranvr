name: Phase2G Zero-Credit Secret Binding

on:
  workflow_dispatch:
    inputs:
      callback_base:
        description: 'Exact live Replit callback origin'
        required: true
        type: string
      expected_head:
        description: 'Exact source HEAD the live runtime must advertise'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: phase2g-paid
    env:
      AERODATABOX_WEBHOOK_SECRET: ${{ secrets.AERODATABOX_WEBHOOK_SECRET }}
    steps:
      - name: Refuse missing secret
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${AERODATABOX_WEBHOOK_SECRET:-}" ]] || {
            echo "::error::Missing AERODATABOX_WEBHOOK_SECRET"
            exit 2
          }

      - name: Verify exact development runtime
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --silent --show-error --fail-with-body --max-time 15 "${{ inputs.callback_base }}/__v39/workspace-runtime")"
          HEALTH="$HEALTH" EXPECTED_HEAD="${{ inputs.expected_head }}" node --input-type=module <<'NODE'
          const health = JSON.parse(process.env.HEALTH ?? "{}");
          const expected = String(process.env.EXPECTED_HEAD ?? "").toLowerCase();
          if (
            health?.schema !== "v39.phase2f-workspace-runtime.v1" ||
            health?.status !== "PASS" ||
            String(health?.git_head ?? "").toLowerCase() !== expected ||
            health?.prepaid_route_registered !== true ||
            Number(health?.retention_hours) !== 168 ||
            health?.provider_mutation !== false ||
            health?.runtime_owner_mode !== "replit-managed-project" ||
            health?.managed_replit_workflow !== true ||
            health?.published_deployment !== false
          ) {
            console.error("RUNTIME_BINDING_REFUSED");
            process.exit(2);
          }
          console.log("RUNTIME_BINDING=PASS");
          NODE

      - name: Verify GitHub secret is accepted by live Replit
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --fail-with-body --max-time 15 \
            -X POST \
            -H "x-v39-phase2g-webhook-secret: ${AERODATABOX_WEBHOOK_SECRET}" \
            "${{ inputs.callback_base }}/__v39/phase2g/webhook-secret-match")"
          RESPONSE="$RESPONSE" node --input-type=module <<'NODE'
          const response = JSON.parse(process.env.RESPONSE ?? "{}");
          if (
            response?.schema !== "v39.phase2g-webhook-secret-match.v1" ||
            response?.status !== "PASS" ||
            response?.provider_call !== false ||
            response?.provider_mutation !== false ||
            Number(response?.alert_credits_spent) !== 0
          ) {
            console.error("SECRET_BINDING_REFUSED");
            process.exit(2);
          }
          console.log("GITHUB_REPLIT_WEBHOOK_SECRET_BINDING=PASS");
          console.log("provider_call=false");
          console.log("provider_mutation=false");
          console.log("alert_credits_spent=0");
          NODE
