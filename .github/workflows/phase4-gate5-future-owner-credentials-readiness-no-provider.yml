name: Phase4 Gate5 Future Owner Credentials Readiness (No Provider)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-future-owner-credentials-readiness-no-provider.yml"
      - "scripts/v39_phase4_gate5_future_github_source_owner_readonly_readiness.ts"
      - "tests/phase4_gate5_github_source_owner_readiness_no_provider_v39.test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-future-owner-credentials-readiness-no-provider.yml"
      - "scripts/v39_phase4_gate5_future_github_source_owner_readonly_readiness.ts"
      - "tests/phase4_gate5_github_source_owner_readiness_no_provider_v39.test.ts"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase4-gate5-future-owner-secrets-readiness-no-provider
  cancel-in-progress: false
jobs:
  offline-secretless-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: GitHub owner account and role decision tests (no secrets)
        run: |
          set -Eeuo pipefail
          test -z "${DATABASE_URL:-}${V39_DATABASE_RUNTIME_URL:-}${AERODATABOX_API_KEY:-}${GATE05_AUTOMATION_DATABASE_URL:-}${P4_G5_SOURCE_OWNER_DATABASE_URL:-}"
          npx vitest run tests/phase4_gate5_github_source_owner_readiness_no_provider_v39.test.ts
          echo 'PROVIDER_CALLS=0'
          echo 'DB_WRITES=0'
  future-owner-readiness:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: [offline-secretless-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: phase2g-paid
    env:
      P4_G5_OWNER_READONLY_INTENT: CHECK_CREDENTIALS_AND_ROLES_NO_PROVIDER
      AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
      GATE05_AUTOMATION_DATABASE_URL: ${{ secrets.GATE05_AUTOMATION_DATABASE_URL }}
      P4_G5_SOURCE_OWNER_DATABASE_URL: ${{ secrets.P4_G5_SOURCE_OWNER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Verify main is exact checked out GitHub revision and no implicit provider dispatch
        run: |
          set -Eeuo pipefail
          set +x
          test "${GITHUB_ACTIONS}" = "true"
          test "${GITHUB_REPOSITORY}" = "HKcode22/ReplitTranvr"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${GITHUB_JOB}" = "future-owner-readiness"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "${DATABASE_URL:-}${V39_DATABASE_RUNTIME_URL:-}${RAPIDAPI_KEY:-}"
          echo 'NO_PROVIDER_HTTP_AND_NO_MUTATIONS'
      - name: Read GitHub owner and independent audit role capabilities (READ ONLY)
        run: |
          set -Eeuo pipefail
          set +x
          node --import tsx scripts/v39_phase4_gate5_future_github_source_owner_readonly_readiness.ts
      - name: Scientific/paid release remains disabled
        if: always()
        run: |
          echo 'This checks only secret presence and PostgreSQL catalog privileges using read-only transactions.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No paid source request, no mutable DB permission change, no T/actual-only/retention certification, and no scientific Gate5 PASS.' >> "$GITHUB_STEP_SUMMARY"
