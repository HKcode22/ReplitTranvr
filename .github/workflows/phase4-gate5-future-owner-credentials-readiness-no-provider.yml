name: Phase4 Gate5 Future Owner Credentials Readiness (No Provider)
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-future-owner-credentials-readiness-no-provider.yml"
      - "scripts/v39_phase4_gate5_future_github_source_owner_readonly_readiness.ts"
      - "tests/phase4_gate5_github_source_owner_readiness_no_provider_v39.test.ts"
      - "scripts/v39_phase4_gate5_g5a_real_wsss_horizon_owner.ts"
      - "scripts/v39_phase4_gate5_g5a_prospective_post_schedule_observation.ts"
      - ".github/workflows/phase4-gate5-g5a-real-wsss-prospective-owner.yml"
      - ".github/workflows/phase4-gate5-g5a-wsss-real-post.yml"
      - "data-collection/phase4/GATE5_G5A_WSSS_20261105_1400Z_FROZEN_SOURCE_GRID.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-future-owner-credentials-readiness-no-provider.yml"
      - "scripts/v39_phase4_gate5_future_github_source_owner_readonly_readiness.ts"
      - "tests/phase4_gate5_github_source_owner_readiness_no_provider_v39.test.ts"
      - "scripts/v39_phase4_gate5_g5a_real_wsss_horizon_owner.ts"
      - "scripts/v39_phase4_gate5_g5a_prospective_post_schedule_observation.ts"
      - ".github/workflows/phase4-gate5-g5a-real-wsss-prospective-owner.yml"
      - ".github/workflows/phase4-gate5-g5a-wsss-real-post.yml"
      - "data-collection/phase4/GATE5_G5A_WSSS_20261105_1400Z_FROZEN_SOURCE_GRID.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase4-gate5-future-owner-secrets-readiness-no-provider
  cancel-in-progress: false
jobs:
  offline-secretless-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: GitHub owner account and role decision tests (no secrets)
        run: |
          set -Eeuo pipefail
          test -z "${DATABASE_URL:-}${V39_DATABASE_RUNTIME_URL:-}${AERODATABOX_API_KEY:-}${GATE05_AUTOMATION_DATABASE_URL:-}${P4_G5_SOURCE_OWNER_DATABASE_URL:-}"
          npx vitest run tests/phase4_gate5_github_source_owner_readiness_no_provider_v39.test.ts
          echo 'PROVIDER_CALLS=0'
          echo 'DB_WRITES=0'
  future-owner-readiness:
    permissions:
      contents: read
      issues: write
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: [offline-secretless-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: phase2g-paid
    env:
      P4_G5_OWNER_READONLY_INTENT: CHECK_CREDENTIALS_AND_ROLES_NO_PROVIDER
      AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
      GATE05_AUTOMATION_DATABASE_URL: ${{ secrets.GATE05_AUTOMATION_DATABASE_URL }}
      P4_G5_SOURCE_OWNER_DATABASE_URL: ${{ secrets.P4_G5_SOURCE_OWNER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Verify main is exact checked out GitHub revision and no implicit provider dispatch
        run: |
          set -Eeuo pipefail
          set +x
          test "${GITHUB_ACTIONS}" = "true"
          test "${GITHUB_REPOSITORY}" = "HKcode22/ReplitTranvr"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${GITHUB_JOB}" = "future-owner-readiness"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "${DATABASE_URL:-}${V39_DATABASE_RUNTIME_URL:-}${RAPIDAPI_KEY:-}"
          echo 'NO_PROVIDER_HTTP_AND_NO_MUTATIONS'
      - name: Read and publish anonymized owner readiness to Gate5 issue 293 (READ ONLY)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          set +x
          REPORT="$(node --import tsx scripts/v39_phase4_gate5_future_github_source_owner_readonly_readiness.ts)"
          SAFE="$(printf '%s' "$REPORT" | jq -ce '
            if .schema == "v39.phase4.gate5-github-owner-credential-capability-readonly.v1"
              and .providerCalls == 0 and .databaseWrites == 0
              and .scientificGate5Passed == false
              and (.status | type == "string")
              and (.flags | type == "object")
              and (.flags | all(.[]; type == "boolean"))
            then {status,flags,providerCalls,databaseWrites,scientificGate5Passed}
            else error("P4_G5_UNEXPECTED_READINESS_RECEIPT_HOLD") end
          ')"
          printf '%s\n' "$SAFE"
          {
            echo '### Phase 4 Gate 5: GitHub environment candidate readiness (NO provider)'
            echo 'GitHub source owner, auditor, and plan evidence were checked without sending any HTTP provider request.'
            echo "$SAFE"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            printf '### Gate5 GitHub-only owner-readiness check (no provider / no DB writes)\n'
            printf 'Run: https://github.com/HKcode22/ReplitTranvr/actions/runs/%s\n' "$GITHUB_RUN_ID"
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf '~~~json\n%s\n~~~\n' "$SAFE"
            printf '\nThis is a technical credential report only. Do not dispatch paid source collection based on it alone.\n'
          } > "$RUNNER_TEMP/g5-owner-readiness-summary.md"
          gh issue comment 293 --repo HKcode22/ReplitTranvr --body-file "$RUNNER_TEMP/g5-owner-readiness-summary.md"
      - name: Scientific/paid release remains disabled
        if: always()
        run: |
          echo 'This checks only secret presence and PostgreSQL catalog privileges using read-only transactions.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No paid source request, no mutable DB permission change, no T/actual-only/retention certification, and no scientific Gate5 PASS.' >> "$GITHUB_STEP_SUMMARY"
