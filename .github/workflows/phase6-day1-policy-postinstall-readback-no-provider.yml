name: P6 Day1 exact policy postinstall readback NO PROVIDER
on:
  push:
    branches:
      - phase6/20261122-g8-502-readback-evidence
    paths:
      - 'data-collection/phase6/evidence/p6_day1_policy_postinstall_readback.json'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: p6-day1-repo-secret-readback
  cancel-in-progress: false
jobs:
  repository-secret-readback:
    if: >-
      github.repository == 'HKcode22/ReplitTranvr' &&
      github.ref == 'refs/heads/phase6/20261122-g8-502-readback-evidence' &&
      github.actor == 'HKcode22' && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADB_AUTO_COLLECT: '0'
      AERODATABOX_API_KEY: ''
      RAPIDAPI_KEY: ''
      DATABASE_URL: ''
      P6_G12_SECRET_READBACK_SCOPE: 'repository'
      V39_P5_APPROVED_CODE_SHA: ${{ secrets.V39_P5_APPROVED_CODE_SHA }}
      P6_NONPAID_SOURCE_APPROVED_MAIN_SHA: ${{ secrets.P6_NONPAID_SOURCE_APPROVED_MAIN_SHA }}
      V39_P5_ACTUAL_NATIVE_REVIEW_APPROVED_CODE_SHA: ${{ secrets.V39_P5_ACTUAL_NATIVE_REVIEW_APPROVED_CODE_SHA }}
      P5_CD_GH_PRE_APPROVED_CODE_SHA: ${{ secrets.P5_CD_GH_PRE_APPROVED_CODE_SHA }}
      V39_P5_POST_APPROVED_CODE_SHA: ${{ secrets.V39_P5_POST_APPROVED_CODE_SHA }}
      P6_PRIVATE_SOURCE_PARENT_RO_MAIN_SHA: ${{ secrets.P6_PRIVATE_SOURCE_PARENT_RO_MAIN_SHA }}
      V39_P5_QUEUE_APPROVED_CODE_SHA: ${{ secrets.V39_P5_QUEUE_APPROVED_CODE_SHA }}
      V39_P5_MANIFEST_SHA256: ${{ secrets.V39_P5_MANIFEST_SHA256 }}
      V39_P5_CALENDAR_HASH: ${{ secrets.V39_P5_CALENDAR_HASH }}
      V39_P5_CONFIG_HASH: ${{ secrets.V39_P5_CONFIG_HASH }}
      V39_P5_FRAME_HASH: ${{ secrets.V39_P5_FRAME_HASH }}
      V39_P5_RELEASE_SHA256: ${{ secrets.V39_P5_RELEASE_SHA256 }}
      V39_P5_RIGHTS_SHA256: ${{ secrets.V39_P5_RIGHTS_SHA256 }}
      V39_P5_PROVIDER_CONTRACT_SHA256: ${{ secrets.V39_P5_PROVIDER_CONTRACT_SHA256 }}
      P6_INERT_STAGE_INPUT_JSON: ${{ secrets.P6_INERT_STAGE_INPUT_JSON }}
      P6_INERT_STAGE_INPUT_SHA256: ${{ secrets.P6_INERT_STAGE_INPUT_SHA256 }}
      P6_INERT_COST_ENVELOPE_SHA256: ${{ secrets.P6_INERT_COST_ENVELOPE_SHA256 }}
      P6_PRIVATE_POST_OUTCOME_TAIL_HOURS: ${{ secrets.P6_PRIVATE_POST_OUTCOME_TAIL_HOURS }}
      V39_P5_POST_PROVIDER_CONTRACT_SHA256: ${{ secrets.V39_P5_POST_PROVIDER_CONTRACT_SHA256 }}
      V39_P5_POST_CATEGORY_BUDGET_SHA256: ${{ secrets.V39_P5_POST_CATEGORY_BUDGET_SHA256 }}
      V39_P5_POST_PRICE_SHA256: ${{ secrets.V39_P5_POST_PRICE_SHA256 }}
      P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64: ${{ secrets.P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64 }}
      P6_NONPAID_DAILY_POLICY_BASE64: ${{ secrets.P6_NONPAID_DAILY_POLICY_BASE64 }}
      P6_NONPAID_SIGNING_POLICY_BASE64: ${{ secrets.P6_NONPAID_SIGNING_POLICY_BASE64 }}
      P6_NONPAID_TRANSPORT_TRUST_BASE64: ${{ secrets.P6_NONPAID_TRANSPORT_TRUST_BASE64 }}
      P6_PRIVATE_POST_REVIEWER_TRUST_BASE64: ${{ secrets.P6_PRIVATE_POST_REVIEWER_TRUST_BASE64 }}
      P6_NATIVE_POST_POLICY_BASE64: ${{ secrets.P6_NATIVE_POST_POLICY_BASE64 }}
      P6_NONPAID_DAILY_POLICY_SHA256: ${{ secrets.P6_NONPAID_DAILY_POLICY_SHA256 }}
      P6_NONPAID_SIGNING_POLICY_SHA256: ${{ secrets.P6_NONPAID_SIGNING_POLICY_SHA256 }}
      P6_NONPAID_TRANSPORT_TRUST_SHA256: ${{ secrets.P6_NONPAID_TRANSPORT_TRUST_SHA256 }}
      P6_NATIVE_POST_POLICY_SHA256: ${{ secrets.P6_NATIVE_POST_POLICY_SHA256 }}
      P6_PHASE7_POST_PRESERVATION_POLICY_BASE64: ${{ secrets.P6_PHASE7_POST_PRESERVATION_POLICY_BASE64 }}
      P6_PHASE7_POST_PRESERVATION_POLICY_SHA256: ${{ secrets.P6_PHASE7_POST_PRESERVATION_POLICY_SHA256 }}
      V39_PHASE6_PROCESS_ARMED: ${{ secrets.V39_PHASE6_PROCESS_ARMED }}
      V39_PHASE6_OWNER_APPROVED: ${{ secrets.V39_PHASE6_OWNER_APPROVED }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify exact immutable source and current main without exposing values
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git hash-object data-collection/phase6/checkpoints/p6_day1_policy_postinstall_readback.cjs)" = f6173cc335f68f01104255b31a0dcb808f6f197f
          TARGET="$(jq -er .reviewedMainSha data-collection/phase6/evidence/p6_day1_policy_postinstall_readback.json)"
          test "$(gh api repos/HKcode22/ReplitTranvr/git/ref/heads/main --jq '.object.sha')" = "$TARGET"
          gh api repos/HKcode22/ReplitTranvr/pulls/965 | jq -e --arg t "$TARGET" '.merged==true and .merge_commit_sha==$t and .head.sha=="9c9cddb1aaeb04934d94af2937ee158e6d991f6c"' >/dev/null
          TREE="$(gh api repos/HKcode22/ReplitTranvr/git/commits/9c9cddb1aaeb04934d94af2937ee158e6d991f6c --jq .tree.sha)"
          gh api "repos/HKcode22/ReplitTranvr/git/commits/$TARGET" | jq -e --arg t "$TREE" '.tree.sha==$t and ([.parents[].sha]==["c8e065d665ccacb6d2575070e94c5500b7583044","9c9cddb1aaeb04934d94af2937ee158e6d991f6c"])' >/dev/null
          node --check data-collection/phase6/checkpoints/p6_day1_policy_postinstall_readback.cjs
      - name: Check 31 canonical installed policy values and both OFF switches in THIS scope
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          node data-collection/phase6/checkpoints/p6_day1_policy_postinstall_readback.cjs
