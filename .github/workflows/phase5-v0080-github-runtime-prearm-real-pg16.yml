name: Phase5 V0080 Real GitHub Run Prearm PG16 (NO Paid)
on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/staged/V0080__phase5_bind_actual_github_run_id_before_fids_get_v39.sql'
      - 'server/lib/disruption/phase5V0080GitHubPrearm_v39.ts'
      - 'server/lib/disruption/phase5GitHubOneQueryReleaseAdmission_v39.ts'
      - 'scripts/v39_phase5_one_query_github_fids_source_owner_v39.ts'
      - 'tests/phase5_github_source_one_query_release_admission_v39.test.ts'
      - 'tests/phase5_v0080_runtime_github_prearm_real_pg_v39.test.ts'
      - '.github/workflows/phase5-v0080-github-runtime-prearm-real-pg16.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/staged/V0080__phase5_bind_actual_github_run_id_before_fids_get_v39.sql'
      - 'server/lib/disruption/phase5V0080GitHubPrearm_v39.ts'
      - 'server/lib/disruption/phase5GitHubOneQueryReleaseAdmission_v39.ts'
      - 'scripts/v39_phase5_one_query_github_fids_source_owner_v39.ts'
      - 'tests/phase5_github_source_one_query_release_admission_v39.test.ts'
      - 'tests/phase5_v0080_runtime_github_prearm_real_pg_v39.test.ts'
permissions:
  contents: read
env:
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable'
  V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable'
  V39_P5_V0080_PG16: '1'
  V39_P5_SOURCE_OWNER_APPROVED: '0'
  V39_PHASE5_FREEZE_SIGNED: '0'
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  AERODATABOX_API_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
jobs:
  real-pg16-no-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v39_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v39_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Install only B0062 V0079 V0080 in disposable PG16
        run: |
          set -Eeuo pipefail
          test "${DATABASE_URL}" = "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
          npx tsx scripts/apply_boot_migrations_v39.ts
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0080__phase5_bind_actual_github_run_id_before_fids_get_v39.sql
      - name: Synthetic source template + actual run ID prearm and V0079 paid-attempt denial
        run: |
          set -Eeuo pipefail
          test "${DATABASE_URL}" = "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
          npx vitest run tests/phase5_github_source_one_query_release_admission_v39.test.ts tests/phase5_v0080_runtime_github_prearm_real_pg_v39.test.ts
          echo 'PAID_CALLS=0 DISPOSABLE_PG16_ONLY=1 REPLIT_DB_WRITES=0 PHASE6_GO=0'
