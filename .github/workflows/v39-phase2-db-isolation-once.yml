name: V3.9 Phase2 DB Isolation Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply DB isolation patch
        run: |
          python3 scripts/phase2_v39_db_split_patch_once.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/v39_db_separation_v39.test.ts')
          s=p.read_text()
          malformed='expect(provision).not.toContain("DATABASE_RUNTIME_URL", runtimeUrl");'
          if malformed in s:
              s=s.replace(malformed, 'expect(provision).not.toContain(\'upsertEnvVar(env, "DATABASE_RUNTIME_URL"\');', 1)
          else:
              legacy='expect(provision).not.toContain("DATABASE_RUNTIME_URL\\\", runtimeUrl");'
              if legacy not in s:
                  raise SystemExit('expected generated legacy-key assertion missing')
              s=s.replace(legacy, 'expect(provision).not.toContain(\'upsertEnvVar(env, "DATABASE_RUNTIME_URL"\');', 1)
          p.write_text(s)
          PY
      - name: Validate targeted and offline suite
        run: |
          npx vitest run tests/v39_db_separation_v39.test.ts tests/phase0_closure_v39.test.ts tests/retention_matrix_v39.test.ts
          npm run v39:typecheck
          npm run v39:test:offline
          git diff --check
      - name: Commit repair and self-delete scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/phase2_v39_db_split_patch_once.py .github/workflows/v39-phase2-db-isolation-once.yml
          git add server/lib/disruption/db_v39.ts server/routes_v3.ts server/lib/disruption scripts tests
          git commit -m 'V3.9 Phase2 P: isolate clean-schema runtime database role'
          git push origin HEAD:main
