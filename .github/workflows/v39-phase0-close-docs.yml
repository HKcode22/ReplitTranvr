name: V3.9 Phase0 Closure Documentation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v39-phase0-close-docs.yml

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record superseding Phase0 closure status and RUN-010
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          CODE_SHA = "022bc3933b6e6928293e7c6a8ce86d45aa2b3493"
          CI_RUN = "34345546738"
          LOG_MARKER = "<!-- V39_PHASE0_RUN010_STATUS -->"
          REPORT_MARKER = "<!-- RUN-20260909-010 -->"

          log_path = Path("SEPmd/V3.9_IMPLEMENTATION_LOG.md")
          log = log_path.read_text()
          if LOG_MARKER not in log:
              block = f'''\n{LOG_MARKER}\n> **CURRENT SUPERSEDING STATUS — RUN-20260909-010 (2026-09-09): PHASE 0 = PASS / COMPLETE.**\n> Exact tested code SHA: `{CODE_SHA}`. Formal zero-provider CI run: `{CI_RUN}` = **SUCCESS**. Fresh repository base schema provisioning, production V3.9 boot migrations, migration idempotence replay, schema/trigger verification, TypeScript, offline tests, full tests, lint, registry, traceability, contradiction scanner, aggregate Phase-0 preflight, and production build all passed. `ADB_AUTO_COLLECT=0`, `V39_PHASE6_PROCESS_ARMED=0`, and no AeroDataBox API key was supplied; no paid/provider operation was performed.\n> **NEXT AUTHORIZED STEP: Phase 1 / Gate 0 = GO.** Gate 0 remains verification only; this Phase-0 closure does **not** authorize probes, canary, Phase 6, or other paid collection. Live security/account/deployment evidence remains owned by its later binding gate/prerequisite.\n> Any older active-manual text below that says `PHASE0 = NO-GO`, `IMPLEMENTATION_REQUIRED`, or `GATE0 = BLOCKED until Phase0` is a retained historical snapshot and is **superseded by this current status block**. The binding Plan remains unchanged.\n'''
              first_nl = log.find("\n")
              log = log[:first_nl+1] + block + log[first_nl+1:]
              log_path.write_text(log)

          report_path = Path("SEPmd/V3.9_RUN_REPORTS_AND_EVIDENCE.md")
          report = report_path.read_text()
          if REPORT_MARKER not in report:
              block = f'''\n{REPORT_MARKER}\n## RUN-20260909-010 — Formal Phase-0 closure on exact tested SHA `{CODE_SHA}`\n\n**Status:** `PHASE0 = PASS / COMPLETE` → `PHASE1 / GATE0 = GO`\n\n**Supersedes current-readiness conclusions in RUN-008/RUN-009 without modifying their historical records.** The prior closure claims were independently re-audited and repaired on the Phase-0 repair branch before this run.\n\n### Exact closure evidence\n\n- Repository: `HKcode22/ReplitTranvr`\n- Exact tested code SHA: `{CODE_SHA}`\n- Formal GitHub Actions run: `{CI_RUN}` (`V3.9 Phase0 Offline Safety`) — **SUCCESS**\n- Production base-schema provisioning — PASS\n- Production V3.9 boot migrations on fresh V3.9 layer — PASS\n- Exact migration replay / idempotence — PASS\n- Current schema + trigger verifier — PASS\n- TypeScript — PASS\n- Offline V3.9 tests — PASS\n- Full test suite — PASS (405/405 tests in the repaired Phase-0 suite)\n- Lint — PASS\n- Registry — PASS\n- Traceability — PASS\n- Contradiction scanner — PASS\n- Aggregate `v39:preflight` — PASS\n- Production build — PASS\n\n### Safety boundary\n\nThe closure workflow forced `ADB_AUTO_COLLECT=0` and `V39_PHASE6_PROCESS_ARMED=0`, used an ephemeral PostgreSQL database, and supplied no AeroDataBox API key. **No paid provider request, probe, canary, subscription mutation, or Phase-6 collection was performed.**\n\n### Decision\n\nPhase 0 is closed on the exact tested code state above. The next authorized action is **Phase 1 / Gate 0** only. Gate 0 must establish the current provider account/channel/budget/cost facts required by the binding Plan. This entry does not authorize later paid probes/canary/Phase 6 before their gates pass.\n\n---\n'''
              # Newest-first evidence ledger: add the new immutable run entry immediately
              # after the file's introductory separator; historical RUN entries remain untouched.
              sep = report.find("\n---\n")
              if sep >= 0:
                  pos = sep + len("\n---\n")
                  report = report[:pos] + block + report[pos:]
              else:
                  report = block + report
              report_path.write_text(report)

          # Self-remove this one-shot administrative workflow so the final tree
          # differs from the tested code state only by the two documentation files.
          Path(".github/workflows/v39-phase0-close-docs.yml").unlink()
          PY

      - name: Commit closure documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SEPmd/V3.9_IMPLEMENTATION_LOG.md SEPmd/V3.9_RUN_REPORTS_AND_EVIDENCE.md .github/workflows/v39-phase0-close-docs.yml
          if git diff --cached --quiet; then
            echo "Closure documentation already current."
            exit 0
          fi
          git commit -m "RUN-20260909-010: formal Phase0 closure evidence"
          git push origin HEAD:main
