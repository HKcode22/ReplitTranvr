name: Phase6 autonomous GitHub controller heartbeat (NO PROVIDER, NO GO)
on:
  # A nonpaid control-plane observation, NOT a new collection clock.
  # Original five-/ten-minute SOURCE/PRE/REAPER jobs remain unchanged.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Existing health/rolling preview/failed custody or READONLY_TERMINAL_ROLLING_WINDOW_CUSTODY_NO_PROVIDER_NO_GO'
        required: true
        type: string
      approved_main_sha:
        description: 'Required exact current main for preview or custody readback'
        required: false
        type: string
        default: ''
      failed_run_id:
        description: 'Exact failed rolling controller run ID (readback only)'
        required: false
        type: string
        default: ''
      failed_main_sha:
        description: 'Exact failed rolling controller commit SHA (readback only)'
        required: false
        type: string
        default: ''
      terminal_window_scope_json:
        description: 'Exact content-free root, code, policy, mode and UTC bounds for terminal readback only'
        required: false
        type: string
        default: ''
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase6AutonomousGithubControllerHeartbeat_v39.mjs'
      - 'scripts/v39_phase6_github_controller_heartbeat_v39.mjs'
      - 'scripts/v39_phase6_rolling_github_preview_v39.mjs'
      - 'scripts/v39_phase6_rolling_failure_readback_v39.mjs'
      - 'scripts/v39_phase6_rolling_window_terminal_readback_v39.mjs'
      - 'server/lib/disruption/phase6RollingWindowTerminalEvidence_v39.mjs'
      - 'tests/phase6_rolling_window_terminal_readback_v39.test.mjs'
      - 'server/lib/disruption/phase6RollingFailureCustodyReadback_v39.mjs'
      - 'tests/phase6_rolling_failure_readback_v39.test.mjs'
      - 'tests/phase6_rolling_github_preview_v39.test.mjs'
      - 'tests/phase6_autonomous_github_controller_heartbeat_v39.test.mjs'
      - 'server/lib/disruption/phase6RollingGithubController_v39.mjs'
      - 'tests/phase6_rolling_github_controller_v39.test.mjs'
      - '.github/workflows/phase6-autonomous-gh-controller-heartbeat-no-provider.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: p6-nonpaid-gh-controller-heartbeat-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false
env:
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  V39_PHASE6_OWNER_APPROVED: '0'
  AERODATABOX_API_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
  RAPIDAPI_KEY: ''
  DATABASE_URL: ''
  V39_DATABASE_RUNTIME_URL: ''
  V39_P5_SOURCE_DATABASE_URL: ''
  P5_V39_PRE_DATABASE_URL: ''
  P5_V39_T24_WITNESS_DATABASE_URL: ''
jobs:
  offline-no-provider-regression:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Offline mock current nine controller histories
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -z "$AERODATABOX_API_KEY$DATABASE_URL$RAPIDAPI_KEY$GITHUB_TOKEN"
          test "$ADB_AUTO_COLLECT" = 0
          test "$V39_PHASE6_PROCESS_ARMED" = 0
          node --test tests/phase6_autonomous_github_controller_heartbeat_v39.test.mjs tests/phase6_rolling_github_controller_v39.test.mjs tests/phase6_rolling_github_preview_v39.test.mjs tests/phase6_rolling_failure_readback_v39.test.mjs tests/phase6_rolling_window_terminal_readback_v39.test.mjs
          echo 'GH_AUTO_HEARTBEAT_OFFLINE_PASS_NO_PROVIDER_NO_DB_NO_PAID'

  actual-main-nonpaid-controller-heartbeat:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' &&
            (inputs.confirm == 'READONLY_GITHUB_CONTROLLER_HEALTH_NO_PROVIDER_NO_GO' ||
            ((inputs.confirm == 'PREVIEW_ROLLING_CONTROLLER_READONLY_NO_PROVIDER_NO_DISPATCH' || inputs.confirm == 'READONLY_FAILED_ROLLING_CUSTODY_NO_REPLAY_NO_PROVIDER' || inputs.confirm == 'READONLY_TERMINAL_ROLLING_WINDOW_CUSTODY_NO_PROVIDER_NO_GO') && inputs.approved_main_sha == github.sha)))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      P6_CONTROLLER_HEARTBEAT_EXECUTE: '1'
      P6_CONTROLLER_HEARTBEAT_CONFIRM: ${{ inputs.confirm }}
      P6_ROLLING_PREVIEW_APPROVED_MAIN: ${{ inputs.approved_main_sha }}
      P6_ROLLING_FAILED_RUN_ID: ${{ inputs.failed_run_id }}
      P6_ROLLING_FAILED_MAIN_SHA: ${{ inputs.failed_main_sha }}
      P6_ROLLING_WINDOW_SCOPE_JSON: ${{ inputs.terminal_window_scope_json }}
      P6_ROLLING_CONTROLLER_ENABLED: ${{ vars.P6_ROLLING_CONTROLLER_ENABLED }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 'STOP: no secrets / no paid / no database / exact main-only action'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$GITHUB_REPOSITORY" = "HKcode22/ReplitTranvr"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$ADB_AUTO_COLLECT" = "0"
          test "$V39_PHASE6_PROCESS_ARMED" = "0"
          test "$V39_PHASE6_OWNER_APPROVED" = "0"
          test -z "$AERODATABOX_API_KEY$AERODATABOX_WEBHOOK_SECRET$RAPIDAPI_KEY"
          test -z "$DATABASE_URL$V39_DATABASE_RUNTIME_URL$V39_P5_SOURCE_DATABASE_URL"
          test -z "$P5_V39_PRE_DATABASE_URL$P5_V39_T24_WITNESS_DATABASE_URL"
          test -n "$GITHUB_TOKEN"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read only GH workflow-run history for nine existing controllers
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if [ "$P6_CONTROLLER_HEARTBEAT_CONFIRM" = PREVIEW_ROLLING_CONTROLLER_READONLY_NO_PROVIDER_NO_DISPATCH ]; then
            node scripts/v39_phase6_rolling_github_preview_v39.mjs
          elif [ "$P6_CONTROLLER_HEARTBEAT_CONFIRM" = READONLY_FAILED_ROLLING_CUSTODY_NO_REPLAY_NO_PROVIDER ]; then
            node scripts/v39_phase6_rolling_failure_readback_v39.mjs
          elif [ "$P6_CONTROLLER_HEARTBEAT_CONFIRM" = READONLY_TERMINAL_ROLLING_WINDOW_CUSTODY_NO_PROVIDER_NO_GO ]; then
            node scripts/v39_phase6_rolling_window_terminal_readback_v39.mjs
          else
            node scripts/v39_phase6_github_controller_heartbeat_v39.mjs
          fi
          echo 'PHASE6_GITHUB_AUTO_HEARTBEAT_OBSERVED_NO_PROVIDER_NO_DB_NO_GO'
