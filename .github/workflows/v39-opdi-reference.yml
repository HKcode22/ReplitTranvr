name: V3.9 OPDI Traffic Reference

on:
  workflow_dispatch:
  push:
    branches:
      - v39-p-phase2-closure-audit-20260911
    paths:
      - '.github/workflows/v39-opdi-reference.yml'
      - 'scripts/v39_build_opdi_reference_v39.py'
      - 'scripts/v39_validate_opdi_reference_v39.ts'
      - 'server/lib/disruption/trafficReference_v39.ts'
      - 'server/lib/disruption/trafficReferenceFreshness_v39.ts'

permissions:
  contents: read

env:
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_ARMED: '0'

jobs:
  build-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact safety branch commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install public-data build dependencies
        run: python -m pip install --disable-pip-version-check 'duckdb>=1.1,<2' 'requests>=2.32,<3'

      - name: Build 12-month OPDI candidate reference
        run: |
          mkdir -p /tmp/v39-opdi-output
          python scripts/v39_build_opdi_reference_v39.py \
            --output /tmp/v39-opdi-output/traffic-reference-opdi-candidate.json \
            --diagnostics /tmp/v39-opdi-output/traffic-reference-opdi-diagnostics.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked repository dependencies
        run: npm ci

      - name: Validate candidate against Phase-2 admission contract
        run: npx tsx scripts/v39_validate_opdi_reference_v39.ts /tmp/v39-opdi-output/traffic-reference-opdi-candidate.json

      - name: Publish reference + diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v39-opdi-traffic-reference-${{ github.sha }}
          path: |
            /tmp/v39-opdi-output/traffic-reference-opdi-candidate.json
            /tmp/v39-opdi-output/traffic-reference-opdi-diagnostics.json
          if-no-files-found: error
          retention-days: 14
