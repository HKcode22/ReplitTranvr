name: Phase5B exact executable successor compatibility
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: p6-phase5b-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  phase5b-runtime-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --include=dev --no-audit --no-fund
      - run: node --test tests/phase6_private_signed_index_read_once_v39.test.mjs tests/phase6_stored_source_child_dispatcher_v39.test.mjs tests/phase6_nonpaid_source_day_github_runtime_v39.test.mjs
