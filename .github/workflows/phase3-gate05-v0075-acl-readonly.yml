name: Gate05 V0075 Runtime ACL Diagnosis — GitHub Read-Only, No Provider

# Independent, no-spend permission evidence for the failed pre-COMMIT installer.
# Automatic ONLY on a reviewed main change to this diagnostic or workflow.
# Uses existing protected DB secrets; never reaches AeroDataBox or writes DB.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase3-gate05-v0075-acl-readonly.yml"
      - "scripts/v39_gate05_v0075_runtime_acl_readonly_20261028.mjs"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Run SELECT-only role/ACL diagnosis without provider API"
        required: true
        type: choice
        options:
          - READONLY_GATE05_V0075_ACL_NO_PROVIDER_NO_DDL

permissions:
  contents: read

concurrency:
  group: gate05-v0075-runtime-acl-readonly
  cancel-in-progress: false

jobs:
  readonly-runtime-permission:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirmation == 'READONLY_GATE05_V0075_ACL_NO_PROVIDER_NO_DDL') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: phase2g-paid
    steps:
      - name: Checkout pinned reviewed main, no persisted token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked runtime-only deps WITHOUT scripts or secrets
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Exactly pinned PostgreSQL READ ONLY, no paid API
        shell: bash
        env:
          GATE05_ACL_REVIEWED_MAIN_SHA: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.GATE05_AUTOMATION_DATABASE_URL }}
          V39_DATABASE_RUNTIME_URL: ${{ secrets.V39_DATABASE_RUNTIME_URL }}
          AERODATABOX_API_KEY: ""
          RAPIDAPI_KEY: ""
          GH_TOKEN: ""
        run: |
          set -Eeuo pipefail
          set +x
          test "${GITHUB_ACTIONS}" = "true"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GATE05_ACL_REVIEWED_MAIN_SHA}" = "${GITHUB_SHA}"
          test -z "${AERODATABOX_API_KEY}"
          test -z "${RAPIDAPI_KEY}"
          test -z "${GH_TOKEN}"
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${V39_DATABASE_RUNTIME_URL:-}" ]; then
            echo "HOLD_READONLY_GITHUB_ENV_DB_SECRETS_UNAVAILABLE"
            exit 2
          fi
          node --check scripts/v39_gate05_v0075_runtime_acl_readonly_20261028.mjs
          node scripts/v39_gate05_v0075_runtime_acl_readonly_20261028.mjs
      - name: Interpretation / never authorize payment
        if: always()
        shell: bash
        run: |
          {
            echo "## V0075 runtime ACL — read-only diagnosis only"
            echo "This job inspected PostgreSQL role and default ACL metadata within READ ONLY transaction."
            echo "No DB COMMIT, DDL, GRANT, REVOKE, paid REST, Alert CREATE/DELETE, refill, or Replit publish."
            echo "Any HOLD remains a HOLD. Neither this job nor a green result starts a paid Gate05 pilot."
            echo "If status is pending, check the existing protected environment review; do not rerun installer."
          } >> "${GITHUB_STEP_SUMMARY}"
