name: Phase5 C+D existing V0087 lease watchdog (STOP default, no provider)
on:
  schedule:
    # Preserve the existing cadence, stagger core starts; not a timing SLA.
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REAP_EXISTING_CD_LEASES_ONLY_NO_REPLAY_NO_PROVIDER"
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase5-cd-github-existing-queue-lease-watchdog.yml'
      - 'server/lib/disruption/phase5CdGithubLeaseWatchdog_v39.ts'
      - 'server/lib/disruption/phase5CdGithubPreReleaseGate_v39.ts'
      - 'scripts/v39_phase5_cd_github_lease_watchdog_once_v39.ts'
      - 'tests/phase5_cd_github_lease_watchdog_offline_v39.test.ts'
permissions:
  contents: read
concurrency:
  group: phase5-cd-existing-lease-watchdog-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false
env:
  P6_PHASE5B_RUNTIME_EXECUTABLE_SHA: ${{ github.ref == 'refs/heads/main' && vars.P6_PHASE5B_RUNTIME_EXECUTABLE_SHA || '' }}
jobs:
  offline-watchdog-safety:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      DATABASE_URL: ''
      P5_V39_PRE_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Test STOP, V0092 restricted privileges and no UNKNOWN replay
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --no-install vitest run tests/phase5_cd_github_lease_watchdog_offline_v39.test.ts
          echo P5_CD_EXISTING_QUEUE_WATCHDOG_OFFLINE_NO_PROVIDER_PASS
  reviewed-existing-queue-watchdog:
    environment: phase6-protected-runtime
    if: >-
      ${{ github.ref == 'refs/heads/main'
          && vars.P5_CD_GH_WATCHDOG_ENABLED == '1'
          && (github.event_name == 'schedule'
              || (github.event_name == 'workflow_dispatch'
                  && inputs.confirm == 'REAP_EXISTING_CD_LEASES_ONLY_NO_REPLAY_NO_PROVIDER')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ADB_AUTO_COLLECT: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      DATABASE_URL: ''
      V39_DATABASE_RUNTIME_URL: ''
      V39_P5_SOURCE_DATABASE_URL: ''
      P5_V39_PREPARE_DATABASE_URL: ''
      P5_V39_T24_WITNESS_DATABASE_URL: ''
      P5_V39_OTHER_REST_REVIEW_DATABASE_URL: ''
      P5_V39_OTHER_REST_RESERVE_DATABASE_URL: ''
      P5_CD_GH_WATCHDOG_ENABLED: ${{ vars.P5_CD_GH_WATCHDOG_ENABLED }}
      P5_CD_GH_WATCHDOG_EXECUTE: '1'
      P5_CD_GH_WATCHDOG_CONFIRM: ${{ github.event_name == 'schedule' && 'REAP_EXISTING_CD_LEASES_ONLY_NO_REPLAY_NO_PROVIDER' || inputs.confirm }}
      P5_CD_GH_PRE_CONFIRM: 'ONE_SIGNED_SOURCE_BOUND_CD_PRE_NO_PROVIDER'
      P5_CD_GH_PRE_ARMED: ${{ secrets.P5_CD_GH_PRE_ARMED }}
      P5_CD_GH_PRE_STOP: ${{ secrets.P5_CD_GH_PRE_STOP }}
      P5_CD_GH_PRE_MODE: ${{ vars.P5_CD_GH_PRE_MODE }}
      P5_CD_GH_PHASE5_CANARY_APPROVED: ${{ secrets.P5_CD_GH_PHASE5_CANARY_APPROVED }}
      P5_CD_GH_PRE_APPROVED_CODE_SHA: ${{ secrets.P5_CD_GH_PRE_APPROVED_CODE_SHA }}
      P6_PRIVATE_CURRENT_PRE_SCHEDULE_ENABLED: ${{ vars.P6_PRIVATE_CURRENT_PRE_SCHEDULE_ENABLED }}
      P5_CD_GH_PRE_ROSTER_SHA256: ${{ vars.P6_PRIVATE_CURRENT_PRE_SCHEDULE_ENABLED != '1' && secrets.P5_CD_GH_PRE_ROSTER_SHA256 || '' }}
      P6_PRIVATE_SOURCE_STORED_REVIEW_APPROVED: ${{ vars.P6_PRIVATE_CURRENT_PRE_SCHEDULE_ENABLED == '1' && secrets.P6_PRIVATE_SOURCE_STORED_REVIEW_APPROVED || '' }}
      P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64: ${{ vars.P6_PRIVATE_CURRENT_PRE_SCHEDULE_ENABLED == '1' && secrets.P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64 || '' }}
      V39_P5_RELEASE_SHA256: ${{ vars.P6_PRIVATE_CURRENT_PRE_SCHEDULE_ENABLED == '1' && secrets.V39_P5_RELEASE_SHA256 || '' }}
      V39_PHASE5_FREEZE_SIGNED: ${{ secrets.V39_PHASE5_FREEZE_SIGNED }}
      V39_PHASE5_SOURCE_RIGHTS_APPROVED: ${{ secrets.V39_PHASE5_SOURCE_RIGHTS_APPROVED }}
      V39_PHASE6_PROCESS_ARMED: ${{ secrets.V39_PHASE6_PROCESS_ARMED }}
      V39_P5_MANIFEST_SHA256: ${{ secrets.V39_P5_MANIFEST_SHA256 }}
      V39_P5_RIGHTS_SHA256: ${{ secrets.V39_P5_RIGHTS_SHA256 }}
      P5_V39_PRE_DATABASE_URL: ${{ secrets.P5_V39_PRE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Stop before dependencies, provider or Neon session
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$GITHUB_REPOSITORY" = HKcode22/ReplitTranvr
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo HOLD_P6_LITERAL_GATE_GITHUB_RUN_ATTEMPT >&2; exit 2; }
          test "$P5_CD_GH_WATCHDOG_ENABLED" = 1 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_WATCHDOG_ENABLED >&2; exit 2; }
          test "$P5_CD_GH_WATCHDOG_CONFIRM" = REAP_EXISTING_CD_LEASES_ONLY_NO_REPLAY_NO_PROVIDER || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_WATCHDOG_CONFIRM >&2; exit 2; }
          test "$P5_CD_GH_PRE_STOP" = 0 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PRE_STOP >&2; exit 2; }
          test "$P5_CD_GH_PRE_ARMED" = 1 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PRE_ARMED >&2; exit 2; }
          test "$V39_PHASE5_SOURCE_RIGHTS_APPROVED" = 1 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE5_SOURCE_RIGHTS_APPROVED >&2; exit 2; }
          test -n "$P5_CD_GH_PRE_APPROVED_CODE_SHA" || { echo HOLD_P6_PRESENCE_GATE_P5_CD_GH_PRE_APPROVED_CODE_SHA >&2; exit 2; }
          if [[ "$P6_PRIVATE_CURRENT_PRE_SCHEDULE_ENABLED" == 1 ]]; then
            test "$P5_CD_GH_PRE_MODE" = PHASE6_APPROVED || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PRE_MODE >&2; exit 2; }
            test -z "$P5_CD_GH_PRE_ROSTER_SHA256" || { echo HOLD_P6_PRESENCE_GATE_P5_CD_GH_PRE_ROSTER_SHA256 >&2; exit 2; }
            [[ ( "$P5_CD_GH_PRE_APPROVED_CODE_SHA" == "$GITHUB_SHA" && -z "${P6_PHASE5B_RUNTIME_EXECUTABLE_SHA:-}" ) || ( "$P5_CD_GH_PRE_APPROVED_CODE_SHA" == "9c9cddb1aaeb04934d94af2937ee158e6d991f6c" && "$GITHUB_SHA" == "${P6_PHASE5B_RUNTIME_EXECUTABLE_SHA:-}" ) ]] || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PRE_APPROVED_CODE_SHA >&2; exit 2; }
            test "$P6_PRIVATE_SOURCE_STORED_REVIEW_APPROVED" = 1 || { echo HOLD_P6_LITERAL_GATE_P6_PRIVATE_SOURCE_STORED_REVIEW_APPROVED >&2; exit 2; }
            test -n "$P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64" || { echo HOLD_P6_PRESENCE_GATE_P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64 >&2; exit 2; }
            test -n "$V39_P5_RELEASE_SHA256" || { echo HOLD_P6_PRESENCE_GATE_V39_P5_RELEASE_SHA256 >&2; exit 2; }
          else
            test -n "$P5_CD_GH_PRE_ROSTER_SHA256" || { echo HOLD_P6_PRESENCE_GATE_P5_CD_GH_PRE_ROSTER_SHA256 >&2; exit 2; }
          fi
          test -n "$P5_V39_PRE_DATABASE_URL" || { echo HOLD_P6_PRESENCE_GATE_P5_V39_PRE_DATABASE_URL >&2; exit 2; }
          test "$ADB_AUTO_COLLECT" = 0 || { echo HOLD_P6_LITERAL_GATE_ADB_AUTO_COLLECT >&2; exit 2; }
          test -z "$AERODATABOX_API_KEY" || { echo HOLD_P6_PRESENCE_GATE_AERODATABOX_API_KEY >&2; exit 2; }
          test -z "$AERODATABOX_WEBHOOK_SECRET" || { echo HOLD_P6_PRESENCE_GATE_AERODATABOX_WEBHOOK_SECRET >&2; exit 2; }
          test -z "$DATABASE_URL" || { echo HOLD_P6_PRESENCE_GATE_DATABASE_URL >&2; exit 2; }
          test -z "$V39_DATABASE_RUNTIME_URL" || { echo HOLD_P6_PRESENCE_GATE_V39_DATABASE_RUNTIME_URL >&2; exit 2; }
          test -z "$V39_P5_SOURCE_DATABASE_URL" || { echo HOLD_P6_PRESENCE_GATE_V39_P5_SOURCE_DATABASE_URL >&2; exit 2; }
          case "$P5_CD_GH_PRE_MODE" in
            PHASE5_CANARY)
              test "$P5_CD_GH_PHASE5_CANARY_APPROVED" = 1 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PHASE5_CANARY_APPROVED >&2; exit 2; }
              test "$V39_PHASE6_PROCESS_ARMED" = 0 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE6_PROCESS_ARMED >&2; exit 2; }
              test "$V39_PHASE5_FREEZE_SIGNED" != 1 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE5_FREEZE_SIGNED >&2; exit 2; }
              ;;
            PHASE6_APPROVED)
              test "$P5_CD_GH_PHASE5_CANARY_APPROVED" != 1 || { echo HOLD_P6_LITERAL_GATE_P5_CD_GH_PHASE5_CANARY_APPROVED >&2; exit 2; }
              test "$V39_PHASE6_PROCESS_ARMED" = 1 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE6_PROCESS_ARMED >&2; exit 2; }
              test "$V39_PHASE5_FREEZE_SIGNED" = 1 || { echo HOLD_P6_LITERAL_GATE_V39_PHASE5_FREEZE_SIGNED >&2; exit 2; }
              ;;
            *)
              echo HOLD_NO_INDEPENDENT_WATCHDOG_RELEASE
              exit 2
              ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Bounded existing V0087 reaper, UNKNOWN quarantines never replay
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          npx --no-install tsx scripts/v39_phase5_cd_github_lease_watchdog_once_v39.ts
          echo P5_CD_EXISTING_QUEUE_WATCHDOG_ATTEMPT_NO_PAID
