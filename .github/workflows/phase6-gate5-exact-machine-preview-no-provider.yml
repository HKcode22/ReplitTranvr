name: Phase6 Gate5 exact Monday machine preview (no provider)
on:
  push:
    branches:
      - phase6/owner-current-main-continuation
    paths:
      - '.github/workflows/phase6-gate5-exact-machine-preview-no-provider.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8cfdac354e5fb8ae53c92e9c67880a7c1577dd81
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Exact main deterministic Monday preview only
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "8cfdac354e5fb8ae53c92e9c67880a7c1577dd81"
          test -z "${AERODATABOX_API_KEY:-}${RAPIDAPI_KEY:-}${AERODATABOX_WEBHOOK_SECRET:-}${DATABASE_URL:-}${V39_DATABASE_RUNTIME_URL:-}"
          GITHUB_ACTIONS=false \
          ADB_AUTO_COLLECT=0 \
          V39_PHASE6_PROCESS_ARMED=0 \
          V39_PHASE6_OWNER_APPROVED=0 \
          npx --no-install tsx review-tools/p6_nov23_prospective_revision_owner_v39.ts \
            --preview RECOVER_EXACT_NOV22_FROM_COMMITTED_EVIDENCE
