name: Phase6 Gate5 exact Monday machine preview (no provider)
on:
  push:
    branches:
      - phase6/owner-current-main-continuation
    paths:
      - '.github/workflows/phase6-gate5-exact-machine-preview-no-provider.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 96c5fb0dcfe4a02f08361fc712bf1995e50fe2f7
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Exact main deterministic Monday preview only
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "96c5fb0dcfe4a02f08361fc712bf1995e50fe2f7"
          test -z "${AERODATABOX_API_KEY:-}${RAPIDAPI_KEY:-}${AERODATABOX_WEBHOOK_SECRET:-}${DATABASE_URL:-}${V39_DATABASE_RUNTIME_URL:-}"
          PREVIEW="$(GITHUB_ACTIONS=false ADB_AUTO_COLLECT=0 V39_PHASE6_PROCESS_ARMED=0 V39_PHASE6_OWNER_APPROVED=0 \
            npx --no-install tsx review-tools/p6_nov23_prospective_revision_owner_v39.ts \
            --preview RECOVER_EXACT_NOV22_FROM_COMMITTED_EVIDENCE)"
          echo "$PREVIEW"
          export PREVIEW
          export DECISION_PATH="$GITHUB_WORKSPACE/data-collection/phase5/evidence/2026-11-21_monday_exact_machine_bound_date_decision.json"
          export VALIDATOR_MODULE="$GITHUB_WORKSPACE/review-tools/p6_nov23_prospective_revision_owner_v39.ts"
          cat > /tmp/validate_gate5_decision.ts <<'TS'
          import {readFileSync} from "node:fs";
          import {pathToFileURL} from "node:url";
          const p=JSON.parse(process.env.PREVIEW!);
          if(p.reviewDigest!=="3eb640b6aa44de9c137847da70bee74d0a7d2897d14ad60975726fe6c55a63e1"||
             p.dateReceiptSha256!=="2d760133b7f881e9233f645756b0b6cf1f57464a3800c1442e3d0c39a5e722e6"||
             p.sourceInventorySha256!=="70c7b655c09ae5bca086f553c709d8e7c53e2384003e092587b9e0c587f01c1f")
            throw Error("HOLD_GATE5_EVIDENCE_ONLY_DIGEST_CHANGED");
          const mod=await import(pathToFileURL(process.env.VALIDATOR_MODULE!).href);
          const d=JSON.parse(readFileSync(process.env.DECISION_PATH!,"utf8"));
          mod.validateP6MondayDateDecision(d,{
            reviewDigest:p.reviewDigest,dateReceiptSha256:p.dateReceiptSha256,
            oldStageSha256:p.oldStageSha256,sourceInventorySha256:p.sourceInventorySha256
          },new Date());
          console.log(JSON.stringify({status:"GATE5_MACHINE_BOUND_DATE_DECISION_VALIDATED_NO_GO",
            reviewDigest:p.reviewDigest,providerCalls:0,databaseWrites:0,phase6PaidGo:false}));
          TS
          npx --no-install tsx /tmp/validate_gate5_decision.ts
