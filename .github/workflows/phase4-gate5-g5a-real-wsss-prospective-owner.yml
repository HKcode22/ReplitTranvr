name: Phase4 Gate5 G5A WSSS Real Prospective GitHub Owner
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-g5a-real-wsss-prospective-owner.yml"
      - "scripts/v39_phase4_gate5_g5a_real_wsss_horizon_owner.ts"
      - "server/lib/disruption/phase4Gate5OwnerActiveTransition_v39.ts"
      - "data-collection/phase4/GATE5_G5A_WSSS_20261105_FROZEN_SOURCE_GRID.json"
      - "tests/phase4_gate5_g5a_real_wsss_owner_v39.test.ts"
      - "tests/phase4_gate5_g5a_active_science_mode_v39.test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-g5a-real-wsss-prospective-owner.yml"
      - "scripts/v39_phase4_gate5_g5a_real_wsss_horizon_owner.ts"
      - "server/lib/disruption/phase4Gate5OwnerActiveTransition_v39.ts"
      - "data-collection/phase4/GATE5_G5A_WSSS_20261105_FROZEN_SOURCE_GRID.json"
      - "tests/phase4_gate5_g5a_real_wsss_owner_v39.test.ts"
      - "tests/phase4_gate5_g5a_active_science_mode_v39.test.ts"
  workflow_dispatch:
    inputs:
      horizon:
        description: "One missed GitHub schedule fallback, inside true prospective prearm window only"
        required: true
        type: choice
        options:
          - T-6h
          - T-90m
  schedule:
    # T-24h on Nov3 was MISSED; never backfill it as an observed PRE.
    # Multiple future non-hour-boundary CRON slots mitigate GH schedule drops.
    # The same fixed cohort, one owner/horizon and 24-unit V0076 cap apply.
    # T-6h prearm: Nov4 UTC 15:47,16:17,16:47,17:17.
    - cron: "47 15 4 11 *"
    - cron: "17 16 4 11 *"
    - cron: "47 16 4 11 *"
    - cron: "17 17 4 11 *"
    # T-90m prearm: Nov4 UTC 20:17,20:47,21:17,21:47.
    - cron: "17 20 4 11 *"
    - cron: "47 20 4 11 *"
    - cron: "17 21 4 11 *"
    - cron: "47 21 4 11 *"
permissions:
  contents: read
  actions: read
concurrency:
  # A delayed backup must not sit behind a successful owner until its PRE
  # deadline expires. Distinct GitHub invocations race safely under V0076
  # SERIALIZABLE DB locks and one-owner/horizon uniqueness.
  group: phase4-g5-g5a-wsss-20261105-${{ github.event.schedule || inputs.horizon || github.run_id }}
  cancel-in-progress: false
jobs:
  offline-integrity:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      AERODATABOX_API_KEY: ""
      GATE05_AUTOMATION_DATABASE_URL: ""
      P4_G5_SOURCE_OWNER_DATABASE_URL: ""
      DATABASE_URL: ""
      V39_DATABASE_RUNTIME_URL: ""
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Prove GH source owner job admission is impossible offline
        run: |
          set -Eeuo pipefail
          npx vitest run tests/phase4_gate5_g5a_real_wsss_owner_v39.test.ts tests/phase4_gate5_g5a_active_science_mode_v39.test.ts
          echo 'PROVIDER_CALLS=0 DB_MUTATIONS=0 LIVE_OWNER_RELEASE=NO'
  owner-t24:
    name: owner-t24
    # That honest T-24h prearm deadline has elapsed. Never revive/backfill.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment: phase2g-paid
    env:
      P4_G5_G5A_HORIZON: T-24h
      P4_G5_G5A_CRON: "40 22 3 11 *"
      P4_G5_G5A_PAID_INTENT: WSSS_NOV05_G5A_ONE_PROSPECTIVE_THREE_HORIZON_18_UNIT_MAX
      ADB_AUTO_COLLECT: "0"
      V39_PHASE6_PROCESS_ARMED: "0"
      AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
      P4_G5_SOURCE_OWNER_DATABASE_URL: ${{ secrets.P4_G5_SOURCE_OWNER_DATABASE_URL }}
      V39_DATABASE_RUNTIME_URL: ${{ secrets.P4_G5_SOURCE_OWNER_DATABASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Prospective WSSS T−24h 3× unique source + bound operating PRE
        run: |
          set -Eeuo pipefail
          set +x
          test -z "${DATABASE_URL:-}${RAPIDAPI_KEY:-}${GATE05_AUTOMATION_DATABASE_URL:-}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          node --import tsx scripts/v39_phase4_gate5_g5a_real_wsss_horizon_owner.ts
  owner-t6:
    name: owner-t6
    if: ${{ (github.event_name == 'schedule' && contains(fromJSON('["47 15 4 11 *","17 16 4 11 *","47 16 4 11 *","17 17 4 11 *"]'), github.event.schedule)) || (github.event_name == 'workflow_dispatch' && inputs.horizon == 'T-6h') }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment: phase2g-paid
    env:
      P4_G5_G5A_HORIZON: T-6h
      P4_G5_G5A_CRON: ${{ github.event.schedule || 'manual-reviewed' }}
      P4_G5_G5A_MANUAL_HORIZON: ${{ inputs.horizon || '' }}
      P4_G5_G5A_PAID_INTENT: WSSS_NOV05_G5A_ONE_PROSPECTIVE_THREE_HORIZON_18_UNIT_MAX
      ADB_AUTO_COLLECT: "0"
      V39_PHASE6_PROCESS_ARMED: "0"
      AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
      P4_G5_SOURCE_OWNER_DATABASE_URL: ${{ secrets.P4_G5_SOURCE_OWNER_DATABASE_URL }}
      V39_DATABASE_RUNTIME_URL: ${{ secrets.P4_G5_SOURCE_OWNER_DATABASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Prospective WSSS T−6h 3× unique source + bound operating PRE
        run: |
          set -Eeuo pipefail
          set +x
          test -z "${DATABASE_URL:-}${RAPIDAPI_KEY:-}${GATE05_AUTOMATION_DATABASE_URL:-}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          node --import tsx scripts/v39_phase4_gate5_g5a_real_wsss_horizon_owner.ts
  owner-t90:
    name: owner-t90
    if: ${{ (github.event_name == 'schedule' && contains(fromJSON('["17 20 4 11 *","47 20 4 11 *","17 21 4 11 *","47 21 4 11 *"]'), github.event.schedule)) || (github.event_name == 'workflow_dispatch' && inputs.horizon == 'T-90m') }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment: phase2g-paid
    env:
      P4_G5_G5A_HORIZON: T-90m
      P4_G5_G5A_CRON: ${{ github.event.schedule || 'manual-reviewed' }}
      P4_G5_G5A_MANUAL_HORIZON: ${{ inputs.horizon || '' }}
      P4_G5_G5A_PAID_INTENT: WSSS_NOV05_G5A_ONE_PROSPECTIVE_THREE_HORIZON_18_UNIT_MAX
      ADB_AUTO_COLLECT: "0"
      V39_PHASE6_PROCESS_ARMED: "0"
      AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
      P4_G5_SOURCE_OWNER_DATABASE_URL: ${{ secrets.P4_G5_SOURCE_OWNER_DATABASE_URL }}
      V39_DATABASE_RUNTIME_URL: ${{ secrets.P4_G5_SOURCE_OWNER_DATABASE_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Prospective WSSS T−90m 3× unique source + bound operating PRE
        run: |
          set -Eeuo pipefail
          set +x
          test -z "${DATABASE_URL:-}${RAPIDAPI_KEY:-}${GATE05_AUTOMATION_DATABASE_URL:-}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          node --import tsx scripts/v39_phase4_gate5_g5a_real_wsss_horizon_owner.ts
