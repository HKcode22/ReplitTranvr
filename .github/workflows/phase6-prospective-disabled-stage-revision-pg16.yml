name: Phase6 Prospective Disabled Stage Revision PG16 (No Provider)
on:
  pull_request:
    branches: [main, phase6/nov20-source-start-current-main]
    paths:
      - 'server/lib/disruption/phase6ProspectiveDisabledStageRevision_v39.ts'
      - 'server/lib/disruption/phase5V0093IndependentPostStageReadback_v39.mjs'
      - 'tests/phase6_prospective_disabled_stage_revision_pg16_v39.test.ts'
      - '.github/workflows/phase6-prospective-disabled-stage-revision-pg16.yml'
      - 'scripts/v39_phase6_enable_source_owner_v39.ts'
      - 'tests/phase6_poststage_evidence_only_main_advance_v39.test.ts'
  push:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase6ProspectiveDisabledStageRevision_v39.ts'
      - 'server/lib/disruption/phase5V0093IndependentPostStageReadback_v39.mjs'
      - 'tests/phase6_prospective_disabled_stage_revision_pg16_v39.test.ts'
      - '.github/workflows/phase6-prospective-disabled-stage-revision-pg16.yml'
permissions:
  contents: read
env:
  ADB_AUTO_COLLECT: '0'
  AERODATABOX_API_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
  V39_PHASE6_PROCESS_ARMED: '0'
  V39_PHASE6_OWNER_APPROVED: '0'
  V39_P6_PROSPECTIVE_RESTAGE_PG16: '1'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
  V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
jobs:
  prospective-disabled-stage-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Install disposable PG16 baseline and exact staged release schema
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = 'true'
          test "${V39_PHASE6_OWNER_APPROVED}" = '0'
          test "${V39_PHASE6_PROCESS_ARMED}" = '0'
          test -z "${AERODATABOX_API_KEY}"
          npx tsx scripts/apply_boot_migrations_v39.ts
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0080__phase5_bind_actual_github_run_id_before_fids_get_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0082__phase5_seven_rest_categories_exposed_partition_hold_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0083__phase5_nonfids_five_category_physical_rest_reservation_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0093__phase5_v0082_typed_cost_only_upper_bound_inert_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0103__phase5_bounded_primary_fids_expiry_inert_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0104__phase5_physical_rest_live_authority_retention_guard_v39.sql
      - name: Prove exact one-use prospective revision without deleting archived V0093 evidence
        run: |
          set -Eeuo pipefail
          test -z "${AERODATABOX_API_KEY}"
          npx vitest run tests/phase6_prospective_disabled_stage_revision_pg16_v39.test.ts
          npm run v39:typecheck
          echo 'P6_PROSPECTIVE_DISABLED_STAGE_REVISION_PG16=PASS PROVIDER_CALLS=0 PHASE6_GO=0'
