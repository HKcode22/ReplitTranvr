name: Phase2G Paid Stage1 Owner

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_PAID_STAGE1_ONCE'
        required: true
        type: string
      auth_id:
        description: 'Exact AUTH id'
        required: true
        type: string
      auth_file:
        description: 'Committed AUTH artifact path'
        required: true
        type: string
      auth_sha:
        description: 'AUTH SHA-256'
        required: true
        type: string
      runtime_file:
        description: 'Committed Gate2 runtime artifact path'
        required: true
        type: string
      runtime_sha:
        description: 'Runtime SHA-256'
        required: true
        type: string
      preprobe_file:
        description: 'Committed preprobe artifact path'
        required: true
        type: string
      preprobe_sha:
        description: 'Preprobe SHA-256'
        required: true
        type: string
      smoke_file:
        description: 'Committed safety-smoke artifact path'
        required: true
        type: string
      smoke_runtime_file:
        description: 'Committed smoke runtime artifact path'
        required: true
        type: string
      smoke_runtime_sha:
        description: 'Smoke runtime SHA-256'
        required: true
        type: string
      expected_head:
        description: 'Exact source commit authorized for this run'
        required: true
        type: string
      budget_day:
        description: 'Fresh probe budget day id'
        required: true
        type: string
      expected_icao:
        description: 'Frozen Stage1 ICAO'
        required: true
        default: 'WSSS'
        type: string
      callback_base:
        description: 'Callback origin; published by default, same-app replit.dev only under explicit contingency'
        required: true
        default: 'https://travnr.com'
        type: string
      callback_mode:
        description: 'Callback infrastructure mode'
        required: true
        default: 'published'
        type: choice
        options:
          - published
          - same-app-development-contingency
      callback_contingency_file:
        description: 'Committed contingency artifact path; required only for same-app development contingency'
        required: false
        default: ''
        type: string
      callback_contingency_sha:
        description: 'Contingency artifact SHA-256; required only for same-app development contingency'
        required: false
        default: ''
        type: string
      callback_verification_file:
        description: 'Committed callback verification path; used for published mode'
        required: false
        default: ''
        type: string
      callback_verification_b64:
        description: 'Fresh callback verification bytes as base64; required for same-app development contingency'
        required: false
        default: ''
        type: string
      callback_verification_sha:
        description: 'Callback verification artifact SHA-256'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase2g-paid-stage1-global
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ inputs.confirm == 'RUN_PAID_STAGE1_ONCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: phase2g-paid
    outputs:
      preflight_b64: ${{ steps.preflight.outputs.preflight_b64 }}
      preflight_sha: ${{ steps.preflight.outputs.preflight_sha }}
    env:
      V39_DATABASE_RUNTIME_URL: ${{ secrets.V39_DATABASE_RUNTIME_URL }}
      AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
      AERODATABOX_WEBHOOK_SECRET: ${{ secrets.AERODATABOX_WEBHOOK_SECRET }}
    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Refuse missing gate secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in V39_DATABASE_RUNTIME_URL AERODATABOX_API_KEY AERODATABOX_WEBHOOK_SECRET; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required Phase2G gate secret: $key"
              exit 2
            fi
          done

      - name: Verify GitHub/Replit runtime DB binding
        shell: bash
        run: |
          set -euo pipefail
          CHALLENGE="phase2g-${GITHUB_RUN_ID}-${{ inputs.expected_head }}"
          PROOF="$(CHALLENGE="$CHALLENGE" node --input-type=module <<'NODE'
          import { createHmac } from "node:crypto";
          const key = String(process.env.V39_DATABASE_RUNTIME_URL ?? "");
          const challenge = String(process.env.CHALLENGE ?? "");
          if (!key || !challenge) process.exit(2);
          process.stdout.write(createHmac("sha256", key).update(`phase2g-db-binding:${challenge}`).digest("hex"));
          NODE
          )"
          RESPONSE="$(curl --silent --show-error --fail-with-body --max-time 15             -X POST             -H "x-v39-phase2g-db-challenge: ${CHALLENGE}"             -H "x-v39-phase2g-db-proof: ${PROOF}"             "${{ inputs.callback_base }}/__v39/phase2g/runtime-db-binding")"
          node --input-type=module - "$RESPONSE" <<'NODE'
          const response = JSON.parse(process.argv[2]);
          if (
            response?.schema !== "v39.phase2g-runtime-db-binding.v1" ||
            response?.status !== "PASS" ||
            response?.provider_call !== false ||
            response?.provider_mutation !== false ||
            response?.database_mutation !== false ||
            Number(response?.alert_credits_spent) !== 0
          ) {
            console.error("GitHub/Replit runtime DB binding check failed");
            process.exit(2);
          }
          console.log("GITHUB_REPLIT_RUNTIME_DB_BINDING=PASS");
          NODE

      - name: Verify GitHub/Replit webhook-secret binding
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --fail-with-body --max-time 15 \
            -X POST \
            -H "x-v39-phase2g-webhook-secret: ${AERODATABOX_WEBHOOK_SECRET}" \
            "${{ inputs.callback_base }}/__v39/phase2g/webhook-secret-match")"
          node --input-type=module - "$RESPONSE" <<'NODE'
          const response = JSON.parse(process.argv[2]);
          if (
            response?.schema !== "v39.phase2g-webhook-secret-match.v1" ||
            response?.status !== "PASS" ||
            response?.provider_call !== false ||
            response?.provider_mutation !== false ||
            Number(response?.alert_credits_spent) !== 0
          ) {
            console.error("GitHub/Replit webhook-secret binding check failed");
            process.exit(2);
          }
          console.log("GITHUB_REPLIT_WEBHOOK_SECRET_BINDING=PASS");
          NODE

      - name: Generate fresh read-only paid preflight
        id: preflight
        shell: bash
        env:
          CALLBACK_VERIFICATION_B64: ${{ inputs.callback_verification_b64 }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_SHA,,}" == "${{ inputs.expected_head }}" ]] || {
            echo "::error::GITHUB_SHA does not match expected_head"
            exit 2
          }

          OUT="${RUNNER_TEMP}/phase2g-stage1-paid-preflight.json"
          CALLBACK_FILE="${{ inputs.callback_verification_file }}"

          if [[ "${{ inputs.callback_mode }}" == "same-app-development-contingency" ]]; then
            [[ -n "${CALLBACK_VERIFICATION_B64:-}" ]] || {
              echo "::error::callback_verification_b64 is required for same-app development contingency"
              exit 2
            }
            CALLBACK_FILE="${RUNNER_TEMP}/phase2g-live-callback-verification.json"
            printf '%s' "$CALLBACK_VERIFICATION_B64" | base64 -d > "$CALLBACK_FILE"
            [[ "$(sha256sum "$CALLBACK_FILE" | awk '{print $1}')" == "${{ inputs.callback_verification_sha }}" ]] || {
              echo "::error::Callback verification base64 SHA mismatch"
              exit 2
            }
          else
            [[ -n "$CALLBACK_FILE" && -f "$CALLBACK_FILE" ]] || {
              echo "::error::callback_verification_file is required for published mode"
              exit 2
            }
          fi

          npx tsx scripts/v39_phase2g_stage1_paid_preflight_v39.ts             --preprobe "${{ inputs.preprobe_file }}"             --smoke "${{ inputs.smoke_file }}"             --smoke-runtime-file "${{ inputs.smoke_runtime_file }}"             --smoke-runtime-sha "${{ inputs.smoke_runtime_sha }}"             --runtime-file "${{ inputs.runtime_file }}"             --runtime-sha "${{ inputs.runtime_sha }}"             --auth-file "${{ inputs.auth_file }}"             --auth-sha "${{ inputs.auth_sha }}"             --expected-head "${{ inputs.expected_head }}"             --expected-icao "${{ inputs.expected_icao }}"             --callback-base "${{ inputs.callback_base }}"             --callback-mode "${{ inputs.callback_mode }}"             --callback-contingency-file "${{ inputs.callback_contingency_file }}"             --callback-contingency-sha "${{ inputs.callback_contingency_sha }}"             --callback-verification "$CALLBACK_FILE"             --callback-verification-sha "${{ inputs.callback_verification_sha }}"             --owner-executor github-actions             --out "$OUT"

          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          B64="$(base64 -w0 "$OUT")"
          echo "preflight_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "preflight_b64=$B64" >> "$GITHUB_OUTPUT"

          node --input-type=module - "$OUT" <<'NODE'
          import fs from "node:fs";
          const p = process.argv[2];
          const j = JSON.parse(fs.readFileSync(p, "utf8"));
          if (j.status !== "PASS_READY_FOR_PAID_STAGE1") {
            console.error(JSON.stringify(j, null, 2));
            process.exit(2);
          }
          console.log(JSON.stringify({
            status: j.status,
            owner_executor: j.owner_executor,
            callback: j.callback,
            provider: j.provider,
            database: j.database,
            blockers: j.blockers,
          }, null, 2));
          NODE

  owner:
    needs: gate
    if: ${{ inputs.confirm == 'RUN_PAID_STAGE1_ONCE' && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 175
    environment: phase2g-paid
    env:
      V39_DATABASE_RUNTIME_URL: ${{ secrets.V39_DATABASE_RUNTIME_URL }}
      AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
      AERODATABOX_WEBHOOK_SECRET: ${{ secrets.AERODATABOX_WEBHOOK_SECRET }}
      V39_DEFER_PROVIDER_CONTENT_CLEANUP: '1'
    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reconstruct exact gate receipt
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/phase2g-stage1-paid-preflight.json"
          printf '%s' '${{ needs.gate.outputs.preflight_b64 }}' | base64 -d > "$OUT"
          [[ "$(sha256sum "$OUT" | awk '{print $1}')" == "${{ needs.gate.outputs.preflight_sha }}" ]] || {
            echo "::error::Preflight handoff SHA mismatch"
            exit 2
          }
          echo "PHASE2G_PREFLIGHT=$OUT" >> "$GITHUB_ENV"

      - name: Refuse missing owner secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in V39_DATABASE_RUNTIME_URL AERODATABOX_API_KEY AERODATABOX_WEBHOOK_SECRET; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required Phase2G owner secret: $key"
              exit 2
            fi
          done

      - name: Run exact paid Stage1 owner
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/v39_phase2g_github_actions_owner_v39.sh             --auth "${{ inputs.auth_id }}"             --auth-file "${{ inputs.auth_file }}"             --auth-sha "${{ inputs.auth_sha }}"             --runtime-file "${{ inputs.runtime_file }}"             --runtime-sha "${{ inputs.runtime_sha }}"             --preprobe "${{ inputs.preprobe_file }}"             --preprobe-sha "${{ inputs.preprobe_sha }}"             --smoke "${{ inputs.smoke_file }}"             --smoke-runtime-file "${{ inputs.smoke_runtime_file }}"             --smoke-runtime-sha "${{ inputs.smoke_runtime_sha }}"             --preflight "$PHASE2G_PREFLIGHT"             --preflight-sha "${{ needs.gate.outputs.preflight_sha }}"             --expected-head "${{ inputs.expected_head }}"             --probe-budget-day-id "${{ inputs.budget_day }}"             --expected-icao "${{ inputs.expected_icao }}"             --callback-base "${{ inputs.callback_base }}"             --callback-mode "${{ inputs.callback_mode }}"

  safety-watchdog:
    needs: gate
    if: ${{ inputs.confirm == 'RUN_PAID_STAGE1_ONCE' && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 175
    environment: phase2g-paid
    env:
      V39_DATABASE_RUNTIME_URL: ${{ secrets.V39_DATABASE_RUNTIME_URL }}
      AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
      AERODATABOX_WEBHOOK_SECRET: ${{ secrets.AERODATABOX_WEBHOOK_SECRET }}
      V39_DEFER_PROVIDER_CONTENT_CLEANUP: '1'
    steps:
      - name: Checkout exact authorized source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reconstruct exact gate receipt
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/phase2g-stage1-paid-preflight.json"
          printf '%s' '${{ needs.gate.outputs.preflight_b64 }}' | base64 -d > "$OUT"
          [[ "$(sha256sum "$OUT" | awk '{print $1}')" == "${{ needs.gate.outputs.preflight_sha }}" ]] || {
            echo "::error::Preflight handoff SHA mismatch"
            exit 2
          }
          echo "PHASE2G_PREFLIGHT=$OUT" >> "$GITHUB_ENV"

      - name: Independent paid-safety watchdog
        shell: bash
        env:
          WEBHOOK_BASE_URL: ${{ inputs.callback_base }}
          V39_PUBLIC_WEBHOOK_BASE_URL: ${{ inputs.callback_base }}
          V39_DEFER_PROVIDER_CONTENT_CLEANUP: '1'
        run: |
          set -euo pipefail
          npx tsx scripts/v39_phase2g_github_actions_watchdog_v39.ts             --auth "${{ inputs.auth_id }}"             --auth-file "${{ inputs.auth_file }}"             --auth-sha "${{ inputs.auth_sha }}"             --probe-budget-day-id "${{ inputs.budget_day }}"             --expected-head "${{ inputs.expected_head }}"             --preflight "$PHASE2G_PREFLIGHT"             --preflight-sha "${{ needs.gate.outputs.preflight_sha }}"             --callback-base "${{ inputs.callback_base }}"             --callback-mode "${{ inputs.callback_mode }}"
