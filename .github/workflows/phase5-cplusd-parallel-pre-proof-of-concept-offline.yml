name: Phase5 C+D bounded parallel PRE and watcher proof (OFFLINE ONLY)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase5-cplusd-parallel-pre-proof-of-concept-offline.yml'
      - 'server/lib/disruption/phase5CPlusDParallelPreProofOfConcept_v39.ts'
      - 'tests/phase5_cplusd_parallel_pre_proof_of_concept_v39.test.ts'
      - 'data-collection/phase5/2026-11-11_C_PLUS_D_OWNER_TEACHING_AND_IMPLEMENTATION_CHECKPOINT.md'
permissions:
  contents: read
jobs:
  synthetic-no-provider-no-database-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ADB_AUTO_COLLECT: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      DATABASE_URL: ''
      P5_V39_PRE_DATABASE_URL: ''
      P5_V39_OTHER_REST_REVIEW_DATABASE_URL: ''
      P5_V39_OTHER_REST_RESERVE_DATABASE_URL: ''
      V39_PHASE6_PROCESS_ARMED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Synthetic C+D parallel lanes and watchdog, NO LIVE SQL OR PROVIDER
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$ADB_AUTO_COLLECT" = 0
          test -z "$AERODATABOX_API_KEY"
          test -z "$AERODATABOX_WEBHOOK_SECRET"
          test -z "$DATABASE_URL"
          test -z "$P5_V39_PRE_DATABASE_URL"
          test "$V39_PHASE6_PROCESS_ARMED" = 0
          npx vitest run tests/phase5_cplusd_parallel_pre_proof_of_concept_v39.test.ts
          echo 'PHASE5_CPLUS_D_SIMULATION_ONLY_NO_SOURCE_OR_DB_NO_PHASE6_GO'
