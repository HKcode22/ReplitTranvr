name: Phase5 exact merged main candidate rebind (REVIEW ONLY, never merge)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase5-actual-nov22-budget-proposal-no-provider.yml'
permissions:
  contents: read
jobs:
  exact-main-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      V39_PHASE6_OWNER_APPROVED: '0'
      DATABASE_URL: ''
      V39_DATABASE_RUNTIME_URL: ''
      AERODATABOX_API_KEY: ''
      RAPIDAPI_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'de15816bccb867dc17dcd396f8bedec66960e115'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Exact merged source identity
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'de15816bccb867dc17dcd396f8bedec66960e115'
          test "$(git rev-parse 'HEAD^{tree}')" = 'f4ccdec1f1eceee527ed9bc0f423b223bc63a01c'
          test -z "$(git status --porcelain --untracked-files=no)"
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Run existing no-refill exporter against actual merged main
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          npx --no-install tsx scripts/v39_phase6_actual_release_candidate_export_v39.ts --review-only-no-refill 'de15816bccb867dc17dcd396f8bedec66960e115' > "$tmp/review.json"
          npx --no-install tsx scripts/v39_phase6_actual_release_candidate_export_v39.ts --review-only-no-refill 'de15816bccb867dc17dcd396f8bedec66960e115' > "$tmp/repeat.json"
          cmp "$tmp/review.json" "$tmp/repeat.json"
          REVIEW_JSON="$tmp/review.json" node <<'NODE'
          const fs=require('node:fs'),{createHash}=require('node:crypto'),assert=require('node:assert/strict');
          const sha=x=>createHash('sha256').update(x).digest('hex');
          const bytes=fs.readFileSync(process.env.REVIEW_JSON),j=JSON.parse(bytes),v=j.releaseIdentityReview;
          assert.equal(v.checkout.codeSha,'de15816bccb867dc17dcd396f8bedec66960e115');
          assert.equal(v.checkout.treeSha,'f4ccdec1f1eceee527ed9bc0f423b223bc63a01c');
          assert.equal(v.status,'EXACT_CONTENT_DIGESTS_AND_GEOMETRY_REVIEW_ONLY_NOT_RELEASE');
          assert.equal(v.actualAuthorizationId,null);
          assert.equal(v.finalPredecessorEvidenceIds,null);
          for(const k of ['candidateDigestsApproved','stagePacketExported','sourceRightsApproved','scientificFreezeApproved','phase6PaidGo'])assert.equal(v[k],false);
          assert.equal(v.geometry.dayPlanCount,31);
          assert.equal(v.geometry.totalQueries,6144);
          assert.equal(v.geometry.totalReservedUnits,41960);
          assert.equal(v.configCandidate.sha256,'92179d43e9b9729ba192f86c74e66dda4aae2da4229993509a1ef6a674060e56');
          assert.equal(v.calendarRowsDigestCandidate,'45a44fffeb774b5d0829487bd82f1a4a40f70085bc776f269cf04f0a8c70962c');
          for(const k of ['configCandidate','manifestCandidate','timingEvidenceCandidate','rangeEvidenceCandidate'])assert.equal(sha(JSON.stringify(v[k].content)),v[k].sha256);
          assert.equal(sha(JSON.stringify(v.sourceInventory)),v.manifestCandidate.content.sourceInventorySha256);
          assert.equal(v.sourceInventory.length,v.manifestCandidate.content.executableFileCount);
          const d=JSON.parse(fs.readFileSync('data-collection/evidence/ledgers/V3.9_PHASE6_SOURCE_ENABLE_APPROVALS.json','utf8'));
          assert.equal(d.approvals.length,0);
          const committedMatches=v.geometry.dayPlanSha256s.filter(x=>{
            const file='data-collection/phase5/planning/phase6-source-day-'+String(x.runDayIndex).padStart(2,'0')+'.json';
            return sha(fs.readFileSync(file))===x.sha256;
          }).length;
          console.log(JSON.stringify({status:'MERGED_MAIN_REVIEW_CANDIDATE_REBOUND_NOT_APPROVED',checkout:v.checkout,
            reviewBytesSha256:sha(bytes),sourceInventorySha256:v.manifestCandidate.content.sourceInventorySha256,
            executableFileCount:v.sourceInventory.length,manifestCandidateSha256:v.manifestCandidate.sha256,
            configCandidateSha256:v.configCandidate.sha256,timingCandidateSha256:v.timingEvidenceCandidate.sha256,
            rangeCandidateSha256:v.rangeEvidenceCandidate.sha256,calendarRowsSha256:v.calendarRowsDigestCandidate,
            geometry:{dayPlans:v.geometry.dayPlanCount,queries:v.geometry.totalQueries,units:v.geometry.totalReservedUnits,
            coverageGridSha256:v.geometry.coverageGridSha256,reviewOnlyPlanBytesEqualCommitted:committedMatches},
            netRestCeiling:j.concreteReviewRecommendation.netRestCeilingUnits,alertCeiling:j.concreteReviewRecommendation.proposedAlertSafety.alertRunSpendCeilingCredits,
            scopeLedgerEvidence:d.evidence.length,scopeLedgerApprovals:d.approvals.length,byteReproductionExact:true,
            providerCalls:0,databaseWrites:0,stagePacketExported:false,sourceRightsApproved:false,scientificFreezeApproved:false,phase6PaidGo:false}));
          NODE
