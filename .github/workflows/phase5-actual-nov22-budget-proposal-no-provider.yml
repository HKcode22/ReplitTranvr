name: Phase5 first actual seed and seven-category budget proposal (NO PROVIDER)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5ActualNov22BudgetProposal_v39.ts'
      - 'tests/phase5_actual_nov22_budget_proposal_v39.test.ts'
      - '.github/workflows/phase5-actual-nov22-budget-proposal-no-provider.yml'
      - 'data-collection/phase5/planning/2026-11-15_actual_first_seed_43700154416.json'
      - 'data-collection/phase5/planning/phase6-source-day-*.json'
      - 'data-collection/phase5/evidence/2026-11-15_owner_actual_free_quota_59968.json'
      - 'data-collection/phase5/evidence/2026-11-16_owner_actual_free_quota_59968.json'
      - 'data-collection/phase5/evidence/2026-11-16_prearm_clock_43832469501.json'
      - 'scripts/v39_phase5_prospective_seed_to_calendar_preview_v39.mjs'
      - 'scripts/v39_phase6_actual_release_candidate_export_v39.ts'
      - 'scripts/v39_phase6_revised_stage_executable_bridge_v39.ts'
      - 'review-tools/p6_nov20_finalize_recovered_policies_v39.ts'
      - 'tests/phase6_revised_stage_executable_bridge_v39.test.ts'
      - 'tests/phase6_revised_static_policy_values_v39.test.ts'
permissions:
  contents: read
jobs:
  exact-real-metadata-reproduction-and-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      V39_PHASE6_OWNER_APPROVED: '0'
      DATABASE_URL: ''
      V39_DATABASE_RUNTIME_URL: ''
      AERODATABOX_API_KEY: ''
      RAPIDAPI_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx --no-install vitest run tests/phase5_actual_nov22_budget_proposal_v39.test.ts tests/phase6_revised_stage_executable_bridge_v39.test.ts tests/phase6_revised_static_policy_values_v39.test.ts
      - name: Produce exact metadata-only review packet, not a runnable release
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/phase6-actual-review"
          npx --no-install tsx scripts/v39_phase6_actual_release_candidate_export_v39.ts --review-only "$GITHUB_SHA" > "$RUNNER_TEMP/phase6-actual-review/review-only.json"
          sha256sum "$RUNNER_TEMP/phase6-actual-review/review-only.json"
          npx --no-install tsx scripts/v39_phase6_actual_release_candidate_export_v39.ts --review-only-compact-nov21-no-refill "$GITHUB_SHA" > "$RUNNER_TEMP/phase6-actual-review/compact-review-only.json"
          sha256sum "$RUNNER_TEMP/phase6-actual-review/compact-review-only.json"
          node -e 'const r=require(process.argv[1]),g=r.releaseIdentityReview.geometry; if(g.totalQueries!==6144||g.totalReservedUnits!==37388||g.dayPlanCount!==31||r.phase6PaidGo!==false||r.releaseIdentityReview.stagePacketExported!==false||r.calendarRevisionReview.independentDateRevisionApproved!==false)process.exit(2); console.log(JSON.stringify({status:"COMPACT_NOV21_DATED_REVIEW_NO_GO",geometry:g,calendarRowsDigestCandidate:r.releaseIdentityReview.calendarRowsDigestCandidate,manifestCandidateSha256:r.releaseIdentityReview.manifestCandidate.sha256,configCandidateSha256:r.releaseIdentityReview.configCandidate.sha256,phase6PaidGo:false}))' "$RUNNER_TEMP/phase6-actual-review/compact-review-only.json"
          npx --no-install tsx scripts/v39_phase6_actual_release_candidate_export_v39.ts --review-only-compact-nov22-no-refill "$GITHUB_SHA" > "$RUNNER_TEMP/phase6-actual-review/compact-nov22-review-only.json"
          sha256sum "$RUNNER_TEMP/phase6-actual-review/compact-nov22-review-only.json"
          node -e 'const r=require(process.argv[1]),g=r.releaseIdentityReview.geometry,c=r.calendarRevisionReview; if(g.totalQueries!==6144||g.totalReservedUnits!==36740||g.dayPlanCount!==31||c.firstSourceUtc!=="2026-11-20T23:45:00.000Z"||c.firstServiceUtc!=="2026-11-22T00:00:00.000Z"||r.phase6PaidGo!==false||r.releaseIdentityReview.stagePacketExported!==false||c.independentDateRevisionApproved!==false)process.exit(2); console.log(JSON.stringify({status:"COMPACT_NOV22_DATED_REVIEW_NO_GO",geometry:g,calendarRowsDigestCandidate:r.releaseIdentityReview.calendarRowsDigestCandidate,manifestCandidateSha256:r.releaseIdentityReview.manifestCandidate.sha256,configCandidateSha256:r.releaseIdentityReview.configCandidate.sha256,phase6PaidGo:false}))' "$RUNNER_TEMP/phase6-actual-review/compact-nov22-review-only.json"
          npx --no-install tsx scripts/v39_phase6_actual_release_candidate_export_v39.ts --review-only-compact-monday-nov23-day-plans "$GITHUB_SHA" > "$RUNNER_TEMP/phase6-actual-review/compact-monday-review-only-day-plans.json"
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),old=require(process.argv[1]).releaseIdentityReview.geometry.dayPlanSha256s,m=require(process.argv[2]),sha=b=>crypto.createHash("sha256").update(b).digest("hex");if(m.status!=="UNSIGNED_METADATA_ONLY_NOT_STAGED_NO_GO"||m.phase6PaidGo!==false||m.calendarRowsSha256!=="55ea0dd4b50d43af11af65a1e2910928e98a731ffa5efdeda7eee98ac451077b"||old.length!==31||m.plans.length!==31)process.exit(2);let oldMatches=0,mondayMatches=0,queries=0;for(const [i,f] of m.plans.entries()){const p="data-collection/phase5/planning/phase6-source-day-"+String(i+1).padStart(2,"0")+".json";if(f.path!==p||old[i].runDayIndex!==i+1||sha(f.bytes)!==f.sha256)process.exit(2);const v=JSON.parse(f.bytes);if(v.runDayIndex!==i+1||!Array.isArray(v.templates))process.exit(2);queries+=v.templates.length;const h=sha(fs.readFileSync(p));oldMatches+=Number(h===old[i].sha256);mondayMatches+=Number(h===f.sha256)}if(queries!==6144||!((oldMatches===31&&mondayMatches===0)||(oldMatches===0&&mondayMatches===31)))throw Error("MIXED_OR_UNKNOWN_COMMITTED_PLAN_BYTES");console.log(JSON.stringify({status:"EXACT_COMMITTED_PLAN_CALENDAR_CLASSIFIED_NO_GO",oldMatches,mondayMatches,queries,phase6PaidGo:false}))' "$RUNNER_TEMP/phase6-actual-review/compact-nov22-review-only.json" "$RUNNER_TEMP/phase6-actual-review/compact-monday-review-only-day-plans.json"
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-actual-first-seed-review-only
          path: ${{ runner.temp }}/phase6-actual-review/*.json
          if-no-files-found: error
          retention-days: 30
