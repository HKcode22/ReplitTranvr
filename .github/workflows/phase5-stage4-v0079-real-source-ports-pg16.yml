name: Phase5 Stage4 Scoped Source Ports Real PG16 (NO Paid)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/fidsCensus_v3.ts'
      - 'server/lib/disruption/phase5V0079ScopedDbPorts_v39.ts'
      - 'tests/phase5_stage4_scoped_v0079_real_pg_v39.test.ts'
      - '.github/workflows/phase5-stage4-v0079-real-source-ports-pg16.yml'
  push:
    branches: [main]
    paths:
      - 'server/lib/disruption/fidsCensus_v3.ts'
      - 'server/lib/disruption/phase5V0079ScopedDbPorts_v39.ts'
      - 'tests/phase5_stage4_scoped_v0079_real_pg_v39.test.ts'
permissions:
  contents: read
env:
  AERODATABOX_API_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
  V39_P5_SOURCE_OWNER_APPROVED: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  ADB_AUTO_COLLECT: '0'
  V39_P5_STAGE4_REAL_PG: '1'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable'
  V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable'
jobs:
  actual-atomic-fids-with-fake-http:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v39_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v39_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Apply B0062 and staged V0079 to disposable CI PostgreSQL only
        run: |
          set -Eeuo pipefail
          test "${DATABASE_URL}" = "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
          npx tsx scripts/apply_boot_migrations_v39.ts
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql
      - name: Fake HTTP + real V0079 physical reservation + real atomic FIDS custody
        run: |
          set -Eeuo pipefail
          test "${DATABASE_URL}" = "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
          npx vitest run tests/phase5_stage4_scoped_v0079_real_pg_v39.test.ts
          echo 'FAKE_HTTP_ONLY=1 REAL_PG_DISPOSABLE=1 LIVE_PROVIDER_CALLS=0 LIVE_DB_WRITES=0'
