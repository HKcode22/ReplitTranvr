name: Phase5 Stage14 source-bound flight PRE no-backfill (disposable PG16 only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5V0079SingleBoundFlightPreWriter_v39.ts'
      - 'tests/phase5_stage14_bound_flight_pre_real_pg_v39.test.ts'
      - '.github/workflows/phase5-stage14-bound-flight-pre-no-backfill-pg16.yml'
  push:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5V0079SingleBoundFlightPreWriter_v39.ts'
      - 'tests/phase5_stage14_bound_flight_pre_real_pg_v39.test.ts'
      - '.github/workflows/phase5-stage14-bound-flight-pre-no-backfill-pg16.yml'
permissions:
  contents: read
jobs:
  authentic-one-source-one-flight-pre:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GITHUB_ACTIONS: 'true'
      V39_P5_STAGE14_REAL_PG16: '1'
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Bootstrap authentic B0062 + staged V0079 in disposable PG16
        run: |
          set -Eeuo pipefail
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
          npx tsx scripts/apply_boot_migrations_v39.ts
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql
      - name: Insert synthetic real-source-bound cutoff-safe PRE using least-privilege writer
        run: |
          set -Eeuo pipefail
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
          npx vitest run tests/phase5_stage14_bound_flight_pre_real_pg_v39.test.ts
          echo 'STAGE14_ONE_FLIGHT_REAL_PG16=PASS PROVIDER_CALLS=0 PRODUCTION_WRITES=0 RETENTION_RIGHTS=NOT_CERTIFIED PHASE6_GO=0'
