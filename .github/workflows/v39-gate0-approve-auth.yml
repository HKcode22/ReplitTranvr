name: V3.9 Gate0 Approve Readonly Auth

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add approved AUTH hash
        run: python3 scripts/v39_gate0_approve_auth.py
      - name: Commit approval
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/v39_gate0_approve_auth.py .github/workflows/v39-gate0-approve-auth.yml
          git add SEPmd/V3.9_RUN_REPORTS_AND_EVIDENCE.md
          git diff --cached --check
          git commit -m "V3.9 Gate0: approve formal read-only account inspection"
          git push origin HEAD:main
