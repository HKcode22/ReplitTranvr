name: Phase4 Gate5 G5A Dedicated Writer Disposable PG16
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-g5a-credential-disposable-pg16.yml"
      - "scripts/v39_phase4_gate5_g5a_source_owner_credential_once.ts"
      - "tests/phase4_gate5_g5a_source_owner_credential_once_v39.test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-g5a-credential-disposable-pg16.yml"
      - "scripts/v39_phase4_gate5_g5a_source_owner_credential_once.ts"
      - "tests/phase4_gate5_g5a_source_owner_credential_once_v39.test.ts"
permissions:
  contents: read
env:
  ADB_AUTO_COLLECT: "0"
  V39_PHASE6_PROCESS_ARMED: "0"
  AERODATABOX_API_KEY: ""
  RAPIDAPI_KEY: ""
  NODE_ENV: test
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
  V39_DATABASE_RUNTIME_URL: "postgresql://g5_ci_runtime:g5_disposable_only@localhost:5432/v39_ci?sslmode=disable"
jobs:
  isolated-g5a-role-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v39_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v39_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Exact role grants and no-admin unit regression
        run: npx vitest run tests/phase4_gate5_g5a_source_owner_credential_once_v39.test.ts
      - name: Apply only test PG16 baseline and private staged V0076/V0077
        run: |
          set -Eeuo pipefail
          test "${DATABASE_URL}" = "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
          node --import tsx scripts/apply_boot_migrations_v39.ts
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0076__phase4_gate5_logged_physical_fids_attempt_owner_v39.sql >/dev/null
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0077__phase4_gate5_original_fids_reservation_binding_v39.sql >/dev/null
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -c "CREATE ROLE g5_ci_runtime LOGIN PASSWORD 'g5_disposable_only'"
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA clean TO g5_ci_runtime"
      - name: Emulate credential publication with fake local GitHub CLI only
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g5_fakebin"
          cat > "$RUNNER_TEMP/g5_fakebin/gh" <<'FAKE_GH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          if [ "${1:-}" = "--version" ]; then exit 0; fi
          if [ "${1:-}" = "auth" ] && [ "${2:-}" = "status" ]; then exit 0; fi
          if [ "${1:-}" = "secret" ] && [ "${2:-}" = "set" ] &&
             [ "${3:-}" = "P4_G5_SOURCE_OWNER_DATABASE_URL" ]; then
            test "${4:-}" = "--repo"
            test "${5:-}" = "HKcode22/ReplitTranvr"
            test "${6:-}" = "--env"
            test "${7:-}" = "phase2g-paid"
            cat >/dev/null
            printf 'SECRET_PUBLISHED_TO_DISPOSABLE_MOCK\n' >>"${RUNNER_TEMP}/g5_fake_receipt"
            exit 0
          fi
          if [ "${1:-}" = "workflow" ] && [ "${2:-}" = "run" ]; then
            printf 'WORKFLOW_DISPATCHED_TO_DISPOSABLE_MOCK\n' >>"${RUNNER_TEMP}/g5_fake_receipt"
            exit 0
          fi
          exit 2
          FAKE_GH
          chmod 700 "$RUNNER_TEMP/g5_fakebin/gh"
          echo "G5_FAKEBIN=$RUNNER_TEMP/g5_fakebin" >>"$GITHUB_ENV"
      - name: Actually provision isolated role and pass URI only to mocked stdin
        run: |
          set -Eeuo pipefail
          set +x
          export PATH="$G5_FAKEBIN:$PATH"
          test "$(command -v gh)" = "$G5_FAKEBIN/gh"
          GITHUB_ACTIONS=false \
          P4_G5_SOURCE_OWNER_CREDENTIAL_ONCE=ONE_G5A_FUTURE_SOURCE_DB_ROLE_AND_GITHUB_ENV_SECRET_NO_PROVIDER \
          node --import tsx scripts/v39_phase4_gate5_g5a_source_owner_credential_once.ts
          grep -qx SECRET_PUBLISHED_TO_DISPOSABLE_MOCK "$RUNNER_TEMP/g5_fake_receipt" || grep -q '^SECRET_PUBLISHED_TO_DISPOSABLE_MOCK$' "$RUNNER_TEMP/g5_fake_receipt"
          grep -qx WORKFLOW_DISPATCHED_TO_DISPOSABLE_MOCK "$RUNNER_TEMP/g5_fake_receipt" || grep -q '^WORKFLOW_DISPATCHED_TO_DISPOSABLE_MOCK$' "$RUNNER_TEMP/g5_fake_receipt"
          psql "${DATABASE_URL}" -XAt -v ON_ERROR_STOP=1 -c "SELECT rolcreaterole::text||':'||rolsuper::text FROM pg_roles WHERE rolname='p4_g5_g5a_owner_20261103'" | grep -qx 'false:false'
          echo 'PROVIDER_CALLS=0'
          echo 'PRODUCTION_ROLES_CHANGED=0'
          echo 'REAL_GITHUB_SECRETS_CHANGED=0'
      - name: Confirm replay cannot rotate an existing one-shot role
        run: |
          set -Eeuo pipefail
          set +x
          export PATH="$G5_FAKEBIN:$PATH"
          if GITHUB_ACTIONS=false \
             P4_G5_SOURCE_OWNER_CREDENTIAL_ONCE=ONE_G5A_FUTURE_SOURCE_DB_ROLE_AND_GITHUB_ENV_SECRET_NO_PROVIDER \
             node --import tsx scripts/v39_phase4_gate5_g5a_source_owner_credential_once.ts 2>"$RUNNER_TEMP/g5_replay_error"; then
            echo 'UNSAFE_SECOND_PROVISION_SUCCEEDED'
            exit 2
          fi
          grep -q 'ROLE_ALREADY_EXISTS_DO_NOT_RECREATE_HOLD' "$RUNNER_TEMP/g5_replay_error"
          echo 'ROLE_REPLAY_REFUSED=TRUE'
