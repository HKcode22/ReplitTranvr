name: Phase5B conditional T24 existing witness path real PG16 (NO paid)
on:
  pull_request:
    paths:
      - 'migrations/staged/V0111__phase5b_prospective_conditional_t24_witness_v39.sql'
      - 'migrations/staged/V0113__phase5b_conditional_t24_metadata_reader_v39.sql'
      - 'server/lib/disruption/phase6LaterT24EvidenceBatchReadOnly_v39.ts'
      - 'server/lib/disruption/phase5V0079SingleBoundFlightPreWriter_v39.ts'
      - 'server/lib/disruption/phase5T24IndependentPostCommitWitness_v39.ts'
      - 'server/lib/disruption/phase5T24PreIndependentWitnessChain_v39.ts'
      - 'tests/phase5_stage14_bound_flight_pre_real_pg_v39.test.ts'
      - 'migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql'
      - 'migrations/staged/V0081__phase5_t24_separate_transaction_postcommit_witness_v39.sql'
      - '.github/workflows/phase5b-conditional-t24-witness-pg16.yml'
permissions:
  contents: read
jobs:
  actual-independent-t24-pre-commit-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GITHUB_ACTIONS: 'true'
      V39_P5_STAGE14_REAL_PG16: '1'
      V39_P5_STAGE17_REAL_PG16: '1'
      V39_P5B_CONDITIONAL_WITNESS_REAL_PG16: '1'
      V39_P5B_CONDITIONAL_METADATA_REAL_PG16: '1'
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      V39_PHASE6_PROCESS_ARMED: '0'
      ADB_AUTO_COLLECT: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Authentic B0062 + staged V0079 and V0081 on disposable PG16
        run: |
          set -Eeuo pipefail
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
          npx tsx scripts/apply_boot_migrations_v39.ts
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0081__phase5_t24_separate_transaction_postcommit_witness_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0094__phase6_private_frozen_packet_transport_inert_v39.sql
          # T074: production owner (not postgres superuser) owns the
          # existing witness function and the two schemas/base tables.
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE phase5b_ci_schema_owner LOGIN PASSWORD 'ci-only'
            NOINHERIT NOSUPERUSER NOCREATEDB CREATEROLE NOBYPASSRLS;
          ALTER SCHEMA clean OWNER TO phase5b_ci_schema_owner;
          ALTER SCHEMA phase6_private OWNER TO phase5b_ci_schema_owner;
          ALTER TABLE clean.flight_snapshots OWNER TO phase5b_ci_schema_owner;
          ALTER TABLE clean.phase5_t24_postcommit_witness_v39 OWNER TO phase5b_ci_schema_owner;
          ALTER FUNCTION clean.phase5_t24_witness_before_insert_v39() OWNER TO phase5b_ci_schema_owner;
          ALTER TABLE phase6_private.frozen_native_packet_v39 OWNER TO phase5b_ci_schema_owner;
          SQL
          OWNER_URL='postgresql://phase5b_ci_schema_owner:ci-only@localhost:5432/neondb?sslmode=disable'
          test "$(psql "$OWNER_URL" -XAt -v ON_ERROR_STOP=1 -c "SELECT NOT rolsuper AND rolcreaterole FROM pg_roles WHERE rolname=current_user")" = t
          M1=migrations/staged/V0111__phase5b_prospective_conditional_t24_witness_v39.sql
          M3=migrations/staged/V0113__phase5b_conditional_t24_metadata_reader_v39.sql
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          { printf 'BEGIN;\n'; cat "$M1"; sed -e '/^BEGIN;$/d' -e '/^COMMIT;$/d' "$M3"; printf '\nROLLBACK;\n'; } > "$TMP/rollback.sql"
          psql "$OWNER_URL" -X -v ON_ERROR_STOP=1 -f "$TMP/rollback.sql"
          test "$(psql "$OWNER_URL" -XAt -v ON_ERROR_STOP=1 -c "SELECT position('g5a_conditional_operator_composite_no_native_id' in pg_get_functiondef('clean.phase5_t24_witness_before_insert_v39()'::regprocedure))=0 AND to_regclass('phase6_private.conditional_t24_snapshot_meta_v39') IS NULL AND to_regclass('phase6_private.conditional_t24_witness_meta_v39') IS NULL")" = t
          { printf 'BEGIN;\n'; cat "$M1"; sed -e '/^BEGIN;$/d' -e '/^COMMIT;$/d' "$M3"; printf '\nCOMMIT;\n'; } > "$TMP/commit.sql"
          psql "$OWNER_URL" -X -v ON_ERROR_STOP=1 -f "$TMP/commit.sql"
          test "$(psql "$OWNER_URL" -XAt -v ON_ERROR_STOP=1 -c "SELECT position('g5a_conditional_operator_composite_no_native_id' in pg_get_functiondef('clean.phase5_t24_witness_before_insert_v39()'::regprocedure))>0 AND to_regclass('phase6_private.conditional_t24_snapshot_meta_v39') IS NOT NULL AND to_regclass('phase6_private.conditional_t24_witness_meta_v39') IS NOT NULL AND has_table_privilege('phase6_private_frozen_reader_v39','phase6_private.conditional_t24_witness_meta_v39','SELECT') AND NOT has_any_column_privilege('phase6_private_frozen_reader_v39','clean.flight_snapshots','SELECT,INSERT,UPDATE,REFERENCES')")" = t
          echo T074_V0111_V0113_REAL_NON_SUPERUSER_ATOMIC_ROLLBACK_COMMIT_ACL_PASS
          test "$(psql "$DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -c "SHOW track_commit_timestamp")" = off
      - name: True Stage14 PRE followed by restricted Stage17 witness, both DB COMMITs before own cutoff
        run: |
          set -Eeuo pipefail
          npx vitest run tests/phase5_stage14_bound_flight_pre_real_pg_v39.test.ts
          echo 'P5B_NATIVE_AND_CONDITIONAL_TWO_DB_COMMIT_WITNESS=PASS NATIVE_COMMIT_TRACKING=OFF PROVIDER_CALLS=0 PRODUCTION_DB_WRITES=0 T6_T90=HOLD PHASE6_GO=0'
