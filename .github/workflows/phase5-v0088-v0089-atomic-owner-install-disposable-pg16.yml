name: Phase5 V0088+V0089 ONE ATOMIC owner commission and original Stage14 (DISPOSABLE PG16)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase5-v0088-v0089-atomic-owner-install-disposable-pg16.yml'
      - 'migrations/staged/V0088__phase5_cd_real_v0087_queue_stage14_scoped_admission_v39.sql'
      - 'migrations/staged/V0089__phase5_cd_v0088_no_login_function_owner_commission_v39.sql'
      - 'scripts/v39_phase5_cd_v0088_v0089_atomic_owner_install_once.mjs'
      - 'tests/phase5_cd_v0088_v0089_atomic_installer_offline_v39.test.ts'
      - 'migrations/staged/V0087__phase5_cd_durable_per_flight_horizon_queue_v39.sql'
      - 'server/lib/disruption/phase5V0079SingleBoundFlightPreWriter_v39.ts'
      - 'tests/phase5_cd_v0088_existing_stage14_real_v0087_queue_pg16_v39.test.ts'
      - 'tests/phase5_amendment_e_stage14_bound_route_features_v39.test.ts'
      - 'server/lib/disruption/phase5AmendmentEStage14BoundRouteFeatures_v39.ts'
      - 'server/lib/disruption/phase5AmendmentEAsOfFeatureSelectionOffline_v39.ts'
permissions:
  contents: read
jobs:
  real-v0087-queue-existing-stage14:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GITHUB_ACTIONS: 'true'
      V39_P5_CD_V0088_STAGE14_CI: '1'
      V39_P5_CD_V0089_GUARD_CI: '1'
      P5_CD_GUARD_ATOMIC_INSTALL_DISPOSABLE_CI: '1'
      P5_CD_V0088_V0089_COMMISSION_APPROVAL: 'COMMISSION_V0088_V0089_INERT_SQL_WITH_NO_PAID_NO_WORKERS'
      P5_CD_V0088_SQL_FILE: 'migrations/staged/V0088__phase5_cd_real_v0087_queue_stage14_scoped_admission_v39.sql'
      P5_CD_V0088_SQL_SHA: '8353f61c98f9e8088b6815b5e8179ca95a0e774a'
      P5_CD_V0089_SQL_FILE: 'migrations/staged/V0089__phase5_cd_v0088_no_login_function_owner_commission_v39.sql'
      P5_CD_V0089_SQL_SHA: 'aad572f98f70dcca808bb287913a31a364aff835'
      V39_P5_E_NATIVE_ROUTE_STAGE14_CI: '1'
      V39_P5_CD_STAGE14_FENCE_DISPOSABLE: '0'
      V39_P5_CD_STAGE14_RECEIPT_DISPOSABLE: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      ADB_AUTO_COLLECT: '0'
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      P5_CD_CI_PASSWORD: 'ci-only'
      P5_CD_CI_WRITER_URL: 'postgresql://phase5_fids_pre_writer_cd_ciuser01:ci-only@localhost:5432/neondb?sslmode=disable'
      P5_V39_PRE_DATABASE_URL: ''
      P5_V39_OTHER_REST_RESERVE_DATABASE_URL: ''
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Restrict to disposable local PostgreSQL and no provider
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$V39_P5_CD_V0088_STAGE14_CI" = 1
          test "$V39_P5_CD_V0089_GUARD_CI" = 1
          test "$P5_CD_GUARD_ATOMIC_INSTALL_DISPOSABLE_CI" = 1
          test "$V39_P5_E_NATIVE_ROUTE_STAGE14_CI" = 1
          test "$V39_P5_CD_STAGE14_FENCE_DISPOSABLE" = 0
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
          test "$V39_PHASE6_PROCESS_ARMED" = 0
          test "$ADB_AUTO_COLLECT" = 0
          test -z "$AERODATABOX_API_KEY"
          test -z "$AERODATABOX_WEBHOOK_SECRET"
          test -z "$P5_V39_PRE_DATABASE_URL"
          test -z "$P5_V39_OTHER_REST_RESERVE_DATABASE_URL"
      - name: Apply ORIGINAL bootstrap, V0079, REAL V0087 and STAGED V0088
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --no-install tsx scripts/apply_boot_migrations_v39.ts
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0087__phase5_cd_durable_per_flight_horizon_queue_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "CREATE ROLE phase5_fids_pre_writer_prod_20261107 NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "CREATE ROLE travnr_runtime NOLOGIN"
          node --check scripts/v39_phase5_cd_v0088_v0089_atomic_owner_install_once.mjs
          npx --no-install vitest run tests/phase5_cd_v0088_v0089_atomic_installer_offline_v39.test.ts
          node scripts/v39_phase5_cd_v0088_v0089_atomic_owner_install_once.mjs
          test "$(psql "$DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -c "SELECT to_regclass('clean.phase5_cd_pre_admission_receipt_v39') IS NOT NULL")" = t
          test "$(psql "$DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -c "SELECT to_regclass('clean.phase5_cd_pre_admission_receipt_v39') IS NOT NULL")" = t
      - name: Reuse real Stage14 fixture after one-transaction atomic V0088+V0089 commission
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --no-install vitest run tests/phase5_cd_v0088_existing_stage14_real_v0087_queue_pg16_v39.test.ts tests/phase5_amendment_e_stage14_bound_route_features_v39.test.ts
          echo P5_V0088_V0089_ATOMIC_OWNER_STAGE14_SOURCE_BOUND_NO_LIVE_NO_PAID_PASS
