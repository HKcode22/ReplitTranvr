name: P6 Day1 corrected policy read-only release validation (NO PROVIDER)
on:
  push:
    branches:
      - phase6/20261122-g8-502-readback-evidence
    paths:
      - 'data-collection/phase6/checkpoints/p6_day1_release_owner_request.json'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: p6-day1-oneuse-owner-code-only-seal
  cancel-in-progress: false
jobs:
  one-owner-sealed-day1-code-successor:
    if: >-
      github.repository == 'HKcode22/ReplitTranvr' &&
      github.actor == 'HKcode22' &&
      github.ref == 'refs/heads/phase6/20261122-g8-502-readback-evidence' &&
      github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      V39_PHASE6_OWNER_APPROVED: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      RAPIDAPI_KEY: ''
      DATABASE_URL: ''
      V39_DATABASE_RUNTIME_URL: ''
      P6_G8_OWNER_SEAL_TRIGGER: 'OWNER_REVIEWED_ENCRYPTED_G12_CODE_REPIN_SUCCESSOR_NO_PAID_GO'
      GH_TOKEN: ${{ github.token }}
      V39_P5_APPROVED_CODE_SHA: ${{ secrets.V39_P5_APPROVED_CODE_SHA }}
      P6_NONPAID_SOURCE_APPROVED_MAIN_SHA: ${{ secrets.P6_NONPAID_SOURCE_APPROVED_MAIN_SHA }}
      V39_P5_ACTUAL_NATIVE_REVIEW_APPROVED_CODE_SHA: ${{ secrets.V39_P5_ACTUAL_NATIVE_REVIEW_APPROVED_CODE_SHA }}
      P5_CD_GH_PRE_APPROVED_CODE_SHA: ${{ secrets.P5_CD_GH_PRE_APPROVED_CODE_SHA }}
      V39_P5_POST_APPROVED_CODE_SHA: ${{ secrets.V39_P5_POST_APPROVED_CODE_SHA }}
      P6_PRIVATE_SOURCE_PARENT_RO_MAIN_SHA: ${{ secrets.P6_PRIVATE_SOURCE_PARENT_RO_MAIN_SHA }}
      V39_P5_QUEUE_APPROVED_CODE_SHA: ${{ secrets.V39_P5_QUEUE_APPROVED_CODE_SHA }}
      V39_P5_MANIFEST_SHA256: ${{ secrets.V39_P5_MANIFEST_SHA256 }}
      V39_P5_CALENDAR_HASH: ${{ secrets.V39_P5_CALENDAR_HASH }}
      V39_P5_CONFIG_HASH: ${{ secrets.V39_P5_CONFIG_HASH }}
      V39_P5_FRAME_HASH: ${{ secrets.V39_P5_FRAME_HASH }}
      V39_P5_RELEASE_SHA256: ${{ secrets.V39_P5_RELEASE_SHA256 }}
      V39_P5_RIGHTS_SHA256: ${{ secrets.V39_P5_RIGHTS_SHA256 }}
      V39_P5_PROVIDER_CONTRACT_SHA256: ${{ secrets.V39_P5_PROVIDER_CONTRACT_SHA256 }}
      P6_INERT_STAGE_INPUT_JSON: ${{ secrets.P6_INERT_STAGE_INPUT_JSON }}
      P6_INERT_STAGE_INPUT_SHA256: ${{ secrets.P6_INERT_STAGE_INPUT_SHA256 }}
      P6_INERT_COST_ENVELOPE_SHA256: ${{ secrets.P6_INERT_COST_ENVELOPE_SHA256 }}
      P6_PRIVATE_POST_OUTCOME_TAIL_HOURS: ${{ secrets.P6_PRIVATE_POST_OUTCOME_TAIL_HOURS }}
      V39_P5_POST_PROVIDER_CONTRACT_SHA256: ${{ secrets.V39_P5_POST_PROVIDER_CONTRACT_SHA256 }}
      V39_P5_POST_CATEGORY_BUDGET_SHA256: ${{ secrets.V39_P5_POST_CATEGORY_BUDGET_SHA256 }}
      V39_P5_POST_PRICE_SHA256: ${{ secrets.V39_P5_POST_PRICE_SHA256 }}
      P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64: ${{ secrets.P6_PRIVATE_SOURCE_STABLE_TRUST_BASE64 }}
      P6_NONPAID_DAILY_POLICY_BASE64: ${{ secrets.P6_NONPAID_DAILY_POLICY_BASE64 }}
      P6_NONPAID_SIGNING_POLICY_BASE64: ${{ secrets.P6_NONPAID_SIGNING_POLICY_BASE64 }}
      P6_NONPAID_TRANSPORT_TRUST_BASE64: ${{ secrets.P6_NONPAID_TRANSPORT_TRUST_BASE64 }}
      P6_PRIVATE_POST_REVIEWER_TRUST_BASE64: ${{ secrets.P6_PRIVATE_POST_REVIEWER_TRUST_BASE64 }}
      P6_NATIVE_POST_POLICY_BASE64: ${{ secrets.P6_NATIVE_POST_POLICY_BASE64 }}
      P6_NONPAID_DAILY_POLICY_SHA256: ${{ secrets.P6_NONPAID_DAILY_POLICY_SHA256 }}
      P6_NONPAID_SIGNING_POLICY_SHA256: ${{ secrets.P6_NONPAID_SIGNING_POLICY_SHA256 }}
      P6_NONPAID_TRANSPORT_TRUST_SHA256: ${{ secrets.P6_NONPAID_TRANSPORT_TRUST_SHA256 }}
      P6_NATIVE_POST_POLICY_SHA256: ${{ secrets.P6_NATIVE_POST_POLICY_SHA256 }}
      P6_PHASE7_POST_PRESERVATION_POLICY_BASE64: ${{ secrets.P6_PHASE7_POST_PRESERVATION_POLICY_BASE64 }}
      P6_PHASE7_POST_PRESERVATION_POLICY_SHA256: ${{ secrets.P6_PHASE7_POST_PRESERVATION_POLICY_SHA256 }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact branch source, current main and pinned historic pure validator
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object data-collection/phase6/checkpoints/p6_day1_release_seal_successor.cjs)" = 66280cca6fdf041cdf9db72b96cb6a7e11f0a8c8
          TARGET="$(jq -er '.mainSha' data-collection/phase6/checkpoints/p6_day1_release_owner_request.json)"
          BASE=c8e065d665ccacb6d2575070e94c5500b7583044
          HEAD_PIN=9c9cddb1aaeb04934d94af2937ee158e6d991f6c
          MAIN="$(gh api repos/HKcode22/ReplitTranvr/git/ref/heads/main --jq .object.sha)"
          MODE="$(jq -er '.mode' data-collection/phase6/checkpoints/p6_day1_release_owner_request.json)"
          if test "$MODE" = preflight; then
            test "$MAIN" = "$BASE"
            test "$TARGET" = "$HEAD_PIN"
            gh api "repos/HKcode22/ReplitTranvr/pulls/965" | jq -e --arg b "$BASE" --arg h "$HEAD_PIN" '.state=="open" and .base.sha==$b and .head.sha==$h and .mergeable==true' >/dev/null
            printf '%s\n' 'P6_G8_OWNER_SEAL_TRIGGER=OWNER_READONLY_POLICY_SUCCESSOR_PREFLIGHT_NO_GO' 'P6_DAY1_SUCCESSOR_PREFLIGHT=1' >> "$GITHUB_ENV"
          else
            test "$MODE" = seal
            test "$TARGET" = "$MAIN"
            gh api "repos/HKcode22/ReplitTranvr/pulls/965" | jq -e --arg sha "$TARGET" --arg head "$HEAD_PIN" '.merged==true and .head.sha==$head and .merge_commit_sha==$sha' >/dev/null
            EXPECTED_TREE="$(gh api "repos/HKcode22/ReplitTranvr/git/commits/$HEAD_PIN" --jq .tree.sha)"
            gh api "repos/HKcode22/ReplitTranvr/git/commits/$TARGET" | jq -e --arg t "$EXPECTED_TREE" --arg b "$BASE" --arg h "$HEAD_PIN" '.tree.sha==$t and ([.parents[].sha]==[$b,$h])' >/dev/null
          fi
          printf 'P6_DAY1_SUCCESSOR_TARGET_SHA=%s\n' "$TARGET" >> "$GITHUB_ENV"
          gh api repos/HKcode22/ReplitTranvr/git/blobs/34156ac65811165c0d217e7175f8643eeef55761 --jq .content | base64 --decode > "$RUNNER_TEMP/p6-g8-original-final-validator.cjs"
          test "$(git hash-object "$RUNNER_TEMP/p6-g8-original-final-validator.cjs")" = 34156ac65811165c0d217e7175f8643eeef55761
          node --check data-collection/phase6/checkpoints/p6_day1_release_seal_successor.cjs
          node --check "$RUNNER_TEMP/p6-g8-original-final-validator.cjs"
      - name: Validate corrected installed and candidate policies without exporting values
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export P6_G8_PINNED_VALIDATOR_PATH="$RUNNER_TEMP/p6-g8-original-final-validator.cjs"
          node data-collection/phase6/checkpoints/p6_day1_release_seal_successor.cjs
