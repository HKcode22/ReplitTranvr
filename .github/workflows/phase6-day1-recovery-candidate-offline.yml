name: Phase6 Day1 prospective recovery candidate (offline only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase6Day1ProspectiveRecoveryCandidate_v39.mjs'
      - 'tests/phase6_day1_prospective_recovery_candidate_v39.test.mjs'
      - '.github/workflows/phase6-day1-recovery-candidate-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/phase6_day1_prospective_recovery_candidate_v39.test.mjs
