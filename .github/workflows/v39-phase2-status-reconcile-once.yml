name: V3.9 Phase2 Status Reconcile Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event.head_commit.message == 'Run one-shot Phase2 status reconciliation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply status reconciliation
        run: python3 scripts/phase2_status_reconcile_once.py
      - name: Validate docs
        run: |
          git diff --check
          grep -q 'PHASE2-AUDIT-20260911-001' SEPmd/V3.9_RUN_REPORTS_AND_EVIDENCE.md
          grep -q 'PHASE2-AUDIT-CORRECTION-20260911' SEPmd/V3.9_RUN_REPORTS_AND_EVIDENCE2.md
          grep -q 'CURRENT PHASE-2 RE-AUDIT STATUS' SEPmd/V3.9_IMPLEMENTATION_LOG.md
      - name: Commit docs and remove one-shot scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/phase2_status_reconcile_once.py .github/workflows/v39-phase2-status-reconcile-once.yml
          git add SEPmd/V3.9_RUN_REPORTS_AND_EVIDENCE.md SEPmd/V3.9_RUN_REPORTS_AND_EVIDENCE2.md SEPmd/V3.9_IMPLEMENTATION_LOG.md
          git commit -m 'V3.9 Phase2: record superseding readiness audit'
          git push origin HEAD:main
