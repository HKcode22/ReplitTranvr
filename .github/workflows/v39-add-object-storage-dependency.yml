name: V3.9 One-Shot Object Storage Dependency

on:
  push:
    branches:
      - v39-p-phase2-closure-audit-20260911
    paths:
      - '.github/workflows/v39-add-object-storage-dependency.yml'

permissions:
  contents: write

env:
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  AERODATABOX_API_KEY: ''

jobs:
  lock-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safety branch
        uses: actions/checkout@v4
        with:
          ref: v39-p-phase2-closure-audit-20260911

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install existing lock
        run: npm ci

      - name: Add exact official Replit Object Storage SDK
        run: npm install --save-exact @replit/object-storage@1.0.0

      - name: Verify lock is installable
        run: npm ci

      - name: Commit package metadata only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'V3.9 P: lock Replit object storage SDK'
          git push origin HEAD:v39-p-phase2-closure-audit-20260911
