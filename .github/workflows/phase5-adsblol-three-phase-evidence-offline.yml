name: Phase5 ADSB.lol Inbound PRE + POST Proxy Bracket, No Provider
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5AdsbLolCrossPhaseRotationEvidence_v39.ts'
      - 'tests/phase5_adsblol_pre_inbound_post_takeoff_bracket_v39.test.ts'
      - '.github/workflows/phase5-adsblol-three-phase-evidence-offline.yml'
  push:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5AdsbLolCrossPhaseRotationEvidence_v39.ts'
      - 'tests/phase5_adsblol_pre_inbound_post_takeoff_bracket_v39.test.ts'
permissions:
  contents: read
env:
  ADB_AUTO_COLLECT: '0'
  AERODATABOX_API_KEY: ''
  RAPIDAPI_KEY: ''
  DATABASE_URL: ''
  V39_PHASE6_PROCESS_ARMED: '0'
  V39_PHASE6_OWNER_APPROVED: '0'
jobs:
  incoming-aircraft-asof-and-uncertain-takeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Three sources with real identity/time guards; zero paid provider
        run: |
          set -Eeuo pipefail
          test -z "${AERODATABOX_API_KEY}${RAPIDAPI_KEY}${DATABASE_URL}"
          test "${V39_PHASE6_PROCESS_ARMED}" = 0
          npx vitest run tests/phase5_adsblol_pre_inbound_post_takeoff_bracket_v39.test.ts
          npm run v39:typecheck
          echo 'ADSB_LOL_PRE_TAIL_AND_POST_PROXY_OFFLINE=PASS THREE_SOURCE_NO_SUBSTITUTION=PASS NO_PAID_NO_DB'
