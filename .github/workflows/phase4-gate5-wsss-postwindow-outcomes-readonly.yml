name: Phase4 Gate5 WSSS After-Flight Capture Outcome Audit - READ ONLY
on:
  schedule:
    - cron: "15 19 31 10 *"
    - cron: "15 22 31 10 *"
permissions:
  contents: read
concurrency:
  group: phase4-wsss-after-window-audit-readonly
  cancel-in-progress: false
jobs:
  post-window-source-outcomes:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: phase2g-paid
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies without provider secrets
        run: npm ci --include=dev --no-audit --no-fund
      - name: Fixed-date WSSS service outcome and retained-source audit - NO PROVIDER
        env:
          GATE05_AUTOMATION_DATABASE_URL: ${{ secrets.GATE05_AUTOMATION_DATABASE_URL }}
          P4_GATE5_SOURCE_AIRPORT: WSSS
          P4_GATE5_READONLY_APPROVAL: GATE5_SOURCE_METADATA_NO_PROVIDER
          P4_GATE5_POSTWINDOW_CRON: ${{ github.event.schedule }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$GITHUB_REPOSITORY" = HKcode22/ReplitTranvr
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = schedule
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "${GATE05_AUTOMATION_DATABASE_URL:-}"
          test -z "${AERODATABOX_API_KEY:-}"
          node --import tsx scripts/v39_gate5_source_inventory_readonly_actions.ts
      - name: Evidence only - never promote unknown labels to Gate 5 PASS
        if: always()
        run: |
          {
            echo 'Read-only repeated WSSS same-cohort source/PRE/callback/outcome audit after 17:00-18:00Z service on October 31.'
            echo 'First audit 19:15Z, second 22:15Z; scheduling delays may cause hold; no manual catch-up or provider GET.'
            echo 'Zero or missing observed wheels-off is not actual-departure proof or zero capture rate.'
            echo 'Only confirmed operating/selected-T and actual wheels-off could later certify final Gate5 science.'
            echo 'No provider calls, no SQL writes, no subscription, no Phase5 freeze, no Phase6 start.'
          } >> "$GITHUB_STEP_SUMMARY"
