name: Phase5 primary FIDS expiry (STOP default, no provider)
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'APPLY_REVIEWED_FULL_RETENTION_BACKSTOP_NO_PROVIDER' && 'P5 FULL RETENTION BACKSTOP CHILD' || github.event_name == 'workflow_dispatch' && inputs.confirm == 'APPLY_REVIEWED_PRIMARY_FIDS_BACKSTOP_NO_PRIVATE_MUTATION' && 'P5 PRIMARY BACKSTOP CHILD' || 'Phase5 primary FIDS expiry (STOP default, no provider)' }}
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      confirm:
        required: true
        type: choice
        options:
          - VERIFY_PRIMARY_FIDS_ONLY_NO_WRITES
          - VERIFY_P7_RESEARCH_EXPIRY_ONLY_NO_WRITES
          - APPLY_REVIEWED_PRIMARY_FIDS_EXPIRY_ONLY_NO_PROVIDER
          - APPLY_REVIEWED_PRIMARY_FIDS_BACKSTOP_NO_PRIVATE_MUTATION
          - APPLY_REVIEWED_FULL_RETENTION_BACKSTOP_NO_PROVIDER
      approved_main_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: p5-primary-fids-expiry-main
  cancel-in-progress: false
env:
  DATABASE_URL: ''
  V39_DATABASE_RUNTIME_URL: ''
  AERODATABOX_API_KEY: ''
  RAPIDAPI_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  V39_PHASE6_OWNER_APPROVED: '0'
jobs:
  primary-fids-expiry:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          vars.P5_PRIMARY_FIDS_EXPIRY_APPROVED_MAIN_SHA == github.sha &&
          ((github.event_name == 'schedule' &&
             vars.P5_PRIMARY_FIDS_EXPIRY_ENABLED == 'true' &&
             vars.P5_PRIMARY_FIDS_EXPIRY_APPROVAL == 'APPLY_REVIEWED_PRIMARY_FIDS_EXPIRY_ONLY_NO_PROVIDER') ||
           (github.event_name == 'workflow_dispatch' &&
             inputs.approved_main_sha == github.sha &&
             (inputs.confirm == 'VERIFY_PRIMARY_FIDS_ONLY_NO_WRITES' ||
              (inputs.confirm == 'APPLY_REVIEWED_PRIMARY_FIDS_EXPIRY_ONLY_NO_PROVIDER' &&
               vars.P5_PRIMARY_FIDS_EXPIRY_ENABLED == 'true' &&
               vars.P5_PRIMARY_FIDS_EXPIRY_APPROVAL == inputs.confirm) ||
              (inputs.confirm == 'APPLY_REVIEWED_PRIMARY_FIDS_BACKSTOP_NO_PRIVATE_MUTATION' &&
               vars.P5_PRIMARY_FIDS_BACKSTOP_ENABLED == 'true' &&
               vars.P5_PRIMARY_FIDS_EXPIRY_ENABLED == 'true' &&
               vars.P5_PRIMARY_FIDS_EXPIRY_APPROVAL == 'APPLY_REVIEWED_PRIMARY_FIDS_EXPIRY_ONLY_NO_PROVIDER' &&
               (vars.P6_PRIVATE_EPOCH_EXPIRY_MODE == 'COMMISSION_VERIFY_ONLY' ||
                (vars.P6_PRIVATE_EPOCH_EXPIRY_MODE == 'APPLY_DUE_ONLY' &&
                 vars.P6_PRIVATE_EPOCH_EXPIRY_MANIFEST_SHA256 != '' &&
                 vars.P6_PRIVATE_EPOCH_EXPIRY_APPROVAL == 'APPLY_REVIEWED_PRIVATE_EPOCH_EXPIRY_ONLY_NO_PROVIDER'))) ||
              (inputs.confirm == 'APPLY_REVIEWED_FULL_RETENTION_BACKSTOP_NO_PROVIDER' &&
               vars.P5_PRIMARY_FIDS_BACKSTOP_ENABLED == 'true' &&
               vars.P5_PRIMARY_FIDS_EXPIRY_ENABLED == 'true' &&
               vars.P5_PRIMARY_FIDS_EXPIRY_APPROVAL == 'APPLY_REVIEWED_PRIMARY_FIDS_EXPIRY_ONLY_NO_PROVIDER' &&
               vars.P6_FULL_RETENTION_BACKSTOP_ENABLED == 'true' &&
               vars.P6_PRIVATE_EPOCH_EXPIRY_MODE == 'APPLY_DUE_ONLY' &&
               vars.P6_PRIVATE_EPOCH_EXPIRY_MANIFEST_SHA256 != '' &&
               vars.P6_PRIVATE_EPOCH_EXPIRY_APPROVAL == 'APPLY_REVIEWED_PRIVATE_EPOCH_EXPIRY_ONLY_NO_PROVIDER' &&
               vars.P7_EXPIRY_APPROVED_MAIN_SHA == github.sha &&
               vars.P7_EXPIRY_ENABLED == 'true' &&
               vars.P7_EXPIRY_APPROVAL == 'APPLY_P7_DUE_ONLY_NO_PROVIDER')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      P5_PRIMARY_FIDS_EXPIRY_APPROVED_MAIN_SHA: ${{ vars.P5_PRIMARY_FIDS_EXPIRY_APPROVED_MAIN_SHA }}
      P5_PRIMARY_FIDS_EXPIRY_ENABLED: ${{ vars.P5_PRIMARY_FIDS_EXPIRY_ENABLED }}
      P5_PRIMARY_FIDS_EXPIRY_APPROVAL: ${{ vars.P5_PRIMARY_FIDS_EXPIRY_APPROVAL }}
      P5_PRIMARY_FIDS_EXPECTED_ENDPOINT_SHA256: ${{ vars.P5_PRIMARY_FIDS_EXPECTED_ENDPOINT_SHA256 }}
      P5_PRIMARY_FIDS_DEADLINE_PROFILE: ${{ vars.P5_PRIMARY_FIDS_DEADLINE_PROFILE }}
      P5_PRIMARY_FIDS_EXPIRY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'VERIFY_PRIMARY_FIDS_ONLY_NO_WRITES' && 'VERIFY_ONLY' || 'APPLY_DUE_ONLY' }}
      P5_PRIMARY_FIDS_BACKSTOP_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'APPLY_REVIEWED_PRIMARY_FIDS_BACKSTOP_NO_PRIVATE_MUTATION' && '1' || '0' }}
      P5_PRIMARY_FIDS_BACKSTOP_ENABLED: ${{ vars.P5_PRIMARY_FIDS_BACKSTOP_ENABLED }}
      P6_FULL_RETENTION_BACKSTOP_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'APPLY_REVIEWED_FULL_RETENTION_BACKSTOP_NO_PROVIDER' && '1' || '0' }}
      P6_FULL_RETENTION_BACKSTOP_ENABLED: ${{ vars.P6_FULL_RETENTION_BACKSTOP_ENABLED }}
      # A separately approved PRIMARY-ONLY backstop must never inherit private APPLY authority.
      # Native schedule/manual ordinary APPLY retains the configured V0105 extension unchanged.
      # Manual VERIFY still stays read-only in the runner.
      P6_PRIVATE_EPOCH_DEADLINE_PROFILE: ${{ vars.P6_PRIVATE_EPOCH_DEADLINE_PROFILE }}
      P6_PRIVATE_EPOCH_EXPIRY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'APPLY_REVIEWED_PRIMARY_FIDS_BACKSTOP_NO_PRIVATE_MUTATION' && 'COMMISSION_VERIFY_ONLY' || vars.P6_PRIVATE_EPOCH_EXPIRY_MODE }}
      P6_PRIVATE_EPOCH_EXPIRY_MANIFEST_SHA256: ${{ (github.event_name != 'workflow_dispatch' || inputs.confirm != 'APPLY_REVIEWED_PRIMARY_FIDS_BACKSTOP_NO_PRIVATE_MUTATION') && vars.P6_PRIVATE_EPOCH_EXPIRY_MANIFEST_SHA256 || '' }}
      P6_PRIVATE_EPOCH_EXPIRY_APPROVAL: ${{ (github.event_name != 'workflow_dispatch' || inputs.confirm != 'APPLY_REVIEWED_PRIMARY_FIDS_BACKSTOP_NO_PRIVATE_MUTATION') && vars.P6_PRIVATE_EPOCH_EXPIRY_APPROVAL || '' }}
      P5_PRIMARY_FIDS_SWEEP_DATABASE_URL: ${{ secrets.P5_PRIMARY_FIDS_SWEEP_DATABASE_URL }}
      P5_RETENTION_READER_DATABASE_URL: ${{ secrets.P5_RETENTION_READER_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Verify exact main and execute only bounded primary FIDS expiry
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$P5_PRIMARY_FIDS_EXPIRY_APPROVED_MAIN_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -z "$DATABASE_URL$V39_DATABASE_RUNTIME_URL$AERODATABOX_API_KEY$RAPIDAPI_KEY$AERODATABOX_WEBHOOK_SECRET"
          node --check scripts/v39_phase5_primary_fids_expiry_github_v39.mjs
          node scripts/v39_phase5_primary_fids_expiry_github_v39.mjs

  phase7-expiry:
    # Independent scope, same existing cadence. This does not inherit
    # primary or private epoch permission; manual verify has no writer URL.
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          vars.P7_EXPIRY_APPROVED_MAIN_SHA == github.sha &&
          ((github.event_name == 'schedule' &&
            vars.P7_EXPIRY_ENABLED == 'true' &&
            vars.P7_EXPIRY_APPROVAL == 'APPLY_P7_DUE_ONLY_NO_PROVIDER') ||
           (github.event_name == 'workflow_dispatch' &&
            inputs.approved_main_sha == github.sha &&
            (inputs.confirm == 'VERIFY_P7_RESEARCH_EXPIRY_ONLY_NO_WRITES' ||
             (vars.P5_PRIMARY_FIDS_EXPIRY_APPROVED_MAIN_SHA == github.sha && (inputs.confirm == 'APPLY_REVIEWED_FULL_RETENTION_BACKSTOP_NO_PROVIDER' &&
               vars.P5_PRIMARY_FIDS_BACKSTOP_ENABLED == 'true' &&
               vars.P5_PRIMARY_FIDS_EXPIRY_ENABLED == 'true' &&
               vars.P5_PRIMARY_FIDS_EXPIRY_APPROVAL == 'APPLY_REVIEWED_PRIMARY_FIDS_EXPIRY_ONLY_NO_PROVIDER' &&
               vars.P6_FULL_RETENTION_BACKSTOP_ENABLED == 'true' &&
               vars.P6_PRIVATE_EPOCH_EXPIRY_MODE == 'APPLY_DUE_ONLY' &&
               vars.P6_PRIVATE_EPOCH_EXPIRY_MANIFEST_SHA256 != '' &&
               vars.P6_PRIVATE_EPOCH_EXPIRY_APPROVAL == 'APPLY_REVIEWED_PRIVATE_EPOCH_EXPIRY_ONLY_NO_PROVIDER' &&
               vars.P7_EXPIRY_APPROVED_MAIN_SHA == github.sha &&
               vars.P7_EXPIRY_ENABLED == 'true' &&
               vars.P7_EXPIRY_APPROVAL == 'APPLY_P7_DUE_ONLY_NO_PROVIDER'))))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      P7_EXPIRY_APPROVED_MAIN_SHA: ${{ vars.P7_EXPIRY_APPROVED_MAIN_SHA }}
      P7_EXPIRY_ENABLED: ${{ vars.P7_EXPIRY_ENABLED }}
      P7_EXPIRY_APPROVAL: ${{ vars.P7_EXPIRY_APPROVAL }}
      P7_EXPIRY_MODE: ${{ (github.event_name == 'schedule' || inputs.confirm == 'APPLY_REVIEWED_FULL_RETENTION_BACKSTOP_NO_PROVIDER') && 'APPLY_DUE_ONLY' || 'VERIFY_ONLY' }}
      P6_FULL_RETENTION_BACKSTOP_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'APPLY_REVIEWED_FULL_RETENTION_BACKSTOP_NO_PROVIDER' && '1' || '0' }}
      P6_FULL_RETENTION_BACKSTOP_ENABLED: ${{ vars.P6_FULL_RETENTION_BACKSTOP_ENABLED }}
      P7_EXPIRY_READER_DATABASE_URL: ${{ secrets.P7_EXPIRY_READER_DATABASE_URL }}
      P7_EXPIRY_WRITER_DATABASE_URL: ${{ (github.event_name == 'schedule' || inputs.confirm == 'APPLY_REVIEWED_FULL_RETENTION_BACKSTOP_NO_PROVIDER') && secrets.P7_EXPIRY_WRITER_DATABASE_URL || '' }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Bounded derived research and temporary link due-only expiry
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -z "$DATABASE_URL$V39_DATABASE_RUNTIME_URL$AERODATABOX_API_KEY$RAPIDAPI_KEY$AERODATABOX_WEBHOOK_SECRET"
          npx --no-install tsx scripts/v39_phase7_expiry_github_v39.ts
