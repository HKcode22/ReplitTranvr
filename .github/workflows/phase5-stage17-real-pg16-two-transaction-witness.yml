name: Phase5 Stage17 separate-transaction T24 post-COMMIT witness (real PG16 tracking OFF)
on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/staged/V0081__phase5_t24_separate_transaction_postcommit_witness_v39.sql'
      - 'server/lib/disruption/phase5T24IndependentPostCommitWitness_v39.ts'
      - 'tests/phase5_stage14_bound_flight_pre_real_pg_v39.test.ts'
      - '.github/workflows/phase5-stage17-real-pg16-two-transaction-witness.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/staged/V0081__phase5_t24_separate_transaction_postcommit_witness_v39.sql'
      - 'server/lib/disruption/phase5T24IndependentPostCommitWitness_v39.ts'
      - 'tests/phase5_stage14_bound_flight_pre_real_pg_v39.test.ts'
      - '.github/workflows/phase5-stage17-real-pg16-two-transaction-witness.yml'
permissions:
  contents: read
jobs:
  actual-independent-t24-pre-commit-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GITHUB_ACTIONS: 'true'
      V39_P5_STAGE14_REAL_PG16: '1'
      V39_P5_STAGE17_REAL_PG16: '1'
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      V39_PHASE6_PROCESS_ARMED: '0'
      ADB_AUTO_COLLECT: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Authentic B0062 + staged V0079 and V0081 on disposable PG16
        run: |
          set -Eeuo pipefail
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
          npx tsx scripts/apply_boot_migrations_v39.ts
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0081__phase5_t24_separate_transaction_postcommit_witness_v39.sql
          test "$(psql "$DATABASE_URL" -XAt -v ON_ERROR_STOP=1 -c "SHOW track_commit_timestamp")" = off
      - name: True Stage14 PRE followed by restricted Stage17 witness, both DB COMMITs before own cutoff
        run: |
          set -Eeuo pipefail
          npx vitest run tests/phase5_stage14_bound_flight_pre_real_pg_v39.test.ts
          echo 'P5_STAGE17_TWO_DB_COMMIT_WITNESS=PASS NATIVE_COMMIT_TRACKING=OFF PROVIDER_CALLS=0 PRODUCTION_DB_WRITES=0 T6_T90=HOLD PHASE6_GO=0'
