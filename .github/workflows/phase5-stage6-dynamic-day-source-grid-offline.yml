name: Phase5 Stage6 Dynamic Day FIDS Grid (NO Provider)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5DynamicDaySourceGrid_v39.ts'
      - 'tests/phase5_dynamic_day_source_grid_v39.test.ts'
      - '.github/workflows/phase5-stage6-dynamic-day-source-grid-offline.yml'
  push:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5DynamicDaySourceGrid_v39.ts'
      - 'tests/phase5_dynamic_day_source_grid_v39.test.ts'
      - '.github/workflows/phase5-stage6-dynamic-day-source-grid-offline.yml'
permissions:
  contents: read
jobs:
  candidate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DATABASE_URL: ''
      V39_DATABASE_RUNTIME_URL: ''
      V39_P5_SOURCE_DATABASE_URL: ''
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Dynamic day template from in-memory committed draw fixtures only
        run: |
          set -Eeuo pipefail
          npx vitest run tests/phase5_dynamic_day_source_grid_v39.test.ts
          echo 'DYNAMIC_DAY_CANDIDATES_ONLY PROVIDER_CALLS=0 DB_WRITES=0 PHASE6_GO=NO'
