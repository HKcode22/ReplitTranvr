name: V3.9 Offline Safety

on:
  push:
    branches:
      - main
      - v39-phase0-final-repair
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ADB_AUTO_COLLECT: "0"
  V39_PHASE6_PROCESS_ARMED: "0"
  AERODATABOX_API_KEY: ""
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
  DATABASE_RUNTIME_URL: "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
  V39_DATABASE_RUNTIME_URL: "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
  NODE_ENV: test

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v39_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v39_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply production boot migrations — fresh B0062 bootstrap
        run: npx tsx scripts/apply_boot_migrations_v39.ts

      - name: Verify durable B0062 history
        shell: bash
        run: |
          set -euo pipefail
          row="$(
            psql "$DATABASE_URL" -X -A -t -F '|' -v ON_ERROR_STOP=1 -c "
              SELECT
                version || '|' ||
                kind || '|' ||
                file || '|' ||
                installation_mode
              FROM v39_meta.schema_migration_history
              WHERE kind='BASELINE' AND version=62;
            "
          )"
          echo "$row"
          test "$row" = "62|BASELINE|B0062__v39_schema_baseline_20261001.sql|APPLIED"

      - name: Apply production boot migrations — restart no-op
        run: npx tsx scripts/apply_boot_migrations_v39.ts

      - name: Verify durable runner has zero pending migrations
        shell: bash
        run: |
          set -euo pipefail
          out="$(npx tsx scripts/v39_schema_migrate_v39.ts --dry-run)"
          echo "$out"
          node --input-type=module - "$out" <<'NODE'
          const j = JSON.parse(process.argv[2]);
          if (j.dryRun !== true) process.exit(1);
          if (!Array.isArray(j.applied) || j.applied.length !== 0) process.exit(1);
          if (!Array.isArray(j.pending) || j.pending.length !== 0) process.exit(1);
          NODE

      - name: Reconcile Drizzle application schema
        run: npx drizzle-kit push --force

      - name: Verify production boot remains no-op after Drizzle reconciliation
        run: npx tsx scripts/apply_boot_migrations_v39.ts

      - name: Verify current schema and triggers
        run: npm run v39:migrate:check

      - name: TypeScript
        run: npm run v39:typecheck

      - name: Offline V3.9 tests
        run: npm run v39:test:offline

      - name: Full test suite
        run: npm run v39:test:full

      - name: Lint
        run: npm run v39:lint

      - name: Registry
        run: npm run v39:registry:check

      - name: Traceability
        run: npm run v39:traceability:check

      - name: Contradiction scanner
        run: npm run v39:scanner

      - name: Aggregate Phase0 preflight
        run: npm run v39:preflight

      - name: Production build
        run: npm run v39:build
