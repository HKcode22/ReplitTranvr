name: V3.9 Offline Safety

on:
  push:
    branches:
      - main
      - v39-phase0-final-repair
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ADB_AUTO_COLLECT: "0"
  V39_PHASE6_PROCESS_ARMED: "0"
  AERODATABOX_API_KEY: ""
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
  DATABASE_RUNTIME_URL: "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
  V39_DATABASE_RUNTIME_URL: "postgresql://postgres:postgres@localhost:5432/v39_ci?sslmode=disable"
  NODE_ENV: test

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v39_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v39_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Provision repository base schema
        run: npx drizzle-kit push --force

      - name: Apply production boot migrations — fresh V3.9 layer
        run: npx tsx scripts/apply_boot_migrations_v39.ts

      - name: Apply production boot migrations — idempotence replay
        run: npx tsx scripts/apply_boot_migrations_v39.ts

      - name: Verify current schema and triggers
        run: npm run v39:migrate:check

      - name: TypeScript
        run: npm run v39:typecheck

      - name: Offline V3.9 tests
        run: npm run v39:test:offline

      - name: Full test suite
        run: npm run v39:test:full

      - name: Lint
        run: npm run v39:lint

      - name: Registry
        run: npm run v39:registry:check

      - name: Traceability
        run: npm run v39:traceability:check

      - name: Contradiction scanner
        run: npm run v39:scanner

      - name: Aggregate Phase0 preflight
        run: npm run v39:preflight

      - name: Production build
        run: npm run v39:build

  # ONE-SHOT Phase-2 public-data evaluation. Remove this job after its artifact
  # is captured. It has no provider secrets and makes no AeroDataBox/Replit calls.
  opdi-reference-one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install public-data dependencies
        run: python -m pip install --disable-pip-version-check 'duckdb>=1.1,<2' 'requests>=2.32,<3'

      - name: Build OPDI Aug-2025 through Jul-2026 candidate
        run: |
          mkdir -p /tmp/v39-opdi-output
          python scripts/v39_build_opdi_reference_v39.py \
            --output /tmp/v39-opdi-output/traffic-reference-opdi-candidate.json \
            --diagnostics /tmp/v39-opdi-output/traffic-reference-opdi-diagnostics.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked repository dependencies
        run: npm ci

      - name: Validate Phase-2 candidate
        run: npx tsx scripts/v39_validate_opdi_reference_v39.ts /tmp/v39-opdi-output/traffic-reference-opdi-candidate.json

      - name: Upload compact reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v39-opdi-traffic-reference-${{ github.sha }}
          path: |
            /tmp/v39-opdi-output/traffic-reference-opdi-candidate.json
            /tmp/v39-opdi-output/traffic-reference-opdi-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
