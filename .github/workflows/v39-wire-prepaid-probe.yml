name: V3.9 One-Shot Prepaid Probe Wiring

on:
  push:
    branches:
      - v39-p-phase2-closure-audit-20260911
    paths:
      - '.github/workflows/v39-wire-prepaid-probe.yml'

permissions:
  contents: write

env:
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  AERODATABOX_API_KEY: ''

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v39-p-phase2-closure-audit-20260911

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact fail-closed wiring edits
        run: python scripts/v39_wire_prepaid_probe_patch.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck patched tree
        run: npm run v39:typecheck

      - name: Run offline tests
        run: npm run v39:test:offline

      - name: Commit wired production files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/routes_v3.ts scripts/anchor_probe.ts server/lib/disruption/prepaidProbeWindow_v39.ts
          git diff --cached --quiet && exit 0
          git commit -m 'V3.9 P: wire PITR-safe prepaid probe path'
          git push origin HEAD:v39-p-phase2-closure-audit-20260911
