permissions:
  contents: read
jobs:
  fixed-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/v39_phase5b_paid_child_audit_owner.mjs && node --check scripts/v39_phase5b_signed_calendar_coverage_owner.mjs && node --check scripts/v39_phase5b_conditional_query_scope_owner.mjs
      - run: node --test tests/phase5b_source_diagnostics_v39.test.mjs tests/phase5b_recovery_register_v39.test.mjs tests/phase5b_retention_p7_inventory_v39.test.mjs tests/phase5b_cutover_quiet_v39.test.mjs tests/phase5b_conditional_query_scope_owner_v39.test.mjs tests/phase5b_maintenance_and_f017_owner_v39.test.mjs tests/phase5b_owner_local_policy_predecessor_v39.test.mjs
      - run: bash -n scripts/v39_phase5b_scientific_pause_owner.sh && node --test tests/phase5b_scientific_pause_owner_v39.test.mjs
      - run: node --test tests/phase5b_callback_worker_scope_v39.test.mjs
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run check
      - name: Full offline suite on exact clean recovery commit
        run: npm test
      - name: Conditional later PRE frozen-reference retiming regression
        run: npx vitest run tests/phase5b_conditional_frozen_t_retime_v39.test.ts
      - run: npx vitest run tests/phase3_gate05_free_feed_429_pacing_contract_v39.test.ts tests/phase5b_fids_response_diagnostics_v39.test.ts tests/phase5_no_provider_prearm_clock_v39.test.ts tests/phase5_conditional_fids_service_recovery_v39.test.ts tests/phase5_conditional_bound_source_review_v39.test.ts tests/phase5_signed_later_pre_day_registry_v39.test.ts tests/phase5_amendment_e_real_fids_original_feature_compiler_v39.test.ts tests/phase5_conditional_signed_schedule_pair_v39.test.ts tests/phase5_amendment_e_gateout_label_v39.test.ts tests/phase5_scoped_fids_source_bridge_v39.test.ts tests/phase4_gate5_g5a_native_fids_identity_v39.test.ts tests/phase5b_conditional_source_signer_scope_v39.test.ts tests/phase5_prospective_fids_identity_custody_v39.test.ts tests/phase6_stored_source_native_candidate_audit_v39.test.ts tests/phase7_local_private_pre_handoff_v39.test.ts tests/phase6_native_post_pre_candidates_v39.test.ts
      - run: npx --no-install tsx --test tests/phase6_stored_source_postcommit_native_audit_v39.test.mjs tests/phase5b_conditional_policy_candidate_v39.test.mjs tests/phase6_stored_source_child_dispatcher_v39.test.mjs tests/phase6_nonpaid_source_day_github_runtime_v39.test.mjs
      - name: Retrieve the exact historical T126 fixture if shallow checkout omitted it
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! git cat-file -e 1bbec6f1d0dacbc0432b5c7c36955b43163855fa^{blob} 2>/dev/null; then
            git fetch --no-tags --depth=1 origin c4408c621a84a2549355d935cca7333c5527d3c2
          fi
          git cat-file -e 1bbec6f1d0dacbc0432b5c7c36955b43163855fa^{blob}
          test "$(git cat-file blob 1bbec6f1d0dacbc0432b5c7c36955b43163855fa | git hash-object --stdin)" = 1bbec6f1d0dacbc0432b5c7c36955b43163855fa
      - run: node --test tests/phase5b_progress_report_v39.test.mjs tests/phase5b_paid_audit_cli_transport_v39.test.mjs tests/phase5b_owner_wait_once_980_v39.test.mjs
      - run: bash -n scripts/v39_phase5b_full_retention_baseline_owner.sh && bash -n scripts/v39_phase5b_full_recovery_owner.sh && bash -n scripts/v39_phase5b_post_cutover_pin_readonly.sh && bash -n scripts/v39_phase5b_coordinated_recovery_cutover_owner.sh && bash -n scripts/v39_phase5b_source_only_successor_owner.sh

  conditional-query-owner-real-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      P6_SCOPE_DISPOSABLE_PG16: '1'
      DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/neondb?sslmode=disable'
      V39_DATABASE_RUNTIME_URL: ''
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      AERODATABOX_API_KEY: ''
      RAPIDAPI_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx --no-install tsx --test tests/phase5b_conditional_query_scope_real_pg16_v39.mjs
