name: Phase5 Stage30 nonpaid three PG16 worker logins and MOCKED GitHub secrets
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v39_phase5_stage30_three_nonpaid_github_worker_login_secrets_owner_once.mjs'
      - 'tests/phase5_stage30_nonpaid_pg16_github_secrets_mock_v39.test.ts'
      - '.github/workflows/phase5-stage30-nonpaid-worker-secrets-disposable-pg16.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/v39_phase5_stage30_three_nonpaid_github_worker_login_secrets_owner_once.mjs'
      - 'tests/phase5_stage30_nonpaid_pg16_github_secrets_mock_v39.test.ts'
      - '.github/workflows/phase5-stage30-nonpaid-worker-secrets-disposable-pg16.yml'
permissions:
  contents: read
jobs:
  stage30-atomic-nonpaid-worker-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GITHUB_ACTIONS: 'true'
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/runtime-not-used?sslmode=disable'
      P5_STAGE26_FOUR_NOLOGIN_ROLES_ONCE: 'INSTALL_FOUR_NOLOGIN_P5_ROLES_WITH_NO_RUNTIME_MEMBERS'
      P5_STAGE30_DISPOSABLE_GH_SECRET_PG16_TEST: '1'
      V39_PHASE6_PROCESS_ARMED: '0'
      ADB_AUTO_COLLECT: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: TypeScript checks
        run: npm run check
      - name: Apply B0062, exact V79/80/81, Stage27 four groups in disposable PG16
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test -z "$AERODATABOX_API_KEY"
          npx tsx scripts/apply_boot_migrations_v39.ts
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql >/tmp/st30-v79.log
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0080__phase5_bind_actual_github_run_id_before_fids_get_v39.sql >/tmp/st30-v80.log
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0081__phase5_t24_separate_transaction_postcommit_witness_v39.sql >/tmp/st30-v81.log
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "REVOKE EXECUTE ON FUNCTION clean.phase5_t24_witness_before_insert_v39(), clean.phase5_t24_witness_immutable_v39() FROM PUBLIC" >/dev/null
          node scripts/v39_phase5_stage26_four_nologin_roles_owner_once.mjs >/tmp/st30-four-groups.json
      - name: Add PG16 non-superuser CREATEROLE with ADMIN-only group delegation in disposable DB
        run: |
          set -Eeuo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE phase5_stage30_ci_owner LOGIN NOINHERIT CREATEROLE
            NOSUPERUSER NOCREATEDB PASSWORD 'ci-only';
          GRANT phase5_fids_prepare_prod_20261107 TO phase5_stage30_ci_owner
            WITH ADMIN TRUE, SET FALSE, INHERIT FALSE;
          GRANT phase5_fids_pre_writer_prod_20261107 TO phase5_stage30_ci_owner
            WITH ADMIN TRUE, SET FALSE, INHERIT FALSE;
          GRANT phase5_fids_t24_witness_prod_20261107 TO phase5_stage30_ci_owner
            WITH ADMIN TRUE, SET FALSE, INHERIT FALSE;
          SQL
      - name: Real PG16 atomic create/rollback + in-memory fake GitHub API, no real secrets
        run: |
          set -Eeuo pipefail
          npx vitest run tests/phase5_stage30_nonpaid_pg16_github_secrets_mock_v39.test.ts
          echo 'STAGE30_NONPAID_LOGIN_MOCKED_GH_SECRET=DISPOSABLE_PASS PROD_ROLE_WRITES=0 REPO_SECRET_WRITES=0 PROVIDER_CALLS=0 PHASE5_FREEZE=HOLD'
