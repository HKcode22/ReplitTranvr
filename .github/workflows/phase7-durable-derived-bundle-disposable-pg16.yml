name: Phase7 durable derived bundle (disposable PG16 NO GO)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase7DurableDerivedBundleCandidate_v39.ts'
      - 'tests/phase7_durable_derived_bundle_candidate_v39.test.ts'
      - 'server/lib/disruption/phase7CanonicalFieldParity_v39.ts'
      - 'tests/phase7_canonical_field_parity_v39.test.ts'
      - 'server/lib/disruption/phase7BoundPrePreservation_v39.ts'
      - 'tests/phase7_reviewed_source_transformation_v39.test.ts'
      - 'server/lib/disruption/phase7FinalGroupAssembly_v39.ts'
      - 'tests/phase7_final_group_assembly_v39.test.ts'
      - 'data-collection/phase5/review-tools/p7_derived_release_storage_candidate_NOT_FOR_INSTALL.sql'
      - 'server/lib/disruption/phase7*Proof_v39.ts'
      - 'server/lib/disruption/phase7ProtectedPreResolver_v39.ts'
      - 'server/lib/disruption/phase7SignedPostReview_v39.ts'
      - 'server/lib/disruption/phase7SignedPostConsumer_v39.ts'
      - 'server/lib/disruption/phase7LocalPrivatePostHandoff_v39.ts'
      - 'scripts/v39_phase7_local_post_role_runner_rehearsal_v39.ts'
      - 'tests/phase7_signed_pre_field_proof_v39.test.ts'
      - 'tests/phase7_post_preservation_bridge_v39.test.ts'
      - 'tests/phase7_post_scoped_group_v39.test.ts'
      - 'data-collection/phase5/review-tools/p7_research_expiry_candidate_NOT_FOR_INSTALL.sql'
      - '.github/workflows/phase7-durable-derived-bundle-disposable-pg16.yml'
permissions:
  contents: read
jobs:
  disposable-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: neondb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      P7_DURABLE_DISPOSABLE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/neondb?sslmode=disable'
      DATABASE_URL: ''
      V39_DATABASE_RUNTIME_URL: ''
      AERODATABOX_API_KEY: ''
      RAPIDAPI_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      V39_PHASE6_OWNER_APPROVED: '0'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Synthetic paired and continuous bundle, real restricted disposable PG16
        run: |
          set -Eeuo pipefail
          set +x
          test -z "$DATABASE_URL$V39_DATABASE_RUNTIME_URL$AERODATABOX_API_KEY$RAPIDAPI_KEY$AERODATABOX_WEBHOOK_SECRET"
          test "$V39_PHASE6_PROCESS_ARMED" = 0
          npx --no-install vitest run tests/phase7_durable_derived_bundle_candidate_v39.test.ts tests/phase7_canonical_field_parity_v39.test.ts tests/phase7_reviewed_source_transformation_v39.test.ts tests/phase7_final_group_assembly_v39.test.ts tests/phase7_signed_pre_field_proof_v39.test.ts tests/phase7_post_preservation_bridge_v39.test.ts tests/phase7_post_scoped_group_v39.test.ts
          echo PHASE7_DURABLE_BUNDLE_DISPOSABLE_PG16_NO_GO
      - name: Synthetic POST reviewer role in separate runner step
        env:
          P7_POST_CI_ROLE_MARKER: reviewer
        run: node --import tsx scripts/v39_phase7_local_post_role_runner_rehearsal_v39.ts start reviewer
      - name: Synthetic POST publisher role in separate runner step
        env:
          P7_POST_CI_ROLE_MARKER: publisher
        run: node --import tsx scripts/v39_phase7_local_post_role_runner_rehearsal_v39.ts start publisher
      - name: Rehearse normal and recovery POST IPC, exact scope and fail-closed replay
        run: node --import tsx scripts/v39_phase7_local_post_role_runner_rehearsal_v39.ts run
      - name: Always stop both synthetic POST roles and remove scratch
        if: always()
        run: |
          set -Eeuo pipefail
          test ! -d "$RUNNER_TEMP/p7-post-ci-$GITHUB_RUN_ID" || node --import tsx scripts/v39_phase7_local_post_role_runner_rehearsal_v39.ts stop
