name: Reveal Environment Secrets
on: workflow_dispatch # Allows you to run it manually

jobs:
  reveal:
    runs-on: ubuntu-latest
    environment: phase2g-paid # 👈 Replace with your actual environment name
    
    steps:
      - name: Output AERODATABOX_API_KEY with spaces
        run: |
          echo "${{ secrets.AERODATABOX_API_KEY }}" | sed 's/./& /g'

      - name: Output AERODATABOX_WEBHOOK_SECRET with spaces
        run: |
          echo "${{ secrets.AERODATABOX_WEBHOOK_SECRET }}" | sed 's/./& /g'
