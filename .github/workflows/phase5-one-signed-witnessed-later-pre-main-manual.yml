name: Phase5 witnessed T6 or T90 PRE (SIGNED, manual main, NO provider)
on:
  workflow_dispatch:
    inputs:
      frozen_later_pre_packet:
        description: 'Previously reviewed one-flight data-collection/phase5/frozen/*.json'
        required: true
        type: string
      confirm:
        description: 'Type ONE_SIGNED_WITNESSED_T6_OR_T90_PRE_NO_PROVIDER'
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase5-one-signed-witnessed-later-pre-main-manual.yml'
      - 'scripts/v39_phase5_one_signed_witnessed_later_pre_github_owner_v39.ts'
      - 'tests/phase5_one_signed_witnessed_later_pre_github_owner_v39.test.ts'
      - 'server/lib/disruption/phase5T24WitnessedLaterHorizonGuard_v39.ts'
      - 'server/lib/disruption/phase5StandaloneLaterPreWithoutT24Decision_v39.ts'
      - 'tests/phase5_standalone_later_pre_without_t24_choice_v39.test.ts'
      - 'server/lib/disruption/phase5V0079SingleBoundFlightPreWriter_v39.ts'
      - 'scripts/v39_phase5_one_signed_native_t24_pre_witness_github_owner_v39.ts'
      - 'data-collection/phase5/2026-11-09_GITHUB_WITNESSED_T6_T90_PRE_OWNER_CHECKPOINT.md'
permissions:
  contents: read
concurrency:
  group: phase5-witnessed-later-pre-${{ inputs.frozen_later_pre_packet || github.ref }}
  cancel-in-progress: false
jobs:
  offline-admission-only:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADB_AUTO_COLLECT: '0'
      AERODATABOX_API_KEY: ''
      DATABASE_URL: ''
      P5_V39_PRE_DATABASE_URL: ''
      V39_PHASE6_PROCESS_ARMED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Review T24 anchored future T6/T90 admission without DB or provider
        run: |
          set -Eeuo pipefail
          npx vitest run tests/phase5_one_signed_witnessed_later_pre_github_owner_v39.test.ts tests/phase5_stage24_t24_witnessed_later_horizon_v39.test.ts tests/phase5_one_signed_native_t24_pre_witness_github_owner_v39.test.ts tests/phase5_standalone_later_pre_without_t24_choice_v39.test.ts
          echo 'SIGNED_LATER_PRE_CI_ONLY_NO_DB_NO_PROVIDER'
  one-reviewed-later-flight-pre:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm == 'ONE_SIGNED_WITNESSED_T6_OR_T90_PRE_NO_PROVIDER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      ADB_AUTO_COLLECT: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
      DATABASE_URL: ''
      V39_DATABASE_RUNTIME_URL: ''
      V39_P5_SOURCE_DATABASE_URL: ''
      P5_V39_T24_WITNESS_DATABASE_URL: ''
      P5_LATER_PRE_CONFIRM: ${{ inputs.confirm }}
      V39_P5_LATER_PRE_OWNER_APPROVED: ${{ secrets.V39_P5_LATER_PRE_OWNER_APPROVED }}
      V39_P5_LATER_PRE_APPROVED_CODE_SHA: ${{ secrets.V39_P5_LATER_PRE_APPROVED_CODE_SHA }}
      V39_P5_LATER_PRE_SIGNED_PACKET_SHA256: ${{ secrets.V39_P5_LATER_PRE_SIGNED_PACKET_SHA256 }}
      V39_P5_LATER_PRE_T24_RECEIPT_SHA256: ${{ secrets.V39_P5_LATER_PRE_T24_RECEIPT_SHA256 }}
      V39_P5_STANDALONE_LATER_PRE_INDEPENDENT_APPROVED: ${{ secrets.V39_P5_STANDALONE_LATER_PRE_INDEPENDENT_APPROVED }}
      V39_P5_STANDALONE_LATER_PRE_AMENDMENT_SHA256: ${{ secrets.V39_P5_STANDALONE_LATER_PRE_AMENDMENT_SHA256 }}
      V39_PHASE5_FREEZE_SIGNED: ${{ secrets.V39_PHASE5_FREEZE_SIGNED }}
      V39_PHASE5_SOURCE_RIGHTS_APPROVED: ${{ secrets.V39_PHASE5_SOURCE_RIGHTS_APPROVED }}
      V39_PHASE6_PROCESS_ARMED: ${{ secrets.V39_PHASE6_PROCESS_ARMED }}
      V39_P5_MANIFEST_SHA256: ${{ secrets.V39_P5_MANIFEST_SHA256 }}
      V39_P5_QUERY_DIGEST: ${{ secrets.V39_P5_QUERY_DIGEST }}
      V39_P5_RELEASE_SHA256: ${{ secrets.V39_P5_RELEASE_SHA256 }}
      V39_P5_RIGHTS_SHA256: ${{ secrets.V39_P5_RIGHTS_SHA256 }}
      V39_P5_FRAME_HASH: ${{ secrets.V39_P5_FRAME_HASH }}
      V39_P5_CONFIG_HASH: ${{ secrets.V39_P5_CONFIG_HASH }}
      V39_P5_NATIVE_T_SEMANTICS_SHA256: ${{ secrets.V39_P5_NATIVE_T_SEMANTICS_SHA256 }}
      P5_V39_PRE_DATABASE_URL: ${{ secrets.P5_V39_PRE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify signed future pre packet and separated release before dependencies
        shell: bash
        env:
          PACKET_FILE: ${{ inputs.frozen_later_pre_packet }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$GITHUB_REPOSITORY" = HKcode22/ReplitTranvr
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$ADB_AUTO_COLLECT" = 0
          test -z "$AERODATABOX_API_KEY"
          test -z "$DATABASE_URL"
          test -z "$V39_P5_SOURCE_DATABASE_URL"
          test "$V39_P5_LATER_PRE_OWNER_APPROVED" = 1
          test "$V39_PHASE5_FREEZE_SIGNED" = 1
          test "$V39_PHASE5_SOURCE_RIGHTS_APPROVED" = 1
          test "$V39_PHASE6_PROCESS_ARMED" = 1
          test "$V39_P5_LATER_PRE_APPROVED_CODE_SHA" = "$GITHUB_SHA"
          [[ "$PACKET_FILE" =~ ^data-collection/phase5/frozen/[A-Za-z0-9_-]{8,100}\.json$ ]]
          test -f "$PACKET_FILE"
          test -n "$V39_P5_LATER_PRE_SIGNED_PACKET_SHA256"
          if test -z "$V39_P5_LATER_PRE_T24_RECEIPT_SHA256"; then
            # v2 permits explicit missing T24 only under independent signed
            # amendment; runtime verifies schema, packet and source/clock.
            test "$V39_P5_STANDALONE_LATER_PRE_INDEPENDENT_APPROVED" = 1
            [[ "$V39_P5_STANDALONE_LATER_PRE_AMENDMENT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          fi
          test -n "$P5_V39_PRE_DATABASE_URL"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: One prospective witnessed T6/T90 PRE under existing PRE-only role
        env:
          PACKET_FILE: ${{ inputs.frozen_later_pre_packet }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          npx tsx scripts/v39_phase5_one_signed_witnessed_later_pre_github_owner_v39.ts "$PACKET_FILE"
          echo 'ONE_WITNESSED_LATER_PRE_FINISHED_NO_PROVIDER_NO_FREEZE_GO_GRANTED'
