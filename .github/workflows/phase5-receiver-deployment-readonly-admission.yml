name: Phase5 receiver deployed SHA no-provider READ ONLY admission
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/v39_phase5_replit_receiver_deployment_readonly_once.mjs"
      - "scripts/phase5_replit_receiver_provenance_readonly_owner_launcher.sh"
      - "tests/phase5_replit_receiver_deployment_readonly_v39.test.mjs"
      - ".github/workflows/phase5-receiver-deployment-readonly-admission.yml"
  push:
    branches: [main]
    paths:
      - "scripts/v39_phase5_replit_receiver_deployment_readonly_once.mjs"
      - "scripts/phase5_replit_receiver_provenance_readonly_owner_launcher.sh"
      - "tests/phase5_replit_receiver_deployment_readonly_v39.test.mjs"
      - ".github/workflows/phase5-receiver-deployment-readonly-admission.yml"
permissions:
  contents: read
env:
  ADB_AUTO_COLLECT: "0"
  V39_PHASE6_PROCESS_ARMED: "0"
  V39_PHASE6_OWNER_APPROVED: "0"
  AERODATABOX_API_KEY: ""
  DATABASE_URL: ""
jobs:
  exact-receiver-provenance-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify non-mutating owner CLI source pins and Bash + Node syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/phase5_replit_receiver_provenance_readonly_owner_launcher.sh
          node --check scripts/v39_phase5_replit_receiver_deployment_readonly_once.mjs
          test "$(git hash-object scripts/v39_phase5_replit_receiver_deployment_readonly_once.mjs)" = 4ea951a6d94bc73d5345df01a0ec8c590672c74a
          grep -Fq "P5_RECEIVER_READONLY_CLI=1" scripts/phase5_replit_receiver_provenance_readonly_owner_launcher.sh
          grep -Fq "NO_GIT_MUTATION_NO_PUBLISH" scripts/phase5_replit_receiver_provenance_readonly_owner_launcher.sh
      - name: Mock local-only, stale deployed source, no POST and zero mutation
        run: node --test tests/phase5_replit_receiver_deployment_readonly_v39.test.mjs
