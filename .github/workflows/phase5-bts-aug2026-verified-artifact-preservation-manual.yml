name: Phase5 BTS Aug2026 Verified Artifact Preservation (Manual, No Provider)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase5-bts-aug2026-verified-artifact-preservation-manual.yml"
      - "scripts/v39_phase5_bts_gate_wheelsoff_contrast.py"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Preserve the exact already-verified BTS artifacts within GitHub Actions for up to 90 more days; no provider fetch or production DB"
        required: true
        type: choice
        default: HOLD_NO_COPY
        options:
          - HOLD_NO_COPY
          - COPY_VERIFIED_BTS_TO_90_DAY_ARTIFACTS
          - COPY_VERIFIED_NORMALIZED_BTS_ONLY_TO_90_DAY_ARTIFACT

permissions:
  contents: read
  actions: read

concurrency:
  group: bts-aug2026-verified-artifact-preservation-${{ github.ref }}
  cancel-in-progress: false

env:
  ADB_AUTO_COLLECT: "0"
  AERODATABOX_API_KEY: ""
  RAPIDAPI_KEY: ""
  DATABASE_URL: ""
  GATE05_AUTOMATION_DATABASE_URL: ""
  V39_DATABASE_RUNTIME_URL: ""
  V39_PHASE6_PROCESS_ARMED: "0"
  V39_PHASE6_OWNER_APPROVED: "0"

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Existing nonpaid historical-lane synthetic regression
        run: |
          set -Eeuo pipefail
          test "${ADB_AUTO_COLLECT}" = '0'
          test "${V39_PHASE6_PROCESS_ARMED}" = '0'
          test "${V39_PHASE6_OWNER_APPROVED}" = '0'
          test -z "${AERODATABOX_API_KEY}${RAPIDAPI_KEY}${DATABASE_URL}${GATE05_AUTOMATION_DATABASE_URL}${V39_DATABASE_RUNTIME_URL}"
          python3 scripts/v39_phase5_bts_aug2026_historical_training_lane.py --self-test
          echo 'BTS_PRESERVATION_OFFLINE_CONTRACT_PASS_NO_PAID_NO_NEON' >> "$GITHUB_STEP_SUMMARY"

  preserve-exact-existing-aug2026:
    needs: offline-preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'HKcode22/ReplitTranvr' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (inputs.confirm == 'COPY_VERIFIED_BTS_TO_90_DAY_ARTIFACTS' ||
       inputs.confirm == 'COPY_VERIFIED_NORMALIZED_BTS_ONLY_TO_90_DAY_ARTIFACT')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BTS_PRESERVATION_MODE: ${{ inputs.confirm }}
    steps:
      - name: Download only original already-verified November 12 source artifact
        if: inputs.confirm == 'COPY_VERIFIED_BTS_TO_90_DAY_ARTIFACTS'
        uses: actions/download-artifact@v4
        with:
          name: v39-gate5-bts-aug2026-official-public-source
          run-id: 43281032803
          github-token: ${{ github.token }}
          repository: HKcode22/ReplitTranvr
          path: /tmp/v39_bts_preserve/source/
      - name: Download only original already-verified historical normalized artifact
        uses: actions/download-artifact@v4
        with:
          name: v39-phase5-bts-aug2026-us-historical-only-not-pre
          run-id: 43281032803
          github-token: ${{ github.token }}
          repository: HKcode22/ReplitTranvr
          path: /tmp/v39_bts_preserve/normalized/
      - name: Independently verify requested exact original file hashes and strict provenance
        run: |
          set -Eeuo pipefail
          set +x
          test -z "${AERODATABOX_API_KEY}${RAPIDAPI_KEY}${DATABASE_URL}${GATE05_AUTOMATION_DATABASE_URL}${V39_DATABASE_RUNTIME_URL}"
          test "${V39_PHASE6_PROCESS_ARMED}" = 0
          test "${V39_PHASE6_OWNER_APPROVED}" = 0
          python3 - <<'PY'
          import csv, gzip, hashlib, json, os
          from pathlib import Path
          base=Path("/tmp/v39_bts_preserve")
          raw=base/"source/official_bts_reporting_carrier_2026_8.zip"
          raw_json=base/"source/official_bts_reporting_carrier_aug2026_summary.json"
          normalized=base/"normalized/bts_reporting_carrier_2026_08_historic_normalized.csv.gz"
          normalized_json=base/"normalized/bts_aug2026_historical_manifest.json"
          expected_raw="203509350f574f81728ca51175a17360d0413aa990512f8e0c8f1342f5baf23a"
          expected_norm="406587471b44794ea1f574fad2400fc0bafdd85f6898faa8f41b6706294a4614"
          mode=os.environ['BTS_PRESERVATION_MODE']
          if mode not in ('COPY_VERIFIED_BTS_TO_90_DAY_ARTIFACTS','COPY_VERIFIED_NORMALIZED_BTS_ONLY_TO_90_DAY_ARTIFACT'):
              raise SystemExit('HOLD_BTS_PRESERVATION_MODE')
          both=mode=='COPY_VERIFIED_BTS_TO_90_DAY_ARTIFACTS'
          targets=[(normalized,expected_norm)]+([(raw,expected_raw)] if both else [])
          for p,expected in targets:
              if not p.is_file() or not (1_000_000 < p.stat().st_size < 50_000_000):
                  raise SystemExit("HOLD_BTS_PRESERVATION_MISSING_OR_WRONG_SIZE")
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):h.update(chunk)
              if h.hexdigest()!=expected:
                  raise SystemExit("HOLD_BTS_PRESERVATION_ORIGINAL_SHA_CHANGED")
          b=json.loads(normalized_json.read_text(encoding="utf-8"))
          if both:
              a=json.loads(raw_json.read_text(encoding="utf-8"))
              assert a.get("sourceZipSha256")==expected_raw
              assert a.get("sourceMonth")=="2026-08"
              assert a.get("phase5FreezeAuthorized") is False
              assert a.get("phase6Authorized") is False
          assert b.get("sourceOfficialZipSha256")==expected_raw
          assert b.get("normalizedCsvGzipSha256")==expected_norm
          assert b.get("totalRows")==608389
          assert b.get("signedGateDelayLabels")==597734
          assert b.get("missingTail")==1338
          assert b.get("phase5ScientificFreeze") is False
          assert b.get("phase6PaidGo") is False
          assert b.get("databaseWrites")==0
          assert b.get("providerCalls")==0
          assert b.get("btsIncludedAsOriginalAeroDataBoxPre") is False
          count=0
          with gzip.open(normalized,"rb") as f:
              for chunk in iter(lambda:f.read(1024*1024),b""):
                  count+=len(chunk)
                  if count>400_000_000:
                      raise SystemExit("HOLD_BTS_PRESERVATION_GZIP_UNBOUNDED")
          if count<1_000_000:
              raise SystemExit("HOLD_BTS_PRESERVATION_GZIP_TRUNCATED")
          with gzip.open(normalized,'rt',encoding='utf-8',newline='') as f:
              rows=csv.reader(f)
              header=next(rows,None)
              if not header or sum(1 for _ in rows)!=608389:
                  raise SystemExit('HOLD_BTS_PRESERVATION_ROW_COUNT')
          print('BTS_AUG2026_'+('TWO_ORIGINAL' if both else 'NORMALIZED_ONLY_ORIGINAL_RAW_NOT_REVERIFIED')+'_SHA_MANIFEST_AND_GZIP_VERIFIED_NO_PROVIDER_NO_DB')
          PY
      - name: Preserve exact public BTS source and verification summary in Actions only
        if: inputs.confirm == 'COPY_VERIFIED_BTS_TO_90_DAY_ARTIFACTS'
        uses: actions/upload-artifact@v4
        with:
          name: v39-bts-aug2026-official-source-sha-preserved-20261113
          path: /tmp/v39_bts_preserve/source/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Preserve exact normalized history and manifest in separate Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.confirm == 'COPY_VERIFIED_NORMALIZED_BTS_ONLY_TO_90_DAY_ARTIFACT' && 'v39-bts-aug2026-normalized-only-sha-preserved-20261115' || 'v39-bts-aug2026-normalized-sha-preserved-20261113' }}
          path: /tmp/v39_bts_preserve/normalized/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Explicitly retain historical-only and nonpermanent status
        run: |
          if test "$BTS_PRESERVATION_MODE" = COPY_VERIFIED_BTS_TO_90_DAY_ARTIFACTS; then
            echo 'Original ZIP and normalized BTS 2026-08 hashes independently passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Only normalized BTS 2026-08 hash, provenance manifest and row count independently passed. Original raw ZIP NOT reverified or preserved by this run.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Requested 90-day Actions retention (actual expiry subject to repository policy).' >> "$GITHUB_STEP_SUMMARY"
          echo 'These are temporary same-repo GitHub artifacts, NOT durable Phase7 object storage or AeroDataBox PRE. No provider API GET, no Neon writes, no Phase5 FREEZE or paid Phase6 GO.' >> "$GITHUB_STEP_SUMMARY"

  actual-existing-historical-gate-wheelsoff-contrast:
    # Named PR-only historical analysis, no provider re-download or paid GO.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'HKcode22/ReplitTranvr' && github.head_ref == 'phase5/bts-actual-gate-wheelsoff-contrast-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline contrast regression plus verify preserved artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$ADB_AUTO_COLLECT$V39_PHASE6_PROCESS_ARMED$V39_PHASE6_OWNER_APPROVED" = 000
          test -z "$DATABASE_URL$V39_DATABASE_RUNTIME_URL$RAPIDAPI_KEY$AERODATABOX_API_KEY"
          python3 scripts/v39_phase5_bts_gate_wheelsoff_contrast.py --self-test
          gh api --method GET repos/HKcode22/ReplitTranvr/actions/artifacts/14198898471 | jq -e '
            .id==14198898471 and .expired==false and .size_in_bytes==41376820 and
            .name=="v39-bts-aug2026-normalized-only-sha-preserved-20261115" and
            .digest=="sha256:5440085391a80db26e44b060472ab4e69b63263549a8b38af0252dba670d37a0"' >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: v39-bts-aug2026-normalized-only-sha-preserved-20261115
          run-id: 43808240282
          github-token: ${{ github.token }}
          repository: HKcode22/ReplitTranvr
          path: ${{ runner.temp }}/bts-actual-history
      - name: Analyze all original normalized records, aggregate only and preserve evidence
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -p "$RUNNER_TEMP/bts-contrast-aggregate"
          python3 scripts/v39_phase5_bts_gate_wheelsoff_contrast.py --actual-preserved "$RUNNER_TEMP/bts-actual-history" > "$RUNNER_TEMP/bts-contrast-aggregate/contrast.json"
          cat "$RUNNER_TEMP/bts-contrast-aggregate/contrast.json"
          sha256sum "$RUNNER_TEMP/bts-contrast-aggregate/contrast.json"
      - uses: actions/upload-artifact@v4
        with:
          name: bts-aug2026-gate-wheelsoff-historical-contrast-aggregate
          path: ${{ runner.temp }}/bts-contrast-aggregate/contrast.json
          retention-days: 90
          if-no-files-found: error
