name: V3.9 Gate0 Finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply final Gate0 document reconciliation
        run: python3 scripts/v39_gate0_finalize_docs.py
      - name: Validate offline
        env:
          ADB_AUTO_COLLECT: '0'
          V39_PHASE6_PROCESS_ARMED: '0'
          AERODATABOX_API_KEY: ''
        run: |
          npm run v39:test:offline
          npm run v39:typecheck
      - name: Commit final Gate0 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/v39_gate0_finalize_docs.py .github/workflows/v39-gate0-finalize.yml
          git add SEPmd/V3.9_DataCollectPlan_f.8.md SEPmd/V3.9_IMPLEMENTATION_LOG.md SEPmd/V3.9_RUN_REPORTS_AND_EVIDENCE.md
          git diff --cached --check
          git commit -m "V3.9 Gate0: finalize Phase1 PASS and next prerequisite"
          git push origin HEAD:main
