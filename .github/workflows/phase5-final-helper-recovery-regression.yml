name: Phase5 final helper recovery regression (no provider)

on:
  push:
    branches:
      - phase5/final-helper-recovery-fixes-clean-20261118
    paths:
      - 'review-tools/**'
      - '.github/workflows/phase5-final-helper-recovery-regression.yml'
  pull_request:
    paths:
      - 'review-tools/**'
      - '.github/workflows/phase5-final-helper-recovery-regression.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  helper-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      V39_PHASE6_OWNER_APPROVED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Syntax-check exact final helpers and fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            review-tools/p5_final_primary_relay_repin.cjs
            review-tools/p5_export_exact_approved_bundle.cjs
            review-tools/p5_bulk_final_owner_handoff.cjs
            review-tools/p5_resume_existing_final_commissioning.cjs
            review-tools/p5_run_existing_inert_stage_chain.cjs
            review-tools/p5_prepare_adopt_exact_final_core_inputs.cjs
            review-tools/p5_final_core_review_materializer.cjs
            review-tools/p5_static_install_review_materializer.cjs
            review-tools/p5_private_policy_review_materializer.cjs
            review-tools/p5_final_policy_binding_materializer.cjs
            review-tools/p5_final_phase5_freeze_decision.cjs
            review-tools/p5_assemble_exact_six_final_policies.cjs
            review-tools/p5_exact_final_release_policy_bindings.cjs
            review-tools/p5_install_exact_approved_static_values.cjs
            review-tools/p5_phase5_rights_deferred_prepare.cjs
            review-tools/p5_phase5_rights_deferred_commission.cjs
            review-tools/p5_final_repin_receipt.test.cjs
            review-tools/p5_manifest_receipt_recovery.test.cjs
            review-tools/p5_inert_stage_chain.test.cjs
            review-tools/p5_bulk_handoff.test.cjs
            review-tools/p5_resume_state.test.cjs
            review-tools/p5_resume_state_machine.test.cjs
            review-tools/p5_final_core_review.test.cjs
            review-tools/p5_final_core_review_materializer.test.cjs
            review-tools/p5_static_install_review_materializer.test.cjs
            review-tools/p5_private_policy_review_materializer.test.cjs
            review-tools/p5_final_policy_binding_materializer.test.cjs
            review-tools/p5_final_phase5_freeze_decision.test.cjs
            review-tools/p5_no_unsigned_manifest_staging_shortcuts.test.cjs
            review-tools/p5_final_downstream_transition_audit.test.cjs
            review-tools/p5_final_core_technical_recommendation.test.cjs
            review-tools/p5_six_policy_binding.test.cjs
            review-tools/p5_static_install_binding.test.cjs
            review-tools/p5_final_core_mechanical_bindings.test.cjs
            review-tools/p5_final_core_closure_matrix.test.cjs
            review-tools/p5_phase5_rights_deferred_prepare.test.cjs
            review-tools/p5_phase5_rights_deferred_commission.test.cjs
            tests/phase6_direct_recovery_tick_v39.test.mjs
            tests/phase6_rolling_failure_journal_v39.test.mjs
            tests/phase6_rolling_failure_readback_v39.test.mjs
          )
          for f in "${files[@]}"; do node --check "$f"; done
          node -e 'JSON.parse(require("fs").readFileSync("review-tools/fixtures/p5_six_policy_candidate.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("review-tools/fixtures/p5_877_evidence_ledger.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("review-tools/2026-11-18_FINAL_CORE_MECHANICAL_BINDINGS_READY_NO_GO.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("review-tools/2026-11-19_FINAL_CORE_REVIEWER_CLOSURE_MATRIX_NO_GO.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("review-tools/2026-11-19_PHASE5_FINAL_DOWNSTREAM_TRANSITION_AUDIT_NO_GO.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("review-tools/2026-11-19_FINAL_CORE_TECHNICAL_REVIEW_RECOMMENDATION_NO_GO.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("review-tools/2026-11-19_STATIC_INSTALL_REVIEWER_INPUT_TEMPLATE_NO_GO.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("review-tools/2026-11-19_PRIVATE_POLICY_REVIEWER_INPUT_TEMPLATE_NO_GO.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("review-tools/2026-11-19_FINAL_POLICY_BINDING_REVIEWER_INPUT_TEMPLATE_NO_GO.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("review-tools/2026-11-19_FINAL_PHASE5_FREEZE_REVIEWER_DECISION_INPUT_TEMPLATE_NO_GO.json","utf8"))'
          bash -n review-tools/p5_owner_final_resume_once.sh
          bash -n review-tools/p5_materialize_final_core_review_once.sh
          bash -n review-tools/p5_materialize_final_phase5_freeze_once.sh
          bash -n review-tools/p5_materialize_downstream_review_once.sh
          helper_tmp="$(mktemp --suffix=.cjs 2>/dev/null || mktemp "${TMPDIR:-/tmp}/p5-final-helper.XXXXXX.cjs")"
          cp review-tools/p5_resume_existing_final_commissioning.cjs "$helper_tmp"
          node --check "$helper_tmp"
          rm -f "$helper_tmp"

      - name: Run focused final commissioning regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test \
            review-tools/p5_final_repin_receipt.test.cjs \
            review-tools/p5_manifest_receipt_recovery.test.cjs \
            review-tools/p5_inert_stage_chain.test.cjs \
            review-tools/p5_bulk_handoff.test.cjs \
            review-tools/p5_resume_state.test.cjs \
            review-tools/p5_resume_state_machine.test.cjs \
            review-tools/p5_final_core_review.test.cjs \
            review-tools/p5_final_core_review_materializer.test.cjs \
            review-tools/p5_static_install_review_materializer.test.cjs \
            review-tools/p5_private_policy_review_materializer.test.cjs \
            review-tools/p5_final_policy_binding_materializer.test.cjs \
            review-tools/p5_final_phase5_freeze_decision.test.cjs \
            review-tools/p5_no_unsigned_manifest_staging_shortcuts.test.cjs \
            review-tools/p5_final_downstream_transition_audit.test.cjs \
            review-tools/p5_final_core_technical_recommendation.test.cjs \
            review-tools/p5_six_policy_binding.test.cjs \
            review-tools/p5_static_install_binding.test.cjs \
            review-tools/p5_final_core_mechanical_bindings.test.cjs \
            review-tools/p5_final_core_closure_matrix.test.cjs \
            review-tools/p5_phase5_rights_deferred_prepare.test.cjs \
            review-tools/p5_phase5_rights_deferred_commission.test.cjs \
            tests/phase6_direct_recovery_tick_v39.test.mjs \
            tests/phase6_rolling_failure_journal_v39.test.mjs \
            tests/phase6_rolling_failure_readback_v39.test.mjs

      - name: Verify complete exact helper blob pin chain
        shell: bash
        run: |
          set -Eeuo pipefail
          CORE_INPUTS="$(git hash-object review-tools/p5_prepare_adopt_exact_final_core_inputs.cjs)"
          CORE="$(git hash-object review-tools/p5_exact_final_release_policy_bindings.cjs)"
          ASSEMBLY="$(git hash-object review-tools/p5_assemble_exact_six_final_policies.cjs)"
          BUNDLE="$(git hash-object review-tools/p5_export_exact_approved_bundle.cjs)"
          INSTALL="$(git hash-object review-tools/p5_install_exact_approved_static_values.cjs)"
          STAGE="$(git hash-object review-tools/p5_run_existing_inert_stage_chain.cjs)"
          REPIN="$(git hash-object review-tools/p5_final_primary_relay_repin.cjs)"
          BULK="$(git hash-object review-tools/p5_bulk_final_owner_handoff.cjs)"
          FREEZE="$(git hash-object review-tools/p5_final_phase5_freeze_decision.cjs)"
          node - "$CORE_INPUTS" "$CORE" "$ASSEMBLY" "$BUNDLE" "$INSTALL" "$STAGE" "$REPIN" "$BULK" "$FREEZE" <<'NODE'
          const fs=require('node:fs');
          const [coreInputs,core,assembly,bundle,install,stage,repin,bulk,freeze]=process.argv.slice(2);
          const resume=fs.readFileSync('review-tools/p5_resume_existing_final_commissioning.cjs','utf8');
          const handoff=fs.readFileSync('review-tools/p5_bulk_final_owner_handoff.cjs','utf8');
          const ownerOnce=fs.readFileSync('review-tools/p5_owner_final_resume_once.sh','utf8');
          const reviewOnce=fs.readFileSync('review-tools/p5_materialize_final_core_review_once.sh','utf8');
          const freezeOnce=fs.readFileSync('review-tools/p5_materialize_final_phase5_freeze_once.sh','utf8');
          const downstreamOnce=fs.readFileSync('review-tools/p5_materialize_downstream_review_once.sh','utf8');
          const need=(x,m)=>{if(!x)throw Error(m)};
          for(const [name,sha] of Object.entries({coreInputs,core,assembly,bundle,install,stage})) {
            need(handoff.includes(name+':"'+sha+'"'),'bulk '+name+' blob mismatch');
          }
          need(resume.includes('REPIN="'+repin+'"'),'resume REPIN blob mismatch');
          need(resume.includes('FREEZE="'+freeze+'"'),'resume FREEZE blob mismatch');
          need(resume.includes('RUNNER="'+bulk+'"'),'resume RUNNER blob mismatch');
          const resumeBlob=require('node:child_process').execFileSync('git',['hash-object','review-tools/p5_resume_existing_final_commissioning.cjs'],{encoding:'utf8'}).trim();
          need(ownerOnce.includes('HELPER_BLOB="'+resumeBlob+'"'),'owner launcher HELPER blob mismatch');
          need(ownerOnce.includes('TESTED_RUN="44475135730"')&&ownerOnce.includes('TESTED_HEAD="87b5f9722ddbd635208e8e8f2487bb4ea97a8bd7"'),'owner launcher tested-run pin mismatch');
          const gitHash=p=>require('node:child_process').execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim();
          need(reviewOnce.includes('MATERIALIZER_BLOB="'+gitHash('review-tools/p5_final_core_review_materializer.cjs')+'"'),'final review materializer pin mismatch');
          need(reviewOnce.includes('CORE_VALIDATOR_BLOB="'+coreInputs+'"'),'final review core validator pin mismatch');
          need(reviewOnce.includes('MECHANICAL_BLOB="'+gitHash('review-tools/2026-11-18_FINAL_CORE_MECHANICAL_BINDINGS_READY_NO_GO.json')+'"'),'final review mechanical pin mismatch');
          need(reviewOnce.includes('CLOSURE_BLOB="'+gitHash('review-tools/2026-11-19_FINAL_CORE_REVIEWER_CLOSURE_MATRIX_NO_GO.json')+'"'),'final review closure pin mismatch');
          need(reviewOnce.includes('LEDGER_BLOB="'+gitHash('review-tools/fixtures/p5_877_evidence_ledger.json')+'"'),'final review ledger pin mismatch');
          need(freezeOnce.includes('FREEZE_BLOB="'+freeze+'"'),'final freeze wrapper helper pin mismatch');
          need(downstreamOnce.includes('POLICY_BLOB="'+gitHash('review-tools/p5_final_policy_binding_materializer.cjs')+'"'),'downstream policy materializer pin mismatch');
          need(downstreamOnce.includes('PRIVATE_BLOB="'+gitHash('review-tools/p5_private_policy_review_materializer.cjs')+'"'),'downstream private materializer pin mismatch');
          need(downstreamOnce.includes('STATIC_BLOB="'+gitHash('review-tools/p5_static_install_review_materializer.cjs')+'"'),'downstream static materializer pin mismatch');
          need(!downstreamOnce.includes('FREEZE_BLOB=')&&!downstreamOnce.includes(' FREEZE)'),'generic downstream wrapper must not expose alternate freeze path');
          need(downstreamOnce.includes('BASE="70580b3749544dfcbeff39da181b2aa42b1b4476"'),'downstream base pin missing');
          need(downstreamOnce.includes('compare/$BASE...$LIVE')&&downstreamOnce.includes('NON_EVIDENCE_MAIN_DRIFT')&&downstreamOnce.includes('LIVE12='),'downstream evidence-only live-main guard missing');
          need(freezeOnce.includes('DEST="$OUT/approved-final-phase5-freeze.json"'),'dedicated freeze output filename mismatch');
          need(freezeOnce.includes('BASE="70580b3749544dfcbeff39da181b2aa42b1b4476"')&&freezeOnce.includes('compare/$BASE...$LIVE')&&freezeOnce.includes('NON_EVIDENCE_MAIN_DRIFT'),'dedicated freeze evidence-only live-main guard missing');
          console.log(JSON.stringify({
            status:'PHASE5_FINAL_COMPLETE_HELPER_PIN_CHAIN_EXACT_NO_GO',
            coreInputsBlob:coreInputs,coreBlob:core,assemblyBlob:assembly,
            bundleBlob:bundle,installBlob:install,stageBlob:stage,
            repinBlob:repin,bulkBlob:bulk,freezeBlob:freeze,
            providerCalls:0,databaseWrites:0,phase6PaidGo:false
          }));
          NODE

      - name: Confirm no production credentials are present
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "${AERODATABOX_API_KEY:-}"
          test -z "${RAPIDAPI_KEY:-}"
          test -z "${AERODATABOX_WEBHOOK_SECRET:-}"
          test -z "${DATABASE_URL:-}"
          echo 'NO_PROVIDER_OR_PRODUCTION_DB_CREDENTIALS'
