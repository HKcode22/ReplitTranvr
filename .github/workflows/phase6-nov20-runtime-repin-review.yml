name: Phase6 Nov20 runtime repin review (NO GO)
on:
  pull_request:
    branches: [main]
    paths:
      - 'review-tools/p6_nov20_runtime_repin_evidence*'
      - 'review-tools/p6_nov20_unattended_readiness_readonly*'
      - 'review-tools/p6_nov20_final_*repin*'
      - 'review-tools/p6_nov20_prepare_runtime_plan_rebind_v39.ts'
      - 'review-tools/p6_nov20_recover_six_policy_inputs.cjs'
      - 'tests/phase6_nov20_runtime_plan_rebind_review_v39.test.ts'
      - '.github/workflows/phase6-nov20-runtime-repin-review.yml'
permissions:
  contents: read
env:
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  V39_PHASE6_OWNER_APPROVED: '0'
  AERODATABOX_API_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
  RAPIDAPI_KEY: ''
  DATABASE_URL: ''
  V39_DATABASE_RUNTIME_URL: ''
jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - name: Verify syntax and pure receipt and STOP boundaries
        run: |
          set -Eeuo pipefail
          node --check review-tools/p6_nov20_runtime_repin_evidence.cjs
          node --check review-tools/p6_nov20_final_main_nine_pin_repin.cjs
          node --check review-tools/p6_nov20_final_primary_relay_repin.cjs
          node --check review-tools/p6_nov20_unattended_readiness_readonly.mjs
          node --check review-tools/p6_nov20_recover_six_policy_inputs.cjs
          if node review-tools/p6_nov20_recover_six_policy_inputs.cjs; then exit 2; fi
          node --test review-tools/p6_nov20_runtime_repin_evidence.test.cjs review-tools/p6_nov20_final_primary_relay_repin.test.cjs review-tools/p6_nov20_unattended_readiness_readonly.test.mjs
          test -z "$AERODATABOX_API_KEY$RAPIDAPI_KEY$DATABASE_URL$V39_DATABASE_RUNTIME_URL"
          test "$V39_PHASE6_PROCESS_ARMED" = 0
          echo NOV20_RUNTIME_REPIN_REVIEW_COMPLETE_NO_PROVIDER_NO_GO
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Exact real revised compiler and 31 immutable daily plans
        run: npx --no-install vitest run tests/phase6_nov20_runtime_plan_rebind_review_v39.test.ts
