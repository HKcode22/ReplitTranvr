name: Phase4 Gate5 Free NOAA Weather Receipt (No Paid Provider)

on:
  # Public actual capture is opt-in after the first verified canary; avoid
  # two NOAA requests on every unrelated PR revision.
  pull_request:
    types: [labeled]
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-free-noaa-weather-receipt.yml"
      - "server/lib/disruption/phase7NoaaPublicArchive_v39.ts"
      - "scripts/v39_phase7_noaa_public_archive_canary_v39.ts"
      - "tests/phase7_noaa_public_archive_v39.test.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase4-gate5-free-noaa-weather-receipt.yml"
      - "server/lib/disruption/phase4Gate5NoaaMetarReceipt_v39.ts"
      - "scripts/v39_phase4_gate5_free_noaa_metar_actions.ts"
      - "tests/phase4_gate5_free_noaa_metrar_receipt_v39.test.ts"

permissions:
  contents: read

concurrency:
  group: v39-gate5-once-free-noaa-${{ github.sha }}
  cancel-in-progress: false

jobs:
  capture-free-noaa:
    if: github.repository == 'HKcode22/ReplitTranvr' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ADB_AUTO_COLLECT: "0"
      V39_PHASE6_PROCESS_ARMED: "0"
      AERODATABOX_API_KEY: ""
      RAPIDAPI_KEY: ""
      DATABASE_URL: ""
      GATE05_AUTOMATION_DATABASE_URL: ""
      V39_DATABASE_RUNTIME_URL: ""
    steps:
      - name: Checkout exact reviewed main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Offline source-clock/hold regressions
        run: npx vitest run tests/phase4_gate5_free_noaa_metrar_receipt_v39.test.ts
      - name: ONE FREE NOAA worldwide METAR HTTPS retrieval — not Flight Alert
        run: |
          set -Eeuo pipefail
          set +x
          test "$ADB_AUTO_COLLECT" = "0"
          test "$V39_PHASE6_PROCESS_ARMED" = "0"
          test -z "$AERODATABOX_API_KEY$RAPIDAPI_KEY$DATABASE_URL$GATE05_AUTOMATION_DATABASE_URL$V39_DATABASE_RUNTIME_URL"
          npx tsx scripts/v39_phase4_gate5_free_noaa_metar_actions.ts capture-free-noaa
      - name: Preserve public weather source and receipt as short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: v39-gate5-noaa-metar-public-source
          path: /tmp/v39_gate5_free_noaa_meteorology/
          retention-days: 3
          if-no-files-found: error

  verify-free-noaa-artifact:
    needs: [capture-free-noaa]
    if: github.repository == 'HKcode22/ReplitTranvr' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADB_AUTO_COLLECT: "0"
      V39_PHASE6_PROCESS_ARMED: "0"
      AERODATABOX_API_KEY: ""
      RAPIDAPI_KEY: ""
      DATABASE_URL: ""
      GATE05_AUTOMATION_DATABASE_URL: ""
      V39_DATABASE_RUNTIME_URL: ""
    steps:
      - name: Checkout exact reviewed main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download durable artifact from separate completed job
        uses: actions/download-artifact@v4
        with:
          name: v39-gate5-noaa-metar-public-source
          path: /tmp/v39_gate5_free_noaa_meteorology/
      - name: Verify original digest and as-of feature availability with existing PRE selector
        run: |
          set -Eeuo pipefail
          set +x
          test -z "$AERODATABOX_API_KEY$RAPIDAPI_KEY$DATABASE_URL$GATE05_AUTOMATION_DATABASE_URL$V39_DATABASE_RUNTIME_URL"
          npx tsx scripts/v39_phase4_gate5_free_noaa_metar_actions.ts verify-free-noaa-artifact
      - name: Scope of completed free weather proof
        if: always()
        run: |
          echo 'NOAA METAR free source provenance + artifact readback, not AeroDataBox flight FIDS or actual runway.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No physical flight denominator, no persisted PRE, no Gate5 scientific PASS and no Phase5/Phase6 authorization.' >> "$GITHUB_STEP_SUMMARY"

  p7-noaa-public-capture:
    if: ${{ github.repository == 'HKcode22/ReplitTranvr' && github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'phase7-noaa-public-canary' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'phase6/nov23-exact-calendar-compiler-review' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      artifact_digest: ${{ steps.archive.outputs.artifact-digest }}
    env:
      ADB_AUTO_COLLECT: "0"
      V39_PHASE6_PROCESS_ARMED: "0"
      P7_NOAA_CODE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install vitest run tests/phase7_noaa_public_archive_v39.test.ts tests/phase7_independent_noaa_receipt_v39.test.ts
      - name: Two bounded public NOAA GETs, no aviation flight data
        run: npx --no-install tsx scripts/v39_phase7_noaa_public_archive_canary_v39.ts capture
      - id: archive
        uses: actions/upload-artifact@v4
        with:
          name: v39-p7-noaa-public-source-canary
          path: /tmp/p7-noaa-public-canary/
          retention-days: 3
          if-no-files-found: error

  p7-noaa-public-verify:
    needs: [p7-noaa-public-capture]
    if: ${{ github.repository == 'HKcode22/ReplitTranvr' && github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'phase7-noaa-public-canary' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'phase6/nov23-exact-calendar-compiler-review' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    env:
      ADB_AUTO_COLLECT: "0"
      V39_PHASE6_PROCESS_ARMED: "0"
      P7_NOAA_CODE_SHA: ${{ github.event.pull_request.head.sha }}
      P7_NOAA_ARTIFACT_ID: ${{ needs.p7-noaa-public-capture.outputs.artifact_id }}
      P7_NOAA_ARTIFACT_DIGEST: ${{ needs.p7-noaa-public-capture.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Independently download and hash exact GitHub ZIP and both public source bodies
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx scripts/v39_phase7_noaa_public_archive_canary_v39.ts review
      - uses: actions/upload-artifact@v4
        with:
          name: v39-p7-noaa-public-source-canary-review
          path: /tmp/p7-noaa-public-canary/review.json
          retention-days: 3
          if-no-files-found: error
