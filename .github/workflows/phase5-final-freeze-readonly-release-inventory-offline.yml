name: Phase5 production release inventory (READ ONLY logic, no provider)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v39_phase5_final_freeze_readonly_release_inventory_once.mjs'
      - 'scripts/phase5_final_freeze_readonly_owner_launcher.sh'
      - 'tests/phase5_final_freeze_readonly_release_inventory_v39.test.mjs'
      - '.github/workflows/phase5-final-freeze-readonly-release-inventory-offline.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/v39_phase5_final_freeze_readonly_release_inventory_once.mjs'
      - 'scripts/phase5_final_freeze_readonly_owner_launcher.sh'
      - 'tests/phase5_final_freeze_readonly_release_inventory_v39.test.mjs'
      - '.github/workflows/phase5-final-freeze-readonly-release-inventory-offline.yml'
permissions:
  contents: read
env:
  ADB_AUTO_COLLECT: '0'
  V39_PHASE6_PROCESS_ARMED: '0'
  V39_PHASE6_OWNER_APPROVED: '0'
  AERODATABOX_API_KEY: ''
  DATABASE_URL: ''
jobs:
  owner-readonly-inventory-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned dependencies only
        run: npm ci --include=dev --no-audit --no-fund
      - name: Verify inert owner launcher syntax + exact Git source pin
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/phase5_final_freeze_readonly_owner_launcher.sh
          test "$(git hash-object scripts/v39_phase5_final_freeze_readonly_release_inventory_once.mjs)" = ddcacdecd26ed9a6903e157b8a8299d53776d8d7
          grep -Fq 'BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY' scripts/v39_phase5_final_freeze_readonly_release_inventory_once.mjs
          grep -Fq "V39_PHASE6_PROCESS_ARMED=0" scripts/phase5_final_freeze_readonly_owner_launcher.sh
      - name: Metadata-only and refusal unit tests (no production DB)
        run: node --test tests/phase5_final_freeze_readonly_release_inventory_v39.test.mjs
