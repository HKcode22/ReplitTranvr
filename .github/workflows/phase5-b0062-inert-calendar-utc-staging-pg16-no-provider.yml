name: Phase5 B0062 Inert Calendar UTC Stage PG16 (No Provider)
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5B0062InertCalendarUtcBudgetStage_v39.mjs'
      - 'tests/phase5_b0062_inert_calendar_utc_staging_pg16_v39.test.ts'
      - '.github/workflows/phase5-b0062-inert-calendar-utc-staging-pg16-no-provider.yml'
      - 'data-collection/phase5/2026-11-12_B0062_INERT_PRELAUNCH_CALENDAR_UTC_BUDGET_ATOMIC_STAGING.md'
  push:
    branches: [main]
    paths:
      - 'server/lib/disruption/phase5B0062InertCalendarUtcBudgetStage_v39.mjs'
      - 'tests/phase5_b0062_inert_calendar_utc_staging_pg16_v39.test.ts'
permissions:
  contents: read
env:
  ADB_AUTO_COLLECT: '0'
  AERODATABOX_API_KEY: ''
  AERODATABOX_WEBHOOK_SECRET: ''
  V39_PHASE6_PROCESS_ARMED: '0'
  V39_PHASE6_OWNER_APPROVED: '0'
  V39_P5_B0062_INERT_STAGE_PG16: '1'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
  V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
jobs:
  reviewed-inert-b0062-utc-real-pg16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Load ONLY disposable B0062 and already-existing V0079 V0082 DDL
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = 'true'
          test "$DATABASE_URL" = 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
          test -z "$AERODATABOX_API_KEY"
          test "$V39_PHASE6_PROCESS_ARMED" = '0'
          npx tsx scripts/apply_boot_migrations_v39.ts
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f migrations/staged/V0082__phase5_seven_rest_categories_exposed_partition_hold_v39.sql
      - name: REAL PG16 denied owner, atomic late failure, disabled auth, replay
        run: |
          set -Eeuo pipefail
          test -z "$AERODATABOX_API_KEY"
          npx vitest run tests/phase5_b0062_inert_calendar_utc_staging_pg16_v39.test.ts
          npm run v39:typecheck
          echo 'P5_B0062_INERT_CALENDAR_UTC_PG16=PASS REAL_PRODUCTION_WRITES=0 PAID_HTTP=0 PHASE6_GO=0'
