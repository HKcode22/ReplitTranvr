name: Phase6 prospective calendar successor PG16 (NO PROVIDER)

on:
  pull_request:
    paths:
      - "server/lib/disruption/phase6ProspectiveCalendarSuccessor_v39.ts"
      - "tests/phase6_prospective_calendar_successor_pg16_v39.test.ts"
      - ".github/workflows/phase6-prospective-calendar-successor-pg16-no-provider.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg16-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d neondb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable
      V39_P6_CALENDAR_SUCCESSOR_PG16: "1"
      V39_PHASE6_PROCESS_ARMED: "0"
      V39_PHASE6_OWNER_APPROVED: "0"
      ADB_AUTO_COLLECT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Exact focused successor test
        run: npx --no-install vitest run tests/phase6_prospective_calendar_successor_pg16_v39.test.ts
      - name: TypeScript safety
        run: npm run check
