name: Phase5 Stage26/27 PG16 non-superuser creator NOLOGIN role commission (disposable only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v39_phase5_stage26_four_nologin_roles_owner_once.mjs'
      - '.github/workflows/phase5-stage26-nologin-role-installer-disposable-pg16.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/v39_phase5_stage26_four_nologin_roles_owner_once.mjs'
      - '.github/workflows/phase5-stage26-nologin-role-installer-disposable-pg16.yml'
permissions:
  contents: read
jobs:
  stage26-atomic-nologin-role-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GITHUB_ACTIONS: 'true'
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/neondb?sslmode=disable'
      V39_DATABASE_RUNTIME_URL: 'postgresql://postgres:postgres@localhost:5432/runtime-never-connected?sslmode=disable'
      P5_STAGE26_FOUR_NOLOGIN_ROLES_ONCE: 'INSTALL_FOUR_NOLOGIN_P5_ROLES_WITH_NO_RUNTIME_MEMBERS'
      ADB_AUTO_COLLECT: '0'
      V39_PHASE6_PROCESS_ARMED: '0'
      AERODATABOX_API_KEY: ''
      AERODATABOX_WEBHOOK_SECRET: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neondb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Apply real B0062 + stage23 reviewed three migrations in disposable PostgreSQL16
        run: |
          set -Eeuo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$V39_PHASE6_PROCESS_ARMED" = 0
          test -z "$AERODATABOX_API_KEY"
          npx tsx scripts/apply_boot_migrations_v39.ts
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0079__phase5_fids_31day_physical_attempt_and_original_binding_v39.sql >/tmp/v79.log
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0080__phase5_bind_actual_github_run_id_before_fids_get_v39.sql >/tmp/v80.log
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f migrations/staged/V0081__phase5_t24_separate_transaction_postcommit_witness_v39.sql >/tmp/v81.log
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c             "REVOKE EXECUTE ON FUNCTION clean.phase5_t24_witness_before_insert_v39(), clean.phase5_t24_witness_immutable_v39() FROM PUBLIC" >/dev/null
      - name: Reproduce production PostgreSQL16 non-superuser CREATEROLE implicit ADMIN membership
        run: |
          set -Eeuo pipefail
          # Existing CI used the postgres SUPERUSER; production uses a
          # CREATEROLE non-superuser and receives automatic ADMIN grants.
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE phase5_stage27_ci_creator
            LOGIN CREATEROLE NOSUPERUSER NOCREATEDB
            PASSWORD 'ci-only';
          GRANT USAGE ON SCHEMA clean TO phase5_stage27_ci_creator WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA clean
            TO phase5_stage27_ci_creator WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA clean
            TO phase5_stage27_ci_creator WITH GRANT OPTION;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA clean
            TO phase5_stage27_ci_creator WITH GRANT OPTION;
          SQL
          test "$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c             "SELECT rolsuper::int FROM pg_catalog.pg_roles WHERE rolname='phase5_stage27_ci_creator'")" = 0
          echo 'STAGE27_CI_REAL_PG16_NON_SUPERUSER=VERIFIED'
      - name: Inject error after all role grants and prove every role rolls back atomically
        run: |
          set -Eeuo pipefail
          if DATABASE_URL='postgresql://phase5_stage27_ci_creator:ci-only@localhost:5432/neondb?sslmode=disable' \
            P5_STAGE26_FORCE_CI_ROLLBACK=1 node scripts/v39_phase5_stage26_four_nologin_roles_owner_once.mjs >/tmp/role-rollback.out 2>/tmp/role-rollback.err; then
            echo 'FAILED_NO_ROLE_ROLLBACK_REFUSAL';exit 1
          fi
          grep -F 'REFUSED_P5_STAGE26_CI_INJECTED_BEFORE_COMMIT_ROLLBACK' /tmp/role-rollback.err >/dev/null
          test "$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c             "SELECT count(*) FROM pg_catalog.pg_roles WHERE rolname IN ('phase5_fids_prepare_prod_20261107','phase5_fids_source_prod_20261107','phase5_fids_pre_writer_prod_20261107','phase5_fids_t24_witness_prod_20261107')")" = 0
          P5_STAGE27_ROLE_RECONCILIATION_READONLY=1 node scripts/v39_phase5_stage27_role_creator_refusal_readonly_once.mjs >/tmp/stage27-catalog-after-rollback.json
          node --input-type=module -e '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync("/tmp/stage27-catalog-after-rollback.json","utf8"));
            if(p.status!=="STAGE27_PRIOR_REFUSAL_ROLLBACK_CONFIRMED_READONLY"||
               p.matchedStage26Roles!==0||p.databaseWrites!==0||p.providerFidsGets!==0)
              throw Error("STAGE27_PRECOMMIT_ROLLBACK_NOT_INDEPENDENTLY_CONFIRMED");
          '

      - name: Commit scoped NOLOGIN roles and test zero runtime members or paid dispatch
        run: |
          set -Eeuo pipefail
          DATABASE_URL='postgresql://phase5_stage27_ci_creator:ci-only@localhost:5432/neondb?sslmode=disable' \
            node scripts/v39_phase5_stage26_four_nologin_roles_owner_once.mjs >/tmp/role-success.json
          node --input-type=module -e '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync("/tmp/role-success.json","utf8"));
            if(p.status!=="P5_STAGE26_FOUR_NOLOGIN_ROLES_INSTALLED_NO_RUNTIME_ACTIVATION"||
               p.rolesCreated!==4||p.passwordOrRuntimeMembershipCreated!==false||
               p.loginEnabled!==false||p.liveProductionRoleChanges!==false||
               p.providerCalls!==0||p.flightRowsWritten!==0||
               p.phase5FreezePassed!==false||p.phase6PaidGo!==false||
               p.runtimeSetOrInheritMembershipCreated!==false||
               p.pg16AdminCreatorCanLaterGrantRuntimePrivileges!==true)
              throw Error("NOT_INERT_ROLE_SETUP");
          '
          # Exactly four creator-only administrative grants are PostgreSQL16
          # expected. Any other member or active SET/INHERIT privilege fails.
          test "$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c             "SELECT count(*) FROM pg_catalog.pg_auth_members a
             JOIN pg_catalog.pg_roles r ON r.oid=a.roleid
             JOIN pg_catalog.pg_roles m ON m.oid=a.member
             WHERE r.rolname LIKE 'phase5_fids_%_prod_20261107'
               AND m.rolname='phase5_stage27_ci_creator'
               AND a.admin_option=true AND a.set_option=false
               AND a.inherit_option=false")" = 4
          test "$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c             "SELECT count(*) FROM pg_catalog.pg_auth_members a
             JOIN pg_catalog.pg_roles r ON r.oid=a.roleid
             WHERE r.rolname LIKE 'phase5_fids_%_prod_20261107'")" = 4
          P5_STAGE27_ROLE_RECONCILIATION_READONLY=1 node scripts/v39_phase5_stage27_role_creator_refusal_readonly_once.mjs >/tmp/stage27-catalog-after-install.json
          node --input-type=module -e '
            import fs from "node:fs";
            const p=JSON.parse(fs.readFileSync("/tmp/stage27-catalog-after-install.json","utf8"));
            if(p.status!=="HOLD_STAGE27_FOUR_EXISTING_ROLES_NO_BLIND_RETRY"||
               p.matchedStage26Roles!==4||p.matchingRoleMembershipRecords!==4||
               p.unexpectedMemberOrRuntimeAccessRecords!==0||
               p.databaseWrites!==0||p.providerFidsGets!==0)
              throw Error("STAGE27_POSTINSTALL_READONLY_CATALOG_NOT_VERIFIED");
          '

      - name: Second installation must refuse replay and leave four roles intact
        run: |
          set -Eeuo pipefail
          if DATABASE_URL='postgresql://phase5_stage27_ci_creator:ci-only@localhost:5432/neondb?sslmode=disable' \
            node scripts/v39_phase5_stage26_four_nologin_roles_owner_once.mjs >/tmp/role-repeat.out 2>/tmp/role-repeat.err; then
            echo 'FAILED_DUPLICATE_ROLE_INSTALLATION_NOT_REFUSED';exit 1
          fi
          grep -F 'REFUSED_P5_STAGE26_EXISTING_OR_PARTIAL_PHASE5_SCOPED_ROLES' /tmp/role-repeat.err >/dev/null
          echo 'STAGE27_PG16_NON_SUPERUSER_ADMIN_ONLY_CREATOR=PASS ACTIVE_RUNTIME_MEMBERS=0 PROVIDER_CALLS=0 PHASE5_FREEZE=HOLD'
